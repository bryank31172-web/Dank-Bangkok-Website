<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="icon" href="/favicon.ico" sizes="32x32"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>🌿 DANK BKK — Staff Console</title>
<style>
:root{--bg:#060a07;--bg2:#0b120d;--panel:#101a12;--panel2:#16241a;--line:#1f3325;--line2:#294634;
--txt:#e8f5ec;--muted:#8fae9a;--muted2:#6d8a78;--green:#3ddc84;--green2:#7be389;--deep:#1db960;
--gold:#d9b25b;--danger:#ff6b6b;--font:'Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--font);display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
header h1{font-size:17px;margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .st{margin-left:auto;font-size:12px;color:var(--muted2)}
.pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--green2)}
.pill.warn{color:var(--gold);border-color:var(--gold)}
main{flex:1;display:flex;min-height:0}
/* login */
#login{margin:auto;background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:30px;max-width:340px;width:92%;text-align:center}
#login input{width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--txt);padding:12px;border-radius:10px;font-size:15px;outline:none;margin:14px 0;text-align:center}
.btn{background:linear-gradient(135deg,var(--green),var(--deep));color:#04180d;font-weight:800;padding:12px 18px;border-radius:11px;width:100%;font-size:15px}
/* tabs */
#tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg2)}
#tabs button{flex:1 1 92px;min-width:92px;padding:9px;border-radius:10px;border:1px solid var(--line2);color:var(--muted);font-weight:800;font-size:13px;position:relative}
#tabs button.active{border-color:var(--green);color:var(--green2);background:rgba(61,220,132,.1)}
#tabs .cnt{position:absolute;top:-7px;right:-4px;background:var(--gold);color:#20100a;font-size:10px;font-weight:900;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* orders */
.ocard{margin:10px 12px;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:13px 14px}
.ocard.done{opacity:.55}
.ocard .oh{display:flex;align-items:center;gap:8px}
.ocard .oid{font-weight:800;font-size:13.5px;color:var(--green2)}
.ocard .ot{margin-left:auto;font-size:11px;color:var(--muted2)}
.ocard .items{font-size:12.5px;color:var(--muted);margin:7px 0;line-height:1.55}
.ocard .tot{font-weight:800;font-size:15px}
.ocard .meta{font-size:12px;color:var(--gold);margin-top:3px;line-height:1.5}
.ocard .orow{display:flex;align-items:center;gap:8px;margin-top:9px}
.done-btn{background:linear-gradient(135deg,var(--green),var(--deep));color:#04180d;font-weight:800;font-size:12px;padding:8px 13px;border-radius:9px}
.grow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.grow:hover{background:var(--panel)}
.grow .chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--line2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px}
.grow.on .chk{background:var(--green);border-color:var(--green);color:#04180d}
.grow .gn{font-weight:700;font-size:13.5px}.grow .gm{font-size:11.5px;color:var(--muted)}
.ghdr{padding:12px 14px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.undo-btn{border:1px solid var(--line2);color:var(--muted);font-size:12px;padding:8px 13px;border-radius:9px}
/* list */
#listWrap{width:340px;border-right:1px solid var(--line);background:var(--bg2);flex-shrink:0;display:flex;flex-direction:column;min-height:0}
#list{flex:1;overflow-y:auto}
.trow{display:block;width:100%;text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);position:relative}
.trow:hover,.trow.sel{background:var(--panel)}
.trow .top{display:flex;gap:8px;align-items:center}
.trow .who{font-weight:800;font-size:14px}
.trow .when{margin-left:auto;font-size:11px;color:var(--muted2)}
.trow .prev{font-size:12.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .meta{font-size:11px;color:var(--gold);margin-top:3px}
.trow.unread::before{content:"";position:absolute;left:5px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;border:1px solid var(--line2);color:var(--muted)}
.badge.open{color:var(--green2);border-color:var(--green2)}
.badge.closed{color:var(--muted2)}
/* chat */
#chatWrap{flex:1;display:flex;flex-direction:column;min-width:0}
#chatHead{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--bg2)}
#chatHead .c-info{min-width:0}
#chatHead .c-name{font-weight:800;font-size:15px}
#chatHead .c-sub{font-size:12px;color:var(--muted)}
#chatHead .actions{margin-left:auto;display:flex;gap:8px}
.ghost{border:1px solid var(--line2);color:var(--muted);padding:8px 13px;border-radius:10px;font-size:12.5px;font-weight:700}
.ghost:hover{border-color:var(--green);color:var(--green2)}
.ghost.active{border-color:var(--green);color:var(--green2);background:rgba(61,220,132,.1)}
.ghost.danger:hover{border-color:var(--danger);color:var(--danger)}
.order-pop{position:fixed;right:16px;top:68px;z-index:250;width:min(360px,calc(100vw - 32px));
  background:var(--panel2);border:1px solid var(--gold);border-radius:14px;padding:13px 15px;
  box-shadow:0 12px 32px rgba(0,0,0,.55);display:none;text-align:left}
.order-pop.on{display:block;animation:orderIn .18s ease-out}
.order-pop b{display:block;color:var(--gold);margin-bottom:3px}.order-pop span{font-size:12.5px;color:var(--txt)}
@keyframes orderIn{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:70%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.m.customer{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.m.staff{background:linear-gradient(135deg,var(--green),var(--deep));color:#04180d;align-self:flex-end;border-bottom-right-radius:4px;font-weight:500}
.m.system{align-self:center;background:none;color:var(--muted2);font-size:12px;padding:2px}
.m .t{display:block;font-size:10.5px;opacity:.65;margin-top:4px}
#ctxBox{margin:0 16px 8px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--muted);max-height:130px;overflow-y:auto}
#ctxBox b{color:var(--gold)}
#replyBar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--bg2)}
#replyBar input{flex:1;background:var(--panel);border:1px solid var(--line2);color:var(--txt);padding:12px 14px;border-radius:11px;font-size:14px;outline:none}
#replyBar input:focus{border-color:var(--green)}
#sendBtn{background:linear-gradient(135deg,var(--green),var(--deep));color:#04180d;font-weight:800;padding:0 20px;border-radius:11px;font-size:14px}
.quicks{display:flex;gap:6px;padding:0 16px 10px;flex-wrap:wrap}
.quicks button{font-size:12px;padding:6px 11px;border-radius:99px;background:var(--panel);border:1px solid var(--line2);color:var(--green2)}
.emptyc{margin:auto;color:var(--muted2);text-align:center;font-size:14px}
.alert-health{padding:16px;display:grid;gap:12px}.alert-health .panel{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:14px}.health-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.health-item{border:1px solid var(--line2);border-radius:10px;padding:10px}.health-item.ok{border-color:var(--green)}.health-item.bad{border-color:var(--danger)}.accept-btn{background:var(--green);color:#03180b;font-weight:900;padding:11px 16px;border-radius:10px;flex:1}.mute-on{border-color:var(--gold)!important;color:var(--gold)!important}
/* login() sets display on these two inline, and an inline style beats a
   stylesheet — so without !important the chat pane stayed visible on a phone
   after logging in and its "Select a conversation" placeholder hung 90px past
   the right edge of every tab, leaving the whole console swipeable sideways
   into empty space. The media query has to win. */
@media(max-width:760px){ header .st{display:none} #alertBtn,#logoutBtn{flex-shrink:0;padding:8px 9px}
  #listWrap{width:100%} #chatWrap{display:none!important} body.chatting #listWrap{display:none!important} body.chatting #chatWrap{display:flex!important} }
</style>

<body>
<header>
  <span style="font-size:22px">🌿</span><h1>DANK BKK · Staff Console</h1>
  <span class="st" id="storeStat"></span>
  <button class="ghost" id="alertBtn" style="display:none" type="button">🔔 Enable push</button>
  <button class="ghost" id="muteBtn" style="display:none" type="button">🔊 Sound on</button>
  <!-- The staff key is already in this browser's storage, so analytics.html
       opens straight into the numbers rather than asking for it again. -->
  <a class="ghost" id="statsBtn" href="/analytics.html" style="display:none;text-decoration:none">📊 Numbers</a>
  <button class="ghost" id="logoutBtn" style="display:none" onclick="logout()">Log out</button>
</header>
<main id="main">
  <div id="login">
    <div style="font-size:40px">👨‍💼</div>
    <h2 style="margin:8px 0 2px">Staff login</h2>
    <p style="color:var(--muted);font-size:13px;margin:4px 0 0">Enter the staff key to see live customer chats.</p>
    <input id="keyInput" type="password" placeholder="Staff key" onkeydown="if(event.key==='Enter')login()">
    <button class="btn" onclick="login()">Enter console</button>
    <p id="loginErr" style="color:var(--danger);font-size:12.5px;height:14px;margin:10px 0 0"></p>
  </div>
  <div id="listWrap" style="display:none">
    <div id="tabs">
      <button id="tabChats" class="active" onclick="setTab('chats')">💬 Chats</button>
      <button id="tabOrders" onclick="setTab('orders')">🛒 Orders<span class="cnt" id="ordCnt" style="display:none">0</span></button>
      <button id="tabSales" onclick="setTab('sales')">💰 Sales</button>
      <button id="tabGifts" onclick="setTab('gifts')">🎁 Free gram</button>
      <button id="tabCount" onclick="setTab('count')">📦 Count</button>
      <button id="tabBox" onclick="setTab('box')">🧢 Box gifts</button>
      <button id="tabLab" onclick="setTab('lab')">🧪 Lab</button>
      <button id="tabMember" onclick="setTab('member')">👤 Member</button>
      <button id="tabAlerts" onclick="setTab('alerts')">🔔 Alert health</button>
    </div>
    <div id="list"></div>
  </div>
  <div id="chatWrap" style="display:none">
    <div class="emptyc" id="emptyc">Select a conversation ←</div>
  </div>
</main>
<script>
const API='/api/thread';
let KEY=localStorage.getItem('dankStaffKey')||'';
let cur=null, curSeq=0, pollT=null, listT=null, ordersT=null, lastSeen={};   // threadId -> last seq seen
let TAB='chats', ORDERS=[], knownOrders=new Set(), firstOrderLoad=true, LIVE=false;
let alertEnabled=localStorage.getItem('dankOrderAlerts')==='1', soundMuted=localStorage.getItem('dankAlertSoundMuted')==='1', audioCtx=null, orderPopT=null;
let ALERT_STATE=new Map(), alertStateT=null, alertSweepT=null;
const BASE_TITLE='🌿 DANK BKK — Staff Console';
const $=s=>document.querySelector(s);

/* Everything this console displays on the Orders and Chats tabs arrives from
   POST /api/order and POST /api/thread, and neither of those asks the caller
   for any credential — anyone on the internet can place an order or open a
   chat and choose exactly what text lands here. This page holds the staff key
   and can read every customer's name, phone and address, so a single script
   that runs in it hands the whole order book to whoever sent it.

   esc() used to cover only & < >. That is enough in text position but not in
   an attribute, and it was being used in attributes — href="tel:${…}",
   value="${…}" — where a customer "name" of  " onmouseover="…  simply closed
   the quote and carried on as markup. It now covers the quotes too, plus /
   so a value can never start closing a tag it was never inside. */
const ESC_MAP={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#x2F;'};
const esc=s=>String(s??'').replace(/[&<>"'\/]/g,c=>ESC_MAP[c]);

/* Slips and shift-count proof photos are rendered straight into <img src="…">.
   The API side only tests that the string begins with "data:image/", which
   something like  data:image/x," onerror="…  passes without trouble, so the
   console re-checks the shape itself: unless it reads as a base64 raster data
   URL it is not rendered at all. Returns '' for anything else, so callers can
   show a placeholder instead of a booby-trapped tag. */
const imgSrc=u=>{ const s=String(u??'');
  return /^data:image\/(png|jpe?g|gif|webp|bmp);base64,[A-Za-z0-9+\/=\s]+$/i.test(s)?esc(s):''; };

/* The staff key used to ride in the query string of every GET (…?key=…). A
   query string is the one part of a URL that gets written down everywhere: the
   platform's access log, any proxy in front of it, and the Referer header the
   browser attaches to anything the page loads or links to. The key is now sent
   as a header instead, where none of that happens.

   Two headers, for a reason. api/_auth.js — the shared check the rest of the
   API now goes through — reads the key from ?key=, from body.key, or from
   X-Staff-Key, so X-Staff-Key is the one that actually works today.
   Authorization: Bearer is the shape this console was asked to speak and the
   one to keep if the two ever converge; sending it costs a header and means
   that switch needs no change here. Both are safe to add without tripping a
   CORS preflight, because the console only ever calls its own origin.

   Two calls still have to put the key where it will be logged, and they are the
   ones api/thread.js reads by hand instead of through _auth.js: the open-thread
   poll (it decides from req.query.key whether to hand back the customer name,
   cart and transcript) and sending a reply (it decides from body.key whether
   the message is from staff or from the customer). Header-only there would not
   fail loudly — the context panel would quietly come back empty and staff
   replies would be filed as the customer's. So those two pass legacy:true and
   nothing else does. When thread.js moves onto _auth.js, delete the two
   arguments and the branches below, and the key is out of the logs for good. */
function authGet(url,k,legacy){
  const key=k??KEY;
  const sep=url.includes('?')?'&':'?';
  return fetch(legacy?url+sep+'key='+encodeURIComponent(key):url,
    {headers:{'X-Staff-Key':key,'Authorization':'Bearer '+key}});
}
function authPost(url,body,legacy){
  return fetch(url,{method:'POST',
    headers:{'Content-Type':'application/json','X-Staff-Key':KEY,'Authorization':'Bearer '+KEY},
    body:JSON.stringify(legacy?{...body,key:KEY}:body)});
}

const ago=t=>{const s=(Date.now()-t)/1e3; if(s<60)return 'now'; if(s<3600)return Math.floor(s/60)+'m'; if(s<86400)return Math.floor(s/3600)+'h'; return Math.floor(s/86400)+'d';};
function updateAlertButton(){
  const b=$('#alertBtn'); if(!b)return;
  const permission=('Notification' in window)?Notification.permission:'unsupported';
  b.textContent=alertEnabled&&permission==='granted'?'✅ Push on':permission==='denied'?'⛔ Push blocked':'🔔 Enable push';
  b.classList.toggle('active',alertEnabled&&permission==='granted');
}
function updateMuteButton(){
  const b=$('#muteBtn'); if(!b)return;
  b.textContent=soundMuted?'🔇 Sound muted':'🔊 Sound on';
  b.classList.toggle('mute-on',soundMuted);
}
function warmAudio(){ try{ if(!audioCtx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC)audioCtx=new AC(); }
  if(audioCtx?.state==='suspended') audioCtx.resume(); }catch(e){} }
function beep(){ try{ warmAudio(); if(!audioCtx||soundMuted)return; const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination); o.frequency.value=880; g.gain.setValueAtTime(.11,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.45); o.start(); o.stop(audioCtx.currentTime+.46);}catch(e){} }
function alarmBurst(){
  if(!ALERT_STATE.size)return;
  if(!soundMuted){ beep(); setTimeout(beep,650); setTimeout(beep,1300); }
  try{ navigator.vibrate?.([250,120,250,120,450]); }catch(e){}
}
function deviceLabel(){
  let label=localStorage.getItem('dankAlertDeviceLabel');
  if(!label){ label=(/iPhone|iPad|iPod/i.test(navigator.userAgent)?'iPhone/iPad':/Android/i.test(navigator.userAgent)?'Android':'Staff browser')+' · '+Math.random().toString(36).slice(-4).toUpperCase(); localStorage.setItem('dankAlertDeviceLabel',label); }
  return label;
}
function vapidBytes(value){
  const pad='='.repeat((4-value.length%4)%4), raw=atob((value+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...raw].map(ch=>ch.charCodeAt(0)));
}
async function disablePushNotifications(){
  try{
    const reg=await navigator.serviceWorker?.getRegistration('/');
    const sub=await reg?.pushManager?.getSubscription();
    if(sub){
      await fetch('/api/alert-subscriptions',{method:'DELETE',headers:{'Content-Type':'application/json','X-Staff-Key':KEY},body:JSON.stringify({endpoint:sub.endpoint})});
      await sub.unsubscribe();
    }
  }catch(e){}
  alertEnabled=false; localStorage.removeItem('dankOrderAlerts'); updateAlertButton();
}
async function enablePushNotifications(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){
    boxToast('Push notifications are not supported in this browser'); return false;
  }
  if(Notification.permission==='denied'){
    boxToast('Notifications are blocked. Enable them in this site’s phone settings.'); updateAlertButton(); return false;
  }
  const permission=await Notification.requestPermission();
  if(permission!=='granted'){ alertEnabled=false; updateAlertButton(); boxToast('Notifications were not allowed'); return false; }
  try{
    const reg=await navigator.serviceWorker.register('/sw.js',{scope:'/'});
    const health=await (await authGet('/api/alert-subscriptions')).json();
    if(!health.publicKey){ boxToast('Push keys are not configured on the server'); return false; }
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:vapidBytes(health.publicKey)});
    const saved=await authPost('/api/alert-subscriptions',{subscription:sub.toJSON(),label:deviceLabel()});
    if(!saved.ok) throw new Error('registration failed');
    alertEnabled=true; localStorage.setItem('dankOrderAlerts','1'); updateAlertButton();
    boxToast('Push notifications enabled on '+deviceLabel());
    return true;
  }catch(e){ boxToast('Could not enable push: '+e.message); return false; }
}
async function toggleAlerts(){ if(alertEnabled) await disablePushNotifications(); else await enablePushNotifications(); }
function toggleSound(){
  soundMuted=!soundMuted;
  localStorage.setItem('dankAlertSoundMuted',soundMuted?'1':'0');
  updateMuteButton(); if(!soundMuted) warmAudio();
  boxToast(soundMuted?'Sound muted — locked-screen notifications stay on':'Sound is on');
}
async function foregroundNotification(order){
  if(!alertEnabled||Notification.permission!=='granted')return;
  const items=(order.items||[]).map(i=>i.name).filter(Boolean);
  const body=`${items.slice(0,2).join(', ')}${items.length>2?' +'+(items.length-2)+' more':''} · ฿${order.total??order.subtotal??0} · ${order.customer?.name||'Customer'}`;
  try{
    const reg=await navigator.serviceWorker.ready;
    await reg.showNotification('DANK BKK · New order',{body,tag:'dank-order-'+order.orderId,data:{url:'/staff.html#orders',orderId:order.orderId},requireInteraction:true,renotify:true,icon:'/apple-touch-icon.png',vibrate:[250,120,250,120,450]});
  }catch(e){}
}
function showOrderAlert(fresh){
  if(!fresh.length)return;
  if(alertEnabled) alarmBurst();
  document.title=`(${fresh.length}) New order · DANK BKK`;
  let pop=$('#orderPop');
  if(!pop){ pop=document.createElement('button'); pop.id='orderPop'; pop.type='button'; pop.className='order-pop';
    const title=document.createElement('b'),detail=document.createElement('span'); pop.append(title,detail);
    pop.addEventListener('click',()=>{setTab('orders');pop.classList.remove('on');}); document.body.appendChild(pop); }
  pop.querySelector('b').textContent=fresh.length===1?'🛒 New order':`🛒 ${fresh.length} new orders`;
  const first=fresh[0], names=(first.items||[]).map(i=>i.name).filter(Boolean).slice(0,2).join(', ');
  pop.querySelector('span').textContent=`${names||first.orderId||''} · ฿${first.total??first.subtotal??0} · ${first.customer?.name||'Customer'}`;
  pop.classList.add('on'); clearTimeout(orderPopT); orderPopT=setTimeout(()=>pop.classList.remove('on'),10000);
  fresh.forEach(foregroundNotification);
}
async function syncAlertState(){
  if(!LIVE)return;
  try{
    const r=await authGet('/api/alert-state'); if(!r.ok)return;
    const list=(await r.json()).alerts||[], before=ALERT_STATE.size;
    ALERT_STATE=new Map(list.map(a=>[a.orderId,a]));
    if(ALERT_STATE.size&&before===0) alarmBurst();
    if(!ALERT_STATE.size){ document.title=BASE_TITLE; $('#orderPop')?.classList.remove('on'); }
    if(TAB==='orders') renderOrders();
  }catch(e){}
}
function startAlertLoops(){
  clearInterval(alertStateT); clearInterval(alertSweepT);
  syncAlertState();
  alertStateT=setInterval(syncAlertState,5000);
  alertSweepT=setInterval(async()=>{ if(!LIVE||!ALERT_STATE.size)return; alarmBurst(); try{await authGet('/api/alert-sweep');}catch(e){} },30000);
}
async function acceptAlert(id){
  const r=await authPost('/api/alert-accept',{orderId:id,acceptedBy:deviceLabel()});

async function login(){
  const k=$('#keyInput').value.trim()||KEY; if(!k){$('#loginErr').textContent='Enter the key';return;}
  let r;
  try{ r=await authGet(`${API}?list=1`,k); }
  catch(e){ $('#loginErr').textContent='Network error — check your connection'; return; }
  if(!r.ok){ $('#loginErr').textContent='Wrong key'; return; }
  KEY=k; localStorage.setItem('dankStaffKey',k); LIVE=true;
  const j=await r.json();
  $('#storeStat').innerHTML=j.redis?'<span class="pill">● storage: redis</span>':'<span class="pill warn">● storage: memory (set up Upstash for production)</span>';
  $('#login').style.display='none'; $('#listWrap').style.display='flex'; $('#chatWrap').style.display='flex'; $('#logoutBtn').style.display='';
  $('#alertBtn').style.display=''; $('#muteBtn').style.display=''; updateAlertButton(); updateMuteButton(); startAlertLoops();
  { const sb=$('#statsBtn'); if(sb) sb.style.display=''; }
  renderList(j.threads); startListPoll(); pollOrders(); startOrderPoll();
  /* The Telegram and LINE alerts link back here as staff.html#orders and
     staff.html#count. These were two separate ifs, so #orders matched the tab
     branch and then fell through to the thread branch as well: the console
     opened a conversation called "orders" that does not exist, and on a phone
     the `chatting` class it sets hid the order list behind an empty chat pane.
     Exactly one branch runs now. */
  const hash=decodeURIComponent(location.hash.slice(1));
  if(hash==='orders'||hash==='count'||hash==='gifts'||hash==='box'||hash==='lab'||hash==='chats'||hash==='member'||hash==='sales'||hash==='alerts') setTab(hash);
  /* A member card scanned with the phone's own camera lands here:
     staff.html#m=XXXXXXXXXXXX. The code rides in the fragment on purpose —
     fragments never leave the browser, so a customer's card code does not
     end up in an access log the way a query string would. */
  else if(/^m=/i.test(hash)) { setTab('member'); lookupMember(hash.slice(2)); }
  else if(hash.length>2) openThread(hash);
  /* Scanning a second card while the console is already open only changes
     the fragment, which does not reload the page. Without this, the second
     customer would never appear. */
  window.addEventListener('hashchange',()=>{ const h=decodeURIComponent(location.hash.slice(1));
    if(/^m=/i.test(h)){ setTab('member'); lookupMember(h.slice(2)); } });
}

/* ---- Box gifts: stock for the things that ride along free ---------------
   Every 28 grams of flower in an order earns a DANK Custom Box, and the box
   brings the hash, the brownie, the jelly, the Backwoods, the papers, the tee
   and the hat with it. api/order.js takes them off the ledger the moment the
   order lands. This tab is where the numbers behind that ledger come from —
   and without it they never arrive: a gift whose stock is still blank is never
   counted and can never report short, and a gift with no POS product linked is
   skipped when the order is pushed to StoreHub, so its shop stock never moves.

   Two different saves, on purpose. Linking a gift to a POS product edits the
   list and leaves the counter alone. Setting a stock number is a restock: it
   zeroes the issued count, because "there are forty hats in the shop" means
   counting starts again from now, not that forty is a running total. */
let BOX=null, BOXPROD=[], boxBusy=false;

function boxToast(msg){
  let t=$('#boxToast');
  if(!t){ t=document.createElement('div'); t.id='boxToast';
    t.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;'
      +'background:var(--panel2);border:1px solid var(--line2);color:var(--txt);padding:10px 16px;'
      +'border-radius:11px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.5);'
      +'max-width:90vw;text-align:center;pointer-events:none;transition:opacity .2s';
    document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(boxToast._t); boxToast._t=setTimeout(()=>{ t.style.opacity='0'; },2600);
}

async function loadBoxGifts(){
  const el=$('#list'); el.innerHTML='<div class="ghdr">Loading…</div>';
  try{
    /* The product list is a convenience, not a requirement — it turns the POS
       field from "type a 24-character id" into a picker. If it fails the row
       falls back to a text input rather than the tab failing with it. */
    const [gr,pr]=await Promise.all([ authGet('/api/boxgifts'), fetch('/api/products').catch(()=>null) ]);
    if(!gr.ok){ el.innerHTML='<div class="ghdr">Could not load the box gifts.</div>'; return; }
    BOX=await gr.json();
    if(!BOX||!BOX.staff){ el.innerHTML='<div class="ghdr">The server did not accept the staff key for this tab. Log out and back in.</div>'; return; }
    BOXPROD=[];
    if(pr&&pr.ok){ try{ const j=await pr.json(); if(Array.isArray(j)) BOXPROD=j; }catch(e){} }
    renderBoxGifts();

}

function posOptions(sel){
  const by={};
  BOXPROD.forEach(p=>{ if(!p||!p.shId) return; const c=p.category||'Other'; (by[c]=by[c]||[]).push(p); });
  const cats=Object.keys(by).sort();
  const known=cats.some(c=>by[c].some(p=>p.shId===sel));
  return '<option value="">— not linked, POS stock will not move —</option>'
    + (sel&&!known?`<option value="${esc(sel)}" selected>currently ${esc(sel)}</option>`:'')
    + cats.map(c=>`<optgroup label="${esc(c)}">`
        + by[c].map(x=>`<option value="${esc(x.shId)}"${x.shId===sel?' selected':''}>${esc(x.name)}</option>`).join('')
        + '</optgroup>').join('');
}

    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
      <div style="font-size:11.5px;color:var(--muted2);white-space:nowrap">POS product</div>

        ? `<select data-act="box-sh" data-id="${esc(g.id)}" style="${BOXINP};flex:1;min-width:0;font-size:12.5px">${posOptions(g.shId||'')}</select>`

    </div>

function renderBoxGifts(){

async function boxSetStock(id){
  if(boxBusy) return;
  const inp=$(`[data-act="box-stock-in"][data-id="${CSS.escape(id)}"]`);
  if(!inp) return;
  const raw=String(inp.value||'').trim();
  /* Blank is not zero. null stops tracking the gift altogether; 0 says the
     shop genuinely has none of it left and every box should report short. */
  const stock = raw==='' ? null : Number(raw);
  if(stock!==null && !Number.isFinite(stock)){ boxToast('Enter a number, or leave it blank to stop tracking'); return; }
  boxBusy=true;
  try{
    const r=await authPost('/api/boxgifts',{action:'restock',id,stock});
    if(!r.ok){ boxToast('Could not save — check the connection'); return; }
    BOX={...(await r.json()),staff:true}; renderBoxGifts();
    boxToast(stock===null?'No longer tracked':'Set to '+stock+' — counting starts from now');
  }catch(e){ boxToast('Could not save — check the connection'); }
  finally{ boxBusy=false; }
}

async function boxSetPos(id,shId){
  if(boxBusy) return;
  /* A save rewrites the list but not the counters, so linking a product here
     does not lose how many have already gone out. */
  const gifts=(BOX.gifts||[]).map(g=>g.id===id?{...g,shId:String(shId||'')}:g);
  boxBusy=true;
  try{
    const r=await authPost('/api/boxgifts',{action:'save',gifts,threshold:BOX.threshold});
    if(!r.ok){ boxToast('Could not save — check the connection'); return; }
    BOX={...(await r.json()),staff:true}; renderBoxGifts();
    boxToast(shId?'Linked — POS stock moves with the order':'Unlinked from the POS');
  }catch(e){ boxToast('Could not save — check the connection'); }
  finally{ boxBusy=false; }
}

async function boxSetThresh(){
  if(boxBusy) return;
  const el=$('#boxThresh'); const v=Number(String(el&&el.value||'').trim());
  if(!Number.isFinite(v)||v<1){ boxToast('Enter how many grams earn one box'); return; }
  boxBusy=true;
  try{
    const r=await authPost('/api/boxgifts',{action:'save',gifts:BOX.gifts||[],threshold:v});
    if(!r.ok){ boxToast('Could not save — check the connection'); return; }
    BOX={...(await r.json()),staff:true}; renderBoxGifts();
    boxToast('One box per '+v+'g of flower');
  }catch(e){ boxToast('Could not save — check the connection'); }
  finally{ boxBusy=false; }
}

/* ---- Lab: the real certificate, typed in from the paperwork -------------
   The product page draws a potency card for every strain. With nothing on file
   it derives the numbers from the strain database and says so on its face:
   hollow band, "Estimated from strain data — not a lab result". The moment a
   certificate is saved here that same card turns into a lab report — solid
   band, method, test date, lot number, heavy-metal clearance, and the measured
   figures instead of the menu's.

   Which is why this tab asks for the certificate rather than offering to fill
   anything in. Everything except the cannabinoid percentages is optional and a
   blank field is left blank, never guessed: a report with no test date shows
   no test date. Type only what the paperwork actually says, and the card is
   only ever as confident as the paperwork is.

   Deleting a report is not destructive — the product falls back to the
   estimated card, which is where it started. */
let LABP=[], LABR={}, LABSEL='', labBusy=false;

/* Common cannabis terpenes, offered as a datalist so the names stay spelled
   the same way across products - the card prints them verbatim. */
const LABNAMES=["Myrcene","Limonene","β-Caryophyllene","Linalool","α-Pinene","β-Pinene","Terpinolene","Humulene","Ocimene","α-Bisabolol","trans-Nerolidol","Guaiol","Valencene","Geraniol","Camphene","Eucalyptol","Geranyl Acetate"];

/* Same rule as the storefront and api/_lab.js: lowercase, drop (bracketed)
   words, keep letters, digits and hyphens. A product id already looks like
   this, which is why an id is the preferred key. */
const labKey=s=>String(s||'').toLowerCase().replace(/\([^)]*\)/g,'').replace(/[^a-z0-9-]/g,'').slice(0,64);

/* Merch, beer and the kitchen have nothing to test. */
const labTestable=p=>p&&!/^(Beer|Accessories|Merch|Drinks|Food)$/i.test(p.category||'');

async function loadLab(){
  const el=$('#list'); el.innerHTML='<div class="ghdr">Loading…</div>';
  try{
    const [pr,lr]=await Promise.all([ fetch('/api/products').catch(()=>null), fetch('/api/lab').catch(()=>null) ]);
    LABP=[]; LABR={};
    if(pr&&pr.ok){ try{ const j=await pr.json(); if(Array.isArray(j)) LABP=j.filter(labTestable); }catch(e){} }
    if(lr&&lr.ok){ try{ const j=await lr.json(); LABR=(j&&j.reports)||{}; }catch(e){} }
    /* /api/lab missing is the one failure worth naming: it means the api
       folder on GitHub is behind this page, and every save would 404 with no
       clue why. */
    if(!lr||!lr.ok){ el.innerHTML='<div class="ghdr">The /api/lab endpoint is not on this deployment yet — upload the api folder and reload. Nothing typed here would save.</div>'; return; }
    if(!LABP.length){ el.innerHTML='<div class="ghdr">Could not load the product list.</div>'; return; }
    if(!LABSEL||!LABP.some(x=>labKey(x.id)===LABSEL)) LABSEL=labKey(LABP[0].id);
    renderLab();
  }catch(e){ el.innerHTML='<div class="ghdr">Could not load the lab reports.</div>'; }
}

/* A saved report may be keyed by product id or by flattened name, because
   lab-db.json in the repo can use either. Look for both. */
function labFor(prod){
  if(!prod) return null;
  return LABR[labKey(prod.id)] || LABR[labKey(prod.name)] || null;
}

function labProdOptions(){
  const by={};
  LABP.forEach(p=>{ const c=p.category||'Other'; (by[c]=by[c]||[]).push(p); });
  return Object.keys(by).sort().map(c=>`<optgroup label="${esc(c)}">`
    + by[c].map(x=>`<option value="${esc(labKey(x.id))}"${labKey(x.id)===LABSEL?' selected':''}>${labFor(x)?'✓ ':''}${esc(x.name)}</option>`).join('')
    + '</optgroup>').join('');
}

const LABIN='background:var(--bg2);border:1px solid var(--line2);color:var(--txt);padding:7px 8px;border-radius:8px;outline:none;font-size:13px;width:100%;box-sizing:border-box';
const LABLBL='display:block;font-size:11px;color:var(--muted2);margin:0 0 3px;font-weight:700;letter-spacing:.3px;text-transform:uppercase';

function labField(k,label,val,ph){
  return `<div><label style="${LABLBL}">${esc(label)}</label>
    <input data-lab="${esc(k)}" value="${esc(val??'')}" placeholder="${esc(ph||'')}" style="${LABIN}"></div>`;
}
function labNum(k,label,val){
  return `<div><label style="${LABLBL}">${esc(label)}</label>
    <input data-lab="${esc(k)}" inputmode="decimal" value="${esc(val??'')}" placeholder="—" style="${LABIN};text-align:center"></div>`;
}

function renderLab(){
  const prod=LABP.find(x=>labKey(x.id)===LABSEL)||LABP[0];
  const r=labFor(prod)||{};
  const c=r.cannabinoids||{};
  const t=Array.isArray(r.terpenes)?r.terpenes:[];
  const saved=Object.keys(LABR).length;
  /* align-items:end keeps the boxes on one line when a label wraps to two -
     without it a long caption pushes its own input half a row lower than its
     neighbours and the block reads as broken. */
  const grid='display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:9px;margin:8px 0 0;align-items:end';

  $('#list').innerHTML=
    `<div class="ghdr">Type what the certificate says and the product page stops estimating: the card turns into a full lab report with the method, the date, the lot number and the measured numbers.
      Leave a field blank and it simply is not shown — nothing here is filled in for you.
      <b>${saved}</b> product${saved===1?'':'s'} currently ${saved===1?'has':'have'} a certificate on file.</div>

    <div class="ocard" style="padding:12px;margin:8px 12px">
      <label style="${LABLBL}">Product</label>
      <select data-act="lab-prod" style="${LABIN};font-size:13.5px">${labProdOptions()}</select>
      <div style="font-size:11.5px;color:var(--muted2);margin-top:6px">
        ${prod?esc(prod.category||'')+' · menu says THC '+esc(prod.thcLabel||prod.thc||'—'):''}
        ${r.updated?' · <b style="color:var(--green2)">certificate saved '+esc(r.updated)+'</b>':' · <span style="color:var(--gold)">no certificate — the card is estimating</span>'}
      </div>
    </div>

    <div class="ocard" style="padding:12px;margin:8px 12px">
      <div style="font-weight:800;font-size:13px;margin-bottom:2px">The paperwork</div>
      <div style="font-size:11.5px;color:var(--muted2);margin-bottom:8px">Copy the header of the certificate. The date is stored exactly as you type it.</div>
      <div style="${grid}">
        ${labField('method','Method',r.method,'HPLC')}
        ${labField('tested','Tested',r.tested,'29/07/26')}
        ${labField('sample','Sample',r.sample,'Dried flower')}
        ${labField('lot','Lot no.',r.lot,'N 014')}
      </div>
      <div style="${grid}">
        <div><label style="${LABLBL}">Product type</label>
          <select data-lab="kind" style="${LABIN}">

function labVal(k){ const el=$(`[data-lab="${k}"]`); return el?String(el.value||'').trim():''; }

async function labSave(){
  if(labBusy) return;
  const prod=LABP.find(x=>labKey(x.id)===LABSEL); if(!prod) return;
  const can={};
  ['d9thc','totalThc','total','thcv','cbg','cbc','cbd','cbn'].forEach(k=>{
    const v=labVal(k); if(v!=='') can[k]=Number(v);
  });
  const bad=Object.keys(can).filter(k=>!Number.isFinite(can[k])||can[k]<0||can[k]>100);
  if(bad.length){ boxToast('Check '+bad[0]+' — percentages only, 0 to 100'); return; }
  if(!Object.keys(can).length){ boxToast('Type at least one cannabinoid percentage'); return; }

  const terpenes=[];
  for(let i=0;i<5;i++){
    const n=labVal('t'+i+'n'), v=labVal('t'+i+'p');
    if(!n&&v==='') continue;
    /* Half a row is almost always a typo rather than an intention, and a
       terpene with no number cannot be drawn. Say which row. */
    if(!n||v===''){ boxToast('Terpene '+(i+1)+' needs both a name and a percentage'); return; }
    const pct=Number(v);
    if(!Number.isFinite(pct)||pct<0||pct>20){ boxToast('Terpene '+(i+1)+': percentages only, 0 to 20'); return; }
    terpenes.push({name:n,pct});
  }

  const report={ cannabinoids:can, terpenes, metals:!!($('#labMetals')&&$('#labMetals').checked) };
  ['kind','method','tested','sample','lot','aroma'].forEach(k=>{ const v=labVal(k); if(v) report[k]=v; });

  labBusy=true;
  try{
    const res=await authPost('/api/lab',{action:'save',product:prod.id,report});
    const j=await res.json().catch(()=>null);
    if(!res.ok){ boxToast((j&&j.error)||'Could not save — check the connection'); return; }
    LABR=(j&&j.reports)||LABR; renderLab();
    boxToast('Saved — '+prod.name+' now shows a lab report');
  }catch(e){ boxToast('Could not save — check the connection'); }
  finally{ labBusy=false; }
}

async function labDelete(){
  if(labBusy) return;
  const prod=LABP.find(x=>labKey(x.id)===LABSEL); if(!prod) return;
  if(!confirm('Remove the certificate for '+prod.name+'? The card goes back to showing an estimate.')) return;
  labBusy=true;
  try{
    const res=await authPost('/api/lab',{action:'delete',product:prod.id});
    const j=await res.json().catch(()=>null);
    if(!res.ok){ boxToast((j&&j.error)||'Could not delete — check the connection'); return; }
    LABR=(j&&j.reports)||{}; renderLab();
    boxToast('Removed — back to an estimate');
  }catch(e){ boxToast('Could not delete — check the connection'); }
  finally{ labBusy=false; }
}

let _slipUpId="";
function staffResize(file,maxW,q){ return new Promise((ok,err)=>{ const fr=new FileReader();
  fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const sc=Math.min(1,maxW/img.width); const c=document.createElement('canvas');
    c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    ok(c.toDataURL('image/jpeg',q)); }; img.onerror=err; img.src=fr.result; }; fr.onerror=err; fr.readAsDataURL(file); }); }
function staffUploadSlip(id){ _slipUpId=id; let inp=document.getElementById('staffSlipInput');
  if(!inp){ inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.id='staffSlipInput'; inp.style.display='none';
    inp.onchange=async()=>{ const f=inp.files&&inp.files[0]; inp.value=''; if(!f||!_slipUpId) return;
      try{ const dataUrl=await staffResize(f,1000,0.7);
        // Sent with the key: /api/slip rate-limits anonymous uploads to a
        // handful per order, which is right for customers and wrong for a
        // member of staff working through a stack of transfers.
        const r=await authPost('/api/slip',{orderId:_slipUpId,image:dataUrl});
        if(r.ok){ alert('✅ Proof uploaded for '+_slipUpId); pollOrders(); }
        else { const j=await r.json().catch(()=>({})); alert('⚠️ '+(j.error||'Upload failed')); }
      }catch(e){ alert('⚠️ Upload failed'); } };
    document.body.appendChild(inp); }
  inp.click();
}

/* The order poll was started with a bare setInterval() whose handle nobody
   kept. Anything that called login() again — and the tab-switching path did —
   stacked a second timer on the first, so a console left open all shift ended
   up asking /api/orders several times a second without anyone noticing. Each
   of the three polls now has exactly one live handle, cleared before it is
   replaced. Chat and thread polls stop while the tab is in the background. If
   staff explicitly enable alerts, only the order poll continues at a slower
   30-second interval; external LINE/Telegram/WhatsApp pushes remain the

async function pull(first){
  if(!cur) return;
  try{
    const r=await authGet(`${API}?threadId=${encodeURIComponent(cur)}&since=${encodeURIComponent(curSeq)}`,null,true);
    if(!r.ok) return;
    const j=await r.json();
    if(first){
      $('#cName').textContent=j.customer?.name||j.customer?.contact||cur;
      $('#cSub').textContent=`${j.customer?.contact||''} · ticket ${cur} · ${j.status}`;
      let ctx='';
      if(j.cart?.length) ctx+=`<b>🛒 Cart (฿${esc((j.subtotal||0).toLocaleString())}):</b> `+j.cart.map(c=>`${esc(c.name)} ×${esc(c.qty)}`).join(' · ')+'<br>';
      if(j.transcript?.length) ctx+=`<b>🤖 AI chat before transfer:</b><br>`+j.transcript.map(m=>`${m.role==='user'?'🧑':'🤖'} ${esc(m.text)}`).join('<br>');
      if(ctx){ $('#ctxBox').innerHTML=ctx; $('#ctxBox').style.display='block'; }
    }
    let gotCustomer=false;
    for(const m of j.messages||[]){
      curSeq=Math.max(curSeq,m.seq);
      addMsg(m);
      if(m.from==='customer'&&!first){ gotCustomer=true; }
    }
    lastSeen[cur]=curSeq;
    if(gotCustomer) beep();
  }catch(e){}
}
/* A chat message is whatever the person on the other end typed, so it is built
   out of text nodes rather than markup — nothing here can be mistaken for a
   tag. `from` decides the bubble style and used to be pasted into className
   unchecked; it is now matched against the three classes the stylesheet
   actually defines. The pre-wrap on .m keeps line breaks readable. */
function addMsg(m){
  const from=m.from==='staff'?'staff':m.from==='system'?'system':'customer';
  const d=document.createElement('div'); d.className='m '+from;
  d.textContent=String(m.text??'');
  const t=document.createElement('span'); t.className='t';
  t.textContent=new Date(m.at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  d.appendChild(t);
  $('#msgs').appendChild(d); $('#msgs').scrollTop=$('#msgs').scrollHeight;
}

function countRow(p){

     from /api/products, and the code lands in three attributes as well as in
     the text — so it all goes through esc() and the row keeps its code in a

// Update ONLY the variance line in place — never re-render the row, or we'd
// destroy the <input> the user is typing in (loses focus after each keystroke).
function setCount(code,val){ COUNT_VALS[code]=val; updateVariance(code); }
function updateVariance(code){
  const p=COUNT_PRODUCTS.find(x=>x.code===code); if(!p)return;
  const el=document.getElementById('var-'+code); if(!el)return;
  const v=COUNT_VALS[code];
  const variance=(v!==undefined&&v!=='')?(Number(v)-Number(p.stock||0)):null;
  el.style.color=variance===null?'var(--muted2)':(variance===0?'var(--green2)':(variance>0?'var(--gold)':'var(--danger)'));

  selectedCode=code;

function onScan(raw){

   customer can read out when a screen is cracked or a camera won't focus. The

/* One box for everything staff might have in their hand: the whole scanned
   link, the code alone, the code with its dashes, or the phone number. Letters
   mean it is a card code — no phone number has any. */
function memberQuery(raw){
  let s=String(raw||'').trim();
  const m=s.match(/[#&?]m=([0-9A-Za-z-]+)/) || s.match(/^m=([0-9A-Za-z-]+)$/i);
  if(m) return {code:m[1].toUpperCase().replace(/[^0-9A-Z]/g,'')};
  const flat=s.toUpperCase().replace(/[^0-9A-Z]/g,'');
  if(/[A-Z]/.test(flat)) return {code:flat};
  const ph=s.replace(/[^0-9]/g,'');
  return ph.length>=6 ? {phone:ph} : {};
}

/* ---- camera scan (lazy-load jsQR) ---- */
let camStream=null, camRAF=null;
/* This pulls third-party code into a page that is holding the staff key, so
   whatever cdnjs serves gets to read the order book. It needs an integrity=
   hash so the browser refuses a file that is not the exact 1.4.0 build we
   expect. The hash is missing because it could not be computed here: outbound
   HTTPS in this environment is blocked by egress policy, and a guessed or
   copied hash is worse than none — it would silently break the camera scanner
   the first time it was wrong. Compute it once from the exact URL below and
   paste it in as s.integrity:
     curl -s https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js | openssl dgst -sha384 -binary | openssl base64 -A
   crossOrigin is set already, because integrity only takes effect on a
   CORS-enabled request — with it in place, adding the hash is a one-line
   change. The version is pinned in the URL, so the hash will not drift. */
function loadJsQR(){ return new Promise((ok)=>{ if(window.jsQR)return ok(); const s=document.createElement('script');
  s.crossOrigin='anonymous'; s.referrerPolicy='no-referrer';
  s.src='https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js'; s.onload=ok; s.onerror=ok; document.head.appendChild(s); }); }
/* The Count tab was the only caller when this was written, so the video
   element and the result handler were both hard-coded. The member card needs
   the same camera in a different tab, so both are arguments now, defaulting to
   what Count already passed — its onclick keeps working untouched. */
let camBoxSel='#camBox';
async function startCamScan(handler, vidSel, boxSel){
  const onHit=(typeof handler==='function')?handler:onScan;
  vidSel=vidSel||'#camVid'; camBoxSel=boxSel||'#camBox';
  await loadJsQR();
  if(!window.jsQR){ alert('Camera scanner library unavailable — a USB scanner or manual entry still works.'); return; }
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=$(vidSel); v.srcObject=camStream; await v.play(); $(camBoxSel).style.display='block';
    const cv=document.createElement('canvas'), cx=cv.getContext('2d');
    const tick=()=>{ if(!camStream)return; if(v.readyState===v.HAVE_ENOUGH_DATA){
        cv.width=v.videoWidth; cv.height=v.videoHeight; cx.drawImage(v,0,0,cv.width,cv.height);
        const img=cx.getImageData(0,0,cv.width,cv.height); const q=window.jsQR(img.data,cv.width,cv.height);
        if(q&&q.data){ stopCamScan(); onHit(q.data); return; } }
      camRAF=requestAnimationFrame(tick); };
    tick();
  }catch(e){ alert('Could not open camera: '+e.message); }
}
function stopCamScan(){ if(camRAF)cancelAnimationFrame(camRAF); camRAF=null;
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  const box=$(camBoxSel); if(box)box.style.display='none'; }

/* ---- Web Serial scale ---- */
async function connectScale(){
  if(!('serial' in navigator)){ alert('Web Serial is not supported on this browser. Use Chrome or Edge on desktop or Android.'); return; }
  try{
    scalePort=await navigator.serial.requestPort();
    await scalePort.open({baudRate:9600});
    $('#scaleRead').textContent='scale: connected…';
    scaleKeep=true; readScaleLoop();
  }catch(e){ $('#scaleRead').textContent='scale: '+(e.message||'failed'); }
}
async function readScaleLoop(){
  const dec=new TextDecoderStream(); const done=scalePort.readable.pipeTo(dec.writable).catch(()=>{});
  scaleReader=dec.readable.getReader(); let buf='';
  try{
    while(scaleKeep){
      const {value,done:d}=await scaleReader.read(); if(d)break;
      buf+=value; let i;
      while((i=buf.search(/[\r\n]/))>=0){ const line=buf.slice(0,i); buf=buf.slice(i+1); parseScale(line); }
    }
  }catch(e){}
}
function parseScale(line){
  const m=String(line).match(/(-?\d+(?:\.\d+)?)/);
  if(m){ lastWeight=parseFloat(m[0]); const el=$('#scaleRead'); if(el)el.textContent='scale: '+lastWeight+' g'; }
}
function applyScale(code){
  if(lastWeight===null){ alert('No scale reading yet. Connect the scale and place product on it.'); return; }
  const row=document.getElementById('row-'+code); const inp=row&&row.querySelector('input');
  if(inp) inp.value=String(lastWeight);   // reflect it in the field (setCount no longer re-renders the row)
  setCount(code, String(lastWeight));
}

/* ---- proof photos ---- */

/* ---- submit ---- */
async function submitCount(){
  if(!COUNT_PROOFS.length){ alert('Add at least one proof-of-existence photo before closing the shift.'); return; }
  const lines=COUNT_PRODUCTS.map(p=>({code:p.code,name:p.name,expected:Number(p.stock||0),counted:(COUNT_VALS[p.code]??'')}));
  const counted=lines.filter(l=>l.counted!=='').length;
  if(!counted){ alert('Enter at least one counted quantity.'); return; }
  if(!confirm(`Close shift?\n${counted}/${lines.length} items counted · ${COUNT_PROOFS.length} proof photo(s).`)) return;
  try{
    const r=await authPost('/api/count',{staff:'DANK Team',lines,photos:COUNT_PROOFS});
    const j=await r.json();
    if(r.ok){ alert(`✅ Shift count saved (${j.id}). Variances: ${j.varianceCount}.`); COUNT_VALS={};COUNT_PROOFS=[];selectedCode=null; renderCountUI(); }
    else alert('⚠️ '+(j.error||'Failed to save'));
  }catch(e){ alert('⚠️ Network error'); }
}

async function viewCount(id){
  try{

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">${photos.map(src=>`<img src="${src}" style="width:120px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line2)">`).join('')||'<span style="color:var(--muted2)">No photos</span>'}</div>
      <div style="font-weight:800;margin-bottom:6px">Variances</div>

    </div>`;

/* ============================================================
   💰 SALES — the takings, the bills behind them, and who owes
   ------------------------------------------------------------
   Three views over one endpoint. "Bills" is the transaction list
   with a full drill-down on tap; "Day totals" is the same money
   added up per day and per payment method; "Owed" is every
   customer with an unsettled wallet order, an unpaid online
   order or a tab staff opened by hand.

   Cash is never counted as owing — see the note at the top of
   api/sales.js. The reason is printed on the Owed view too,
   because a number that looks too low is only trustworthy if it
   says what it left out.
   ============================================================ */
let SALES=null, OWED=null, SALES_DAYS=7, SALES_VIEW='bills';
/* The month report defaults to the month that just finished, because that is
   the one anybody asks about — you close July, then you look at July. */
let MONTH=null, SALES_MONTH=(function(){ const n=new Date(); const d0=new Date(n.getFullYear(), n.getMonth()-1, 1);
  return d0.getFullYear()+'-'+String(d0.getMonth()+1).padStart(2,'0'); })();
const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthLabel(s){ const m=String(s||'').split('-'); return (MONTH_NAMES[Number(m[1])-1]||s)+' '+m[0]; }
function lastMonths(n){ const out=[], now=new Date();
  for(let i=1;i<=n;i++){ const d0=new Date(now.getFullYear(), now.getMonth()-i+1, 1);
    out.push(d0.getFullYear()+'-'+String(d0.getMonth()+1).padStart(2,'0')); }
  return out; }
const SALEIN='background:var(--bg2);border:1px solid var(--line2);color:var(--txt);padding:9px 11px;border-radius:9px;outline:none;font-size:14px';

function salesErr(r){
  const el=$('#list');
  if(r.status===401){ el.innerHTML='<div class="ghdr">Your staff key was refused. Log out and back in.</div>'; return; }
  if(r.status===503){ el.innerHTML='<div class="ghdr">Sales are not switched on for this deployment — STAFF_KEY is not set.</div>'; return; }
  el.innerHTML='<div class="ghdr">Could not load the takings (error '+esc(r.status)+').</div>';
}

async function loadSales(){
  const el=$('#list');
  if(!SALES && !OWED && !MONTH) el.innerHTML='<div class="ghdr">Loading the takings…</div>';
  try{
    if(SALES_VIEW==='owed'){
      const r=await authGet('/api/sales?owed=1');
      if(!r.ok) return salesErr(r);
      OWED=await r.json();
    } else if(SALES_VIEW==='month'){
      const r=await authGet('/api/sales?month='+encodeURIComponent(SALES_MONTH));
      if(!r.ok) return salesErr(r);
      MONTH=await r.json();
    } else {
      const r=await authGet('/api/sales?days='+SALES_DAYS);
      if(!r.ok) return salesErr(r);
      SALES=await r.json();
    }
  }catch(e){ el.innerHTML='<div class="ghdr">No connection — try again.</div>'; return; }
  renderSales();
}

function salesTile(v,label,colour,sub){
  return '<div style="flex:1;min-width:88px;background:var(--bg2);border:1px solid var(--line2);border-radius:11px;padding:10px 8px;text-align:center">'+
    '<div style="font-size:19px;font-weight:900;color:'+colour+'">'+esc(v)+'</div>'+
    '<div style="font-size:10.5px;color:var(--muted2);font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-top:2px">'+esc(label)+'</div>'+
    (sub?'<div style="font-size:10.5px;color:var(--muted);margin-top:2px">'+esc(sub)+'</div>':'')+'</div>';
}
function salesChip(label,act,val,on){
  return '<button class="undo-btn" data-act="'+act+'" data-v="'+esc(val)+'" style="padding:6px 11px;font-size:12px'+(on?';border-color:var(--green);color:var(--green2);background:rgba(61,220,132,.1)':'')+'">'+esc(label)+'</button>';
}

function renderSales(){
  const el=$('#list');
  const views='<div style="display:flex;gap:6px;flex-wrap:wrap">'+
      salesChip('🧾 Bills','sales-view','bills',SALES_VIEW==='bills')+
      salesChip('📅 Day totals','sales-view','days',SALES_VIEW==='days')+
      salesChip('📆 Month','sales-view','month',SALES_VIEW==='month')+
      salesChip('💸 Owed','sales-view','owed',SALES_VIEW==='owed')+
    '</div>';
  /* The month view swaps the rolling-window chips for calendar months — a
     rolling 30 days and "July" are different questions and mixing the two
     controls is how you end up reporting the wrong number. */
  if(SALES_VIEW==='month'){
    const chips=lastMonths(6).map(m=>salesChip(monthLabel(m),'sales-month',m,SALES_MONTH===m)).join('');
    el.innerHTML='<div class="ghdr" style="padding-bottom:10px">'+views+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px">'+chips+'</div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px">'+
        '<button class="undo-btn" data-act="month-csv" data-v="bills" style="padding:6px 11px;font-size:12px">⬇ Bills</button>'+
        '<button class="undo-btn" data-act="month-csv" data-v="products" style="padding:6px 11px;font-size:12px">⬇ Avg price per product</button>'+
        '<button class="undo-btn" data-act="month-csv" data-v="spenders" style="padding:6px 11px;font-size:12px">⬇ Top spenders</button>'+
      '</div></div><div id="salesBody"></div>';
    const b2=$('#salesBody');
    if(!MONTH){ b2.innerHTML='<div class="ghdr">Loading…</div>'; return; }
    return renderMonth(b2);
  }
  const periods=SALES_VIEW==='owed'?'':'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px">'+
      salesChip('Today','sales-days','1',SALES_DAYS===1)+
      salesChip('7 days','sales-days','7',SALES_DAYS===7)+
      salesChip('30 days','sales-days','30',SALES_DAYS===30)+
      salesChip('90 days','sales-days','90',SALES_DAYS===90)+
      '<button class="undo-btn" data-act="sales-csv" style="padding:6px 11px;font-size:12px">⬇ CSV</button>'+
    '</div>';
  el.innerHTML='<div class="ghdr" style="padding-bottom:10px">'+views+periods+'</div><div id="salesBody"></div>';
  const body=$('#salesBody');
  if(SALES_VIEW==='owed') return renderOwed(body);
  if(!SALES){ body.innerHTML='<div class="ghdr">Loading…</div>'; return; }
  if(SALES_VIEW==='days') return renderDayTotals(body);
  return renderBills(body);
}

function salesHead(){
  const s=(SALES&&SALES.summary)||{};
  return '<div class="ocard" style="padding:13px 12px">'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
      salesTile(baht(s.gross),'taken','var(--gold)')+
      salesTile(s.orders||0,'bills','var(--txt)')+
      salesTile(baht(s.average),'average bill','var(--green2)')+
      salesTile(baht(s.collected),'in hand','var(--green2)')+
      salesTile(baht(s.owed),'still owed',(s.owed>0?'var(--danger)':'var(--muted2)'),(s.owedBills||0)+' bill'+((s.owedBills===1)?'':'s'))+
    '</div>'+
    '<div style="font-size:11.5px;color:var(--muted2);margin-top:9px;line-height:1.55">'+
      esc('Last '+(SALES.range&&SALES.range.days||0)+' days')+
      (s.discount>0?esc(' · '+baht(s.discount)+' given away in discounts'):'')+
      (s.delivery>0?esc(' · '+baht(s.delivery)+' delivery fees'):'')+
      (s.memberOrders?esc(' · '+s.memberOrders+' member ⭐'):'')+
      (s.boxes?esc(' · '+s.boxes+' custom box'+(s.boxes===1?'':'es')):'')+
      (s.cancelled?esc(' · '+s.cancelled+' cancelled, not counted'):'')+
    '</div>'+
    (SALES.truncated?'<div style="font-size:11.5px;color:var(--gold);margin-top:6px">Only the most recent orders were read — older ones exist beyond this page.</div>':'')+
  '</div>';
}

function billRow(b){
  const owe=b.owes>0;
  return '<div class="ocard" style="padding:11px 13px;cursor:pointer" data-act="bill" data-id="'+esc(b.orderId)+'">'+
    '<div class="oh"><span class="oid">'+esc(b.orderId)+'</span>'+
      (owe?'<span class="badge" style="color:var(--danger);border-color:var(--danger)">'+esc(b.owesKind==='wallet'?'wallet unsettled':'unpaid')+'</span>':
           '<span class="badge open">'+esc(b.payStatus==='paid'?'paid':(b.payment==='Cash'?'cash':'ok'))+'</span>')+
      '<span class="ot">'+esc(b.at?ago(b.at):'')+'</span></div>'+
    '<div style="display:flex;justify-content:space-between;gap:10px;margin-top:5px;align-items:baseline">'+
      '<span style="font-size:12.5px;color:var(--muted)">'+esc((b.lines||0)+' line'+(b.lines===1?'':'s')+' · '+(b.itemCount||0)+' item'+(b.itemCount===1?'':'s')+' · '+(b.payment||'—'))+(b.member?' ⭐':'')+'</span>'+
      '<span style="font-weight:900;font-size:15px;color:var(--gold);white-space:nowrap">'+esc(baht(b.total))+'</span></div>'+
    '<div style="font-size:11.5px;color:var(--muted2);margin-top:3px">'+esc((b.customer&&b.customer.name)||'—')+(b.customer&&b.customer.phone?esc(' · '+b.customer.phone):'')+
      (b.table?esc(' · 🪑 '+b.table):'')+esc(b.day?' · '+b.day:'')+'</div>'+
    (owe?'<div style="font-size:12px;color:var(--danger);font-weight:700;margin-top:4px">Owes '+esc(baht(b.owes))+'</div>':'')+
  '</div>';
}

function renderBills(body){
  const list=SALES.bills||[];
  body.innerHTML=salesHead()+
    (list.length?list.map(billRow).join(''):'<div style="padding:26px;color:var(--muted2);text-align:center;font-size:13.5px">No bills in this period.</div>');
}

function renderDayTotals(body){
  const days=SALES.byDay||[], pays=SALES.byPayment||[], top=SALES.topItems||[];

    '<div class="ocard" style="padding:13px 15px"><div style="font-weight:800;font-size:13px;color:var(--muted2);letter-spacing:.4px;text-transform:uppercase">Best sellers</div>'+

    '</div>';

/* ---- one calendar month ---------------------------------------------- */
/* Three questions in one screen: what the month took, what a customer spends
   in a visit, and what each product actually sold for. The last one is worked
   out from the bills rather than the price list, so member pricing, promo

      '<span style="font-weight:800;color:var(--green2);width:78px;text-align:right;white-space:nowrap">'+esc(baht(x.avgPrice))+'</span>'+
      '<span style="font-weight:800;color:var(--gold);width:86px;text-align:right;white-space:nowrap">'+esc(baht(x.gross))+'</span>'+
    '</div>').join('');

  const dayRows=days.map(x=>
    '<div style="display:flex;gap:10px;border-top:1px solid var(--line2);padding:7px 0;font-size:13px;align-items:baseline">'+
      '<span style="flex:1;font-weight:700">'+esc(x.day)+'</span>'+

  const card=(title,inner,sub)=>'<div class="ocard" style="padding:13px 15px">'+
    '<div style="font-weight:800;font-size:13px;color:var(--muted2);letter-spacing:.4px;text-transform:uppercase">'+esc(title)+'</div>'+
    (sub?'<div style="color:var(--muted);font-size:11.5px;margin-top:3px">'+esc(sub)+'</div>':'')+inner+'</div>';

  body.innerHTML='<div style="padding:0 4px 4px"><div style="font-weight:900;font-size:16px;margin-bottom:8px">'+esc(monthLabel(MONTH.month))+'</div>'+tiles+'</div>'+
    card('Highest spending', spenders||'<div style="color:var(--muted);font-size:13px;margin-top:8px">Nobody yet.</div>', 'Tap a name to open their card')+
    card('Average selling price', '<div style="display:flex;gap:10px;font-size:10.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:.4px;padding-top:6px"><span style="flex:1">Product</span><span style="width:56px;text-align:right">Sold</span><span style="width:78px;text-align:right">Avg each</span><span style="width:86px;text-align:right">Took</span></div>'+(priceRows||'<div style="color:var(--muted);font-size:13px;margin-top:8px">Nothing yet.</div>'), 'What it actually sold for — money taken ÷ units sold')+
    card('Day by day', dayRows||'')+
    card('How they paid', payRows||'')+
    (MONTH.truncated?'<div class="ghdr" style="color:var(--gold)">Only the most recent bills could be read, so this month is partial.</div>':'');
}

function monthCSV(kind){
  if(!MONTH||!MONTH.summary||!MONTH.summary.orders){ alert('Nothing to export for this month yet.'); return; }
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  let head=[], rows=[], name='';
  if(kind==='products'){
    head=['Product','Sold','Avg selling price','Took','Given free','Bills'];
    rows=(MONTH.products||[]).map(x=>[x.name,x.qty,x.avgPrice,x.gross,x.freeQty,x.bills].map(q).join(','));
    name='avg-price';
  } else if(kind==='spenders'){
    head=['Rank','Customer','Phone','Bills','Spent','Avg bill','Items','Still owed','Member','Last bill'];
    rows=(MONTH.customers||[]).map((c,i)=>[i+1,c.name,c.phone,c.bills,c.spent,c.avgBill,c.items,c.owed,c.member?'yes':'',c.last?new Date(c.last).toISOString().slice(0,10):''].map(q).join(','));
    name='top-spenders';
  } else {
    head=['Bill','Date','Customer','Phone','Payment','Items','Subtotal','Discount','Total','Still owed'];
    rows=(MONTH.bills||[]).map(b=>[b.orderId,b.day,(b.customer&&b.customer.name)||'',(b.customer&&b.customer.phone)||'',b.payment,b.itemCount,b.subtotal,b.discount,b.total,b.owes].map(q).join(','));
    name='bills';
  }
  const blob=new Blob(['﻿'+[head.map(q).join(',')].concat(rows).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='dank-'+name+'-'+MONTH.month+'.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* The same three buttons appear on the Sales tab and on a member's card.
   Whichever one is open is the one that has to redraw. */
async function salesRefresh(){
  SALES=null; OWED=null;
  if(TAB==='sales') await loadSales();
  else if(MEM && MEM.customer && MEM.customer.phone) await memberOwed(MEM.customer.phone);
}

async function billPaid(id,paid){
  try{
    const r=await authPost('/api/sales',{action:paid?'mark-paid':'mark-unpaid',orderId:id});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ alert('⚠️ '+(j.detail||j.error||'Could not update that bill')); return; }
    closeBill(); await salesRefresh(); pollOrders();
  }catch(e){ alert('⚠️ Could not update that bill'); }
}
async function billWalletSettle(id){
  if(!confirm('Take the money out of their wallet now?')) return;
  try{
    const r=await authPost('/api/wallet',{action:'settle',orderId:id});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ alert('⚠️ '+(j.error||'Could not settle that wallet order')); return; }
    closeBill(); await salesRefresh(); pollOrders();
    alert('✅ Settled — their wallet is now '+baht(j.balance));
  }catch(e){ alert('⚠️ Could not settle that wallet order'); }
}
async function tabAdd(){
  const phone=($('#tabPhone')||{}).value||'', amount=($('#tabAmt')||{}).value||'';
  const name=($('#tabName')||{}).value||'', note=($('#tabNote')||{}).value||'';
  if(!String(phone).replace(/[^0-9]/g,'')){ alert('Enter their phone number'); return; }
  if(!(Number(amount)>0)){ alert('Enter how much they owe'); return; }
  try{
    const r=await authPost('/api/sales',{action:'tab',phone,amount:Number(amount),name,note});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ alert('⚠️ '+(j.error||'Could not open that tab')); return; }
    await salesRefresh();
  }catch(e){ alert('⚠️ Could not open that tab'); }
}
async function tabClose(phone,id,del){
  try{
    const r=await authPost('/api/sales',{action:del?'tab-delete':'tab-settle',phone,id});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ alert('⚠️ '+(j.error||'Could not update that tab')); return; }
    await salesRefresh();
  }catch(e){ alert('⚠️ Could not update that tab'); }
}

/* The bills as a spreadsheet. The BOM is there so Excel reads the Thai names
   and the ฿ sign as UTF-8 instead of guessing a Windows codepage. */
function salesCSV(){
  if(!SALES||!(SALES.bills||[]).length){ alert('Nothing to export yet.'); return; }
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head=['Bill','Date','Time','Customer','Phone','Payment','Paid?','Lines','Items','Subtotal','Discount','Delivery','Total','Still owed','Where'];
  const rows=SALES.bills.map(b=>{
    const dt=b.at?new Date(b.at):null;
    return [b.orderId,b.day,dt?dt.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'',
      (b.customer&&b.customer.name)||'',(b.customer&&b.customer.phone)||'',b.payment,
      b.owes>0?'NO':(b.payStatus==='paid'?'yes':(b.payment==='Cash'?'cash at counter':'yes')),
      b.lines,b.itemCount,b.subtotal,b.discount,b.deliveryFee,b.total,b.owes,b.table||b.fulfilment||''].map(q).join(',');
  });
  const blob=new Blob(['﻿'+[head.map(q).join(',')].concat(rows).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='dank-bills-'+SALES_DAYS+'d.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* Every row and button the console draws into #list used to carry its own
   onclick="doThing('<some id>')". That put an untrusted id inside a quoted
   attribute inside a JavaScript string — two nested escaping rules, and an
   order id of  ');alert(1);('  satisfied neither. The ids ride in data-
   attributes now, where esc() is the only rule that applies, and one listener
   on #list (which outlives every re-render) reads them back and calls the
   function directly. Nothing here builds code out of a string. */
$('#list').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const d=el.dataset;
  switch(d.act){
    case 'thread':     openThread(d.id); break;
    case 'gift':       toggleGift(d.id); break;
    case 'slip':       viewSlip(d.id); break;
    case 'upload':     staffUploadSlip(d.id); break;
    case 'order':      setOrder(d.id,d.status); break;
    case 'alert-accept': acceptAlert(d.id); break;
    case 'push-enable': enablePushNotifications().then(loadAlertHealth); break;
    case 'push-test': testPush(); break;
    case 'sound-toggle': toggleSound(); loadAlertHealth(); break;
    case 'count-view': viewCount(d.id); break;
    case 'scale':      applyScale(d.code); break;
    case 'proof-del':  COUNT_PROOFS.splice(Number(d.i),1); renderProofGrid(); break;
    case 'box-stock':  boxSetStock(d.id); break;
    case 'box-thresh': boxSetThresh(); break;
    case 'lab-save':   labSave(); break;
    case 'lab-del':    labDelete(); break;
    case 'sales-view':  SALES_VIEW=d.v; loadSales(); break;
    case 'sales-days':  SALES_DAYS=Number(d.v)||7; SALES=null; loadSales(); break;
    case 'sales-month': SALES_MONTH=d.v; MONTH=null; loadSales(); break;
    case 'month-csv':   monthCSV(d.v); break;
    case 'sales-csv':   salesCSV(); break;
    case 'bill':        openBill(d.id); break;
    case 'paid':        billPaid(d.id,true); break;
    case 'unpaid':      billPaid(d.id,false); break;
    case 'wsettle':     billWalletSettle(d.id); break;
    case 'tab-add':     tabAdd(); break;
    case 'tab-settle':  tabClose(d.phone,d.id,false); break;
    case 'tab-del':     tabClose(d.phone,d.id,true); break;
    case 'owed-member': setTab('member'); lookupMember(d.phone); break;
  }
});
/* The bill drill-down paints itself into #billOv, which sits outside #list, so
   the delegation above never sees its buttons. It gets its own listener on the
   same pattern rather than inline onclick attributes. */
document.addEventListener('click',e=>{
  const ov=e.target.closest('#billOv'); if(!ov) return;
  const el=e.target.closest('[data-act]'); if(!el) return;
  const d=el.dataset;
  switch(d.act){
    case 'bill-close': closeBill(); break;
    case 'paid':       billPaid(d.id,true); break;
    case 'unpaid':     billPaid(d.id,false); break;
    case 'wsettle':    billWalletSettle(d.id); break;
    case 'slip':       viewSlip(d.id); break;
    case 'thread':     closeBill(); openThread(d.id); break;
  }
});
$('#list').addEventListener('input',e=>{
  const el=e.target.closest('[data-act="count"]'); if(el) setCount(el.dataset.code,el.value);
});
/* A <select> fires change, not click — and the POS picker is the one control
   on this page that saves the moment it is touched, so it needs its own
   listener on #list rather than an inline handler. */
$('#list').addEventListener('change',e=>{
  const el=e.target.closest('[data-act="box-sh"]'); if(el) return boxSetPos(el.dataset.id,el.value);
  /* Switching product reloads the form from that product's saved report, so it
     has to run on change rather than on a Load button nobody would press. */
  const lp=e.target.closest('[data-act="lab-prod"]'); if(lp){ LABSEL=lp.value; renderLab(); }
});

if(KEY){ $('#keyInput').value=KEY; login(); }
