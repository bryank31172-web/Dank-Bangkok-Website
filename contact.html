:10px}.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border:1px solid var(--green);border-radius:24px;color:var(--green);font-size:14px;font-weight:850;text-decoration:none}.btn.primary{background:var(--green);color:#fff}.mobile-tabs{display:none}.status{position:absolute;top:72px;right:18px;z-index:3;max-width:280px;padding:10px 13px;border-radius:9px;background:#101720;color:#fff;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.2)}

</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="/homepage-v2"><i>D</i>DANK BKK</a><a class="back" href="/homepage-v2"><span>Homepage · </span>Back</a></div></header><main class="wrap page"><section class="contact-intro"><small>Contact us</small><h1>Get in touch with DANK</h1><p>Choose a Bangkok branch to view its location, call the store, or open turn-by-turn directions.</p></section><h2 class="title"><span class="material-symbols-rounded">location_on</span>Branches</h2><div class="underline"></div><section class="branch-shell" aria-label="DANK Bangkok branches"><aside class="sidebar"><div class="sidebar-head"><h2>STORES</h2><span>(2)</span></div><label class="search"><span class="material-symbols-rounded">search</span><input id="search" type="search" placeholder="Search district or store" aria-label="Search branches"></label><div class="district">BANGKOK</div><div class="tabs" id="desktopTabs"></div></aside><div><div class="mobile-tabs" id="mobileTabs" role="tablist" aria-label="Select branch"></div><div class="map-pane"><button class="nearest" id="nearest"><span class="material-symbols-rounded">my_location</span>FIND NEAREST STORE</button><div id="status" class="status" hidden></div><iframe id="map" title="Selected DANK branch on Google Maps" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe><article class="info"><div class="info-nav"><button id="prev" aria-label="Previous branch"><span class="material-symbols-rounded">chevron_left</span></button><strong id="branchTitle"></strong><button id="next" aria-label="Next branch"><span class="material-symbols-rounded">chevron_right</span></button></div><div class="facts"><div class="fact"><span class="material-symbols-rounded">location_on</span><a id="address" target="_blank" rel="noopener"></a></div><div class="fact"><span class="material-symbols-rounded">call</span><a id="phone"></a></div></div><div class="actions"><a class="btn primary" id="call"><span class="material-symbols-rounded">call</span>Call store</a><a class="btn" id="directions" target="_blank" rel="noopener"><span class="material-symbols-rounded">directions</span>Directions</a></div></article></div></div></section></main><script>
(function(){"use strict";var branches=[{id:"pattanakarn",name:"DANK Cannabis Club & (open24 hrs.) Weed Dispensary",short:"Phatthanakan",district:"Suan Luang",address:"223 Phatthanakan Rd, Suan Luang, Bangkok 10250, Thailand",phone:"084 162 0610",tel:"+66841620610",lat:13.7419,lng:100.6004,query:"DANK Cannabis Club & open24 hrs Weed Dispensary, 223 Phatthanakan Rd, Bangkok"},{id:"sathorn",name:"DANK Cannabis Club (Sathorn Rama 3) weed dispensary & co-working space",short:"Sathorn Rama 3",district:"Sathon",address:"76/10 Nang Linchi Rd, Thung Maha Mek, Sathon, Bangkok 10120, Thailand",phone:"094 224 0702",tel:"+66942240702",lat:13.7108,lng:100.5375,query:"DANK Cannabis Club Sathorn Rama 3, 76/10 Nang Linchi Rd, Bangkok"}],current=0,desktop=document.getElementById("desktopTabs"),mobile=document.getElementById("mobileTabs"),search=document.getElementById("search");
function directions(b){return"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(b.address)}
function drawTabs(){desktop.innerHTML="";mobile.innerHTML="";branches.forEach(function(b,i){var d=document.createElement("button");d.className="tab"+(i===current?" active":"");d.dataset.index=i;d.innerHTML="<span><strong>"+b.name+"</strong><small>"+b.district+"</small></span><span class='material-symbols-rounded'>chevron_right</span>";d.addEventListener("click",function(){select(i)});desktop.appendChild(d);var m=document.createElement("button");m.className="mobile-tab"+(i===current?" active":"");m.textContent=b.short;m.setAttribute("role","tab");m.setAttribute("aria-selected",String(i===current));m.addEventListener("click",function(){select(i)});mobile.appendChild(m)})}
function select(i){current=(i+branches.length)%branches.length;var b=branches[current];drawTabs();document.getElementById("branchTitle").textContent=b.name;document.getElementById("address").textContent=b.address;document.getElementById("address").href=directions(b);document.getElementById("phone").textContent=b.phone;document.getElementById("phone").href="tel:"+b.tel;document.getElementById("call").href="tel:"+b.tel;document.getElementById("directions").href=directions(b);document.getElementById("map").src="https://www.google.com/maps?q="+encodeURIComponent(b.query)+"&output=embed";history.replaceState(null,"","#"+b.id)}
document.getElementById("prev").onclick=function(){select(current-1)};document.getElementById("next").onclick=function(){select(current+1)};
search.addEventListener("input",function(){var q=this.value.trim().toLowerCase();desktop.querySelectorAll(".tab").forEach(function(tab){var b=branches[Number(tab.dataset.index)];tab.hidden=q&&!((b.name+" "+b.short+" "+b.district+" "+b.address).toLowerCase().includes(q))})});
document.getElementById("nearest").addEventListener("click",function(){var btn=this,status=document.getElementById("status");if(!navigator.geolocation){status.hidden=false;status.textContent="Location is not supported on this device.";return}btn.disabled=true;status.hidden=false;status.textContent="Finding your nearest DANK store…";navigator.geolocation.getCurrentPosition(function(pos){var lat=pos.coords.latitude,lng=pos.coords.longitude;function distance(b){var x=(b.lng-lng)*Math.cos((lat+b.lat)*Math.PI/360),y=b.lat-lat;return x*x+y*y}var best=distance(branches[0])<=distance(branches[1])?0:1;select(best);status.textContent=branches[best].short+" is nearest to your current location.";btn.disabled=false;setTimeout(function(){status.hidden=true},4000)},function(){status.textContent="Location permission was not available. Select a store manually.";btn.disabled=false},{enableHighAccuracy:false,timeout:8000,maximumAge:300000})});
var hash=location.hash.slice(1),initial=branches.findIndex(function(b){return b.id===hash});select(initial>=0?initial:0)})();
