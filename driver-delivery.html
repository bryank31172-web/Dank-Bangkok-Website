<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Driver delivery</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f8f4;color:#163024;font:16px/1.5 system-ui}main{max-width:540px;margin:32px auto;padding:28px;background:white;border:1px solid #dce8df;border-radius:22px}h1{font-size:28px;margin:10px 0}p{color:#65776b}.badge{color:#087443;font-size:13px;font-weight:800;text-transform:uppercase}.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;margin:12px 0;background:#087443;color:white;font:700 16px system-ui;text-align:center;text-decoration:none;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#eaf2ec;color:#087443}#notice{background:#f1f6f2;border-radius:12px;padding:14px;min-height:55px}.hidden{display:none}@media(max-width:600px){main{margin:16px 12px;padding:24px}}
.driver-ended{display:block;min-height:0}.driver-ended .driver-controls{max-width:600px;margin:24px auto;border-radius:24px}main.driver-ended{display:block;min-height:0}main{max-width:none;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,3fr);padding:0;margin:0;min-height:100svh;border:0;border-radius:0}.driver-map-wrap{position:relative;min-height:100svh;background:#e7eeea}#driverMap,#driverGoogleMap{position:absolute;inset:0}.driver-controls{padding:30px 24px;background:white}.driver-controls .btn{border-radius:30px}.driver-controls h1{font-size:26px}.driver-controls p{font-size:14px}.map-recenter{position:absolute;right:20px;top:20px;border:0;border-radius:50%;width:48px;height:48px;background:white;box-shadow:0 3px 15px #0002;color:#008f4b;font-size:23px;cursor:pointer}.driver-map-note{position:absolute;bottom:24px;left:18px;right:18px;background:#fffffff0;padding:12px;border-radius:22px;font-size:13px}.hidden{display:none!important}@media(max-width:760px){main{display:block;margin:0;padding:0}.driver-map-wrap{min-height:70svh}.driver-controls{position:relative;margin-top:-24px;border-radius:28px 28px 0 0;padding:18px 24px;min-height:30svh}.driver-map-note{bottom:42px}}

/* Full-screen route with a sheet that changes the visible map height. */
:root{--rider-sheet-height:240px}body{overflow:hidden}main{display:flex;flex-direction:column;height:100svh;min-height:0}.driver-map-wrap{flex:1;min-height:200px}.driver-controls{flex:0 0 var(--rider-sheet-height);height:var(--rider-sheet-height);min-height:0;margin:0;border-radius:28px 28px 0 0;padding:0;background:white;display:flex;flex-direction:column;box-shadow:0 -4px 20px #0001;z-index:4;overflow:hidden}.rider-sheet-handle{display:block;flex:none;width:100%;height:30px;border:0;background:white;cursor:ns-resize;touch-action:none;border-radius:28px 28px 0 0}.rider-sheet-handle::after{content:'';display:block;width:44px;height:5px;border-radius:9px;background:#d9dedb;margin:auto}.rider-customer-row{display:flex;align-items:center;gap:14px;padding:4px 22px 10px;flex:none}.rider-customer-copy{flex:1;min-width:0}.rider-customer-copy small{font-size:12px;color:#65776b}.rider-customer-copy strong{display:block;font-size:21px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rider-customer-call{display:grid;place-items:center;width:46px;height:46px;flex:none;border-radius:50%;background:#eef8f4;color:#075844}.rider-customer-call svg{width:25px;height:25px}.rider-customer-call[aria-disabled=true]{opacity:.35;pointer-events:none}.rider-sheet-body{padding:0 22px 22px;overflow:auto;overscroll-behavior:contain;min-height:0;flex:1}.driver-controls #address{margin:0 0 12px;font-size:13px}.driver-controls h1{font-size:16px;margin:5px 0}.driver-controls .btn{padding:12px;font-size:14px}.driver-controls #notice{font-size:12px;min-height:0;padding:10px}.driver-map-note{bottom:56px!important}.driver-ended{overflow:auto}.driver-ended .driver-controls{height:auto;flex:none;width:min(100%,600px);margin:24px auto}.driver-ended .rider-sheet-body{overflow:visible}.driver-ended .rider-sheet-handle{display:none}

.rider-action-footer{flex:none;background:white;padding:10px 20px max(14px,env(safe-area-inset-bottom));border-top:1px solid #eef1ef}.rider-action-steps{display:flex;justify-content:space-between;gap:8px;margin:0 0 10px;padding:0;list-style:none;font:600 11px/1.4 system-ui;color:#77827b}.rider-action-steps li[aria-current=step]{color:#008f4b}.rider-action-steps li.done{color:#008f4b}.rider-primary-row{display:flex;align-items:center;gap:14px}.rider-action-icon{display:grid;place-items:center;flex:none;width:56px;height:56px;border:0;border-radius:50%;background:#eff9f7;color:#075844;cursor:pointer}.rider-action-icon svg{width:28px;height:28px}.rider-primary-action{height:56px;flex:1;border:0;border-radius:999px;background:#00b65b;color:white;font:750 18px/1 system-ui;cursor:pointer}.rider-primary-action:disabled,.rider-action-icon:disabled{opacity:.45;cursor:not-allowed}.rider-primary-action:focus-visible,.rider-action-icon:focus-visible{outline:3px solid #075844;outline-offset:3px}.rider-secondary-actions{display:none!important}
</style><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><link rel="stylesheet" href="/delivery-map.css?v=rider-v14"></head><body><main><section class="driver-map-wrap" id="driverMapSection"><div id="driverMap" aria-label="Rider route map"></div><div id="driverGoogleMap" class="hidden" aria-label="Google Maps rider directions"></div><div id="driverDestination" class="delivery-destination-label">Delivery destination</div><div id="driverRouteBadge" class="delivery-route-badge hidden" role="status"></div><button id="driverRecenter" class="map-recenter" aria-label="Recenter map">⌖</button><div id="driverMapNote" class="driver-map-note" role="status">Start delivery to show your route.</div></section><section class="driver-controls" id="riderSheet"><button class="rider-sheet-handle" id="riderSheetHandle" aria-label="Expand delivery details" aria-expanded="false" type="button"></button><div class="rider-customer-row"><div class="rider-customer-copy"><small>Deliver to</small><strong id="customerName">Customer</strong></div><a class="rider-customer-call" id="customerCall" aria-label="Call customer" aria-disabled="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 3h4l2 5-3 2c2 4 3 5 7 7l2-3 5 2v4c0 1-1 2-2 2C9 21 3 15 2 5c0-1 1-2 2-2Z"/></svg></a></div><div class="rider-sheet-body"><section id="deliverySummary" class="hidden" aria-label="Completed delivery details"></section><div id="notice" class="hidden" role="status"></div><div hidden><h1 id="heading"></h1><p id="address"></p><a id="navigate"></a><p id="driverIntro"></p><div id="departureUpload"><input id="departureInput" type="file" accept="image/*" aria-label="Choose departure photo"><img id="departurePreview" alt="Your departure photo"><button id="saveDeparture" type="button" disabled></button></div><button id="start" disabled></button><button id="pause" disabled></button><button id="complete" disabled></button></div></div><footer class="rider-action-footer"><div class="rider-primary-row"><button class="rider-primary-action" id="riderPrimaryAction" type="button" disabled>Take a picture</button></div></footer></section></main><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script><script src="/delivery-map.js?v=rider-v14"></script><script src="/rider-google-map.js?v=2"></script><script src="/rider-sheet.js?v=2"></script><script src="/driver-demo.js?v=8"></script><script>
const isDemo=new URLSearchParams(location.search).get('demo')==='1',riderDemo=isDemo?createRiderDemo():null;
const p=new URLSearchParams(location.hash.slice(1)),id=p.get('id'),token=p.get('token'),el=x=>document.getElementById(x);let watch=null,timer=null,pollTimer=null,latest=null,busy=false,sending=false,active=false,started=false,firstSent=false,ended=false,wakeLock,departurePhoto=null,photoReady=false,photoRequired=false,finished=false,deliveryDetails=null;
const riderSheet=createRiderSheet('riderSheet','riderSheetHandle');
const riderMap=createDeliveryMap({map:'driverMap',badge:'driverRouteBadge',label:'driverDestination',note:'driverMapNote'});const riderGoogleMap=createRiderGoogleMap({google:'driverGoogleMap',fallback:'driverMap',onFallback(data){if(ended||mapPaused)return;riderMap.update(data);el('driverMapNote').textContent='Google Maps does not allow this website yet. Showing the delivery route.';}});let mapPaused=false,loadBusy=false;el('driverRecenter').addEventListener('click',()=>{if(!el('driverGoogleMap').classList.contains('hidden'))riderGoogleMap.fit();else riderMap.fit();});
const notice=s=>{el('notice').textContent=s;if(/could not|too large|denied|unavailable|retry|private driver|failed|not support|check your connection/i.test(s))el('notice').classList.remove('hidden');else el('notice').classList.add('hidden');};
function controls(){const phase=ended?3:photoReady||started?2:1;const label=finished?'Delivered':phase===1?'Take a picture':phase===2?(started?'Delivered':active?'Starting…':'Start delivery'):'Finish';el('riderPrimaryAction').textContent=label;el('riderPrimaryAction').disabled=busy||finished||(phase===2&&active&&!started);riderSheet.setActive(started&&!ended);if(ended){el('address').textContent='';el('navigate').classList.add('hidden');el('navigate').removeAttribute('href');el('customerName').textContent=finished?'Delivery completed':'Delivery ended';el('customerCall').removeAttribute('href');el('customerCall').setAttribute('aria-disabled','true');}el('departureInput').disabled=busy||ended;el('saveDeparture').disabled=busy||ended||!departurePhoto;el('start').disabled=busy||active||ended||(photoRequired&&!photoReady);el('pause').disabled=busy||!active||ended;el('complete').disabled=busy||!started||ended}
async function request(action,location,photo){if(isDemo)return riderDemo.request(action,location,photo);const r=await fetch('/api/delivery'+(action?'':'?role=driver&id='+encodeURIComponent(id)),{method:action?'POST':'GET',headers:{'Content-Type':'application/json','X-Delivery-Token':token},body:action?JSON.stringify({id,role:'driver',action,location,photo}):undefined,cache:'no-store',signal:AbortSignal.timeout(12000)});const j=await r.json();if(!r.ok){if([403,404].includes(r.status)||j.status||j.error==='Assignment changed or delivery ended'){ended=true;riderMap.clear();riderGoogleMap.clear();el('driverMapSection').classList.add('hidden');document.querySelector('main').classList.add('driver-ended');stop();el('departureUpload').classList.add('hidden');el('departurePreview').removeAttribute('src');departurePhoto=null;controls()}throw new Error(j.error||'Could not reach tracking service')}return j}
async function wake(){try{wakeLock=await navigator.wakeLock?.request('screen')}catch{}}
function stop(){active=false;if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;clearInterval(timer);timer=null;latest=null;wakeLock?.release().catch(()=>{});wakeLock=null}
async function send(){if(!active||sending||!latest)return;sending=true;try{await request(firstSent?'location':'start',latest);firstSent=true;started=true;notice('Sharing location · last sent '+new Date().toLocaleTimeString());controls();await load()}catch(e){notice(e.message+'. Retry or check your connection.')}finally{sending=false}}
function start(){if(photoRequired&&!photoReady){notice('Share your departure photo first.');return;}mapPaused=false;if(isDemo){active=true;firstSent=false;latest=riderDemo.next();controls();send();timer=setInterval(()=>{latest=riderDemo.next();send()},90000);return;}if(!navigator.geolocation){notice('This browser does not support location sharing.');return}active=true;firstSent=false;latest=null;controls();notice('Waiting for location permission…');watch=navigator.geolocation.watchPosition(pos=>{latest={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy,capturedAt:pos.timestamp};if(!firstSent)send()},error=>{notice(error.code===1?'Location permission denied. Enable it in browser settings and tap Start delivery.':'GPS unavailable. Please try outdoors.');if(error.code===1){stop();controls()}},{enableHighAccuracy:true,maximumAge:0,timeout:15000});timer=setInterval(send,90000);wake()}

let selectedPhotoVersion=0;
function prepareDeparture(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const scale=Math.min(1,900/img.width,900/img.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let quality=.8,photo=canvas.toDataURL('image/jpeg',quality);while(photo.length>160000&&quality>.2){quality-=.1;photo=canvas.toDataURL('image/jpeg',quality);}if(photo.length>160000)throw new Error('Photo is too large. Choose a smaller image.');resolve(photo);}catch(e){reject(e);}finally{URL.revokeObjectURL(url);}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Could not read this photo. Choose a JPEG or PNG.'));};img.src=url;});}
el('departureInput').addEventListener('change',async()=>{if(busy||ended)return;const file=el('departureInput').files?.[0];if(!file)return;const version=++selectedPhotoVersion;busy=true;departurePhoto=null;controls();try{const photo=await prepareDeparture(file);if(version!==selectedPhotoVersion||ended)return;departurePhoto=photo;el('departurePreview').src=photo;await shareDeparture();}catch(e){notice(e.message);}finally{busy=false;controls();el('departureInput').value='';}});
async function shareDeparture(){if(!departurePhoto||ended)return;await request('departure-photo',undefined,departurePhoto);photoReady=true;departurePhoto=null;notice('Photo attached. Starting delivery…');if(!active&&!ended)start();}
el('saveDeparture').addEventListener('click',async()=>{if(busy||ended||!departurePhoto)return;busy=true;controls();try{await shareDeparture();}catch(e){notice(e.message);}finally{busy=false;controls();}});
el('start').addEventListener('click',start);el('pause').addEventListener('click',async()=>{mapPaused=true;riderMap.clear();riderGoogleMap.clear();stop();busy=true;controls();try{await request('pause');await load();notice('Sharing paused. Tap Start delivery to resume.')}catch(e){notice(e.message+' Location sharing has stopped on this device.')}finally{busy=false;controls()}});el('complete').addEventListener('click',completeDelivery);async function completeDelivery(){if(busy||ended||!started)return;if(!confirm('Confirm that this order has been delivered?'))return;busy=true;controls();try{await request('complete');ended=true;riderMap.clear();riderGoogleMap.clear();el('driverMapSection').classList.add('hidden');document.querySelector('main').classList.add('driver-ended');stop();el('departureUpload').classList.add('hidden');el('departurePreview').removeAttribute('src');departurePhoto=null;clearInterval(pollTimer);notice('Delivery completed. Location sharing has stopped.');el('heading').textContent='Delivery completed';finishDelivery()}catch(e){notice(e.message)}finally{busy=false;controls()}}
function finishDelivery(){finished=true;stop();clearInterval(pollTimer);controls();const panel=el('deliverySummary');panel.replaceChildren();const heading=document.createElement('h2');heading.textContent='Delivery completed';panel.appendChild(heading);if(deliveryDetails){const order=document.createElement('p');order.textContent='Order '+deliveryDetails.orderId;panel.appendChild(order);const list=document.createElement('ul');for(const item of deliveryDetails.items||[]){const row=document.createElement('li');row.textContent=String(item.name||'Item')+' × '+String(item.qty||1);list.appendChild(row);}panel.appendChild(list);const total=document.createElement('p');total.textContent='Total: ฿'+Number(deliveryDetails.total||0).toLocaleString('en-US');panel.appendChild(total);}panel.classList.remove('hidden');}
async function riderAction(){if(busy||finished||ended)return;if(started)return completeDelivery();if(photoReady){if(!active)start();return;}if(departurePhoto)return el('saveDeparture').click();el('departureInput').click();}
el('riderPrimaryAction').addEventListener('click',riderAction);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&active){latest=null;wake();notice('Back online. Waiting for a fresh GPS location.')}});window.addEventListener('pagehide',stop);
async function load(){if(loadBusy)return;loadBusy=true;try{if(!isDemo&&(!id||!token))throw new Error('Open the private driver link supplied by staff.');const j=await request();if(ended)return;deliveryDetails={orderId:j.orderId,items:j.items,total:j.total};const mapData={...j,demo:isDemo,location:mapPaused?null:j.location,destinationLabel:j.address||'Delivery destination'};if(!ended){const shown=await riderGoogleMap.update(mapData);if(ended||mapPaused&&mapData.location)return;if(shown)riderMap.clear();else riderMap.update(mapData);}el('driverMapNote').textContent=j.stale?'Waiting for a fresh rider location.':!el('driverGoogleMap').classList.contains('hidden')?'Google Maps · location updates every 90 seconds.':'Google Maps unavailable · showing delivery route. Location updates every 90 seconds.';el('heading').textContent='Order '+j.orderId;el('address').textContent=j.address||'Delivery destination';el('customerName').textContent=j.customer?.name||'Customer';const customerPhone=String(j.customer?.phone||'');if(/^\+?\d{7,15}$/.test(customerPhone)){el('customerCall').href='tel:'+customerPhone;el('customerCall').setAttribute('aria-disabled','false');}else{el('customerCall').removeAttribute('href');el('customerCall').setAttribute('aria-disabled','true');}if(j.destination){el('navigate').href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(j.destination.lat+','+j.destination.lng);el('navigate').classList.remove('hidden')}started=j.status==='on_the_way';photoRequired=Boolean(j.departurePhotoRequired);photoReady=Boolean(j.departurePhoto);if(photoReady&&!departurePhoto){el('departurePreview').src=j.departurePhoto;el('departurePreview').classList.remove('hidden');}if(['completed','cancelled'].includes(j.status)){ended=true;riderMap.clear();riderGoogleMap.clear();el('driverMapSection').classList.add('hidden');document.querySelector('main').classList.add('driver-ended');stop();el('departureUpload').classList.add('hidden');el('departurePreview').removeAttribute('src');departurePhoto=null;clearInterval(pollTimer);notice('This delivery has ended. Location sharing is off.');if(j.status==='completed')finishDelivery()}else if(!active)notice('Ready. Tap Take a picture when you leave.');controls()}catch(e){notice(e.message);if(!isDemo&&(!id||!token)){ended=true;controls()}}finally{loadBusy=false}}
if(isDemo)document.title='Rider demo · DANK BKK';
pollTimer=setInterval(load,90000);load();
</script></body></html>
