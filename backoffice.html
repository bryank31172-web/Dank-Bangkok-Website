function openMemberCard(dialog,member){
  const orderCount=member.history.length;
  const average=orderCount?member.history.reduce((sum,order)=>sum+Math.round(order.total*100),0)/orderCount/100:null;
  const spend=memberCompletedSpendCents(member.history)/100;
  const upgrade=MEMBER_UPGRADES[member.tier];
  const gaugeValue=upgrade?Math.max(upgrade.start,Math.min(upgrade.target,spend)):0;
  const progress=upgrade?100*(gaugeValue-upgrade.start)/(upgrade.target-upgrade.start):0;
  const scale=member.tier==='Silver'?[1,2500,5000,10000]:
    upgrade?Array.from({length:4},(_,index)=>Math.round(upgrade.start+(upgrade.target-upgrade.start)*index/3)):[];
  dialog.innerHTML=`
    <header><h2 id="memberCardTitle">การ์ดสมาชิก</h2><form method="dialog"><button class="btn ghost" autofocus>ปิด</button></form></header>
    <div class="member-card-flip" data-flipped="false">
      <div class="member-card-flip-inner">
        ${memberCardMarkup(member)}
        <div class="member-card-back" id="memberCardBack" aria-hidden="true"><span>วันที่สมัครสมาชิก</span><strong>${customerDate(member.joined)}</strong></div>
      </div>
      <button type="button" class="member-card-flip-button" aria-controls="memberCardBack" aria-expanded="false" aria-label="พลิกการ์ดสมาชิก"></button>
    </div>
    ${upgrade?`<section class="member-upgrade" aria-labelledby="memberUpgradeTitle">
      <h3 id="memberUpgradeTitle">อัพเกรดระดับสมาชิก</h3>
      <p class="muted">${dashboardMoney(spend)} / ${dashboardMoney(upgrade.target)}</p>
      <div class="member-upgrade-track" role="progressbar" aria-labelledby="memberUpgradeTitle" aria-valuemin="${upgrade.start}" aria-valuemax="${upgrade.target}" aria-valuenow="${gaugeValue}" aria-valuetext="${dashboardMoney(spend)} / ${dashboardMoney(upgrade.target)}" style="--upgrade-progress:${progress}%">
        <span class="member-upgrade-start"></span>
        ${'<span class="member-upgrade-tick" aria-hidden="true"></span>'.repeat(34)}
      </div>
      <div class="member-upgrade-scale${member.tier==='Silver'?' silver':''}">${scale.map(value=>`<span>${value.toLocaleString('en-US')}</span>`).join('')}</div>
    </section>`:''}
    <h3>ประวัติการซื้อ</h3>
    ${memberPurchaseHistory(member)}
    <p><strong>Average order value</strong> · ${average===null?'—':dashboardMoney(average)}</p>
    <dialog class="member-dialog tier-dialog" aria-labelledby="tierComparisonTitle"></dialog>`;
  const flipButton=dialog.querySelector('.member-card-flip-button');
  const front=dialog.querySelector('.member-card');
  const back=dialog.querySelector('.member-card-back');
  flipButton.addEventListener('click',()=>{
    const flipped=flipButton.getAttribute('aria-expanded')!=='true';
    flipButton.parentElement.dataset.flipped=String(flipped);
    flipButton.setAttribute('aria-expanded',String(flipped));
    front.inert=flipped;
    back.setAttribute('aria-hidden',String(!flipped));
  });
  dialog.querySelector('[data-show-tier-comparison]').addEventListener('click',()=>{
    openTierComparison(dialog.querySelector('.tier-dialog'),member.tier);
  });
  dialog.showModal();
}

function openTierComparison(dialog,currentTier){
  const outsideFrame=event=>{
    const rect=dialog.getBoundingClientRect();
    return event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom;
  };
  let startedOutside=false;
  dialog.onpointerdown=event=>{startedOutside=event.target===dialog&&outsideFrame(event);};
  dialog.onclick=event=>{
    if(startedOutside&&event.target===dialog&&outsideFrame(event))dialog.close();
    startedOutside=false;
  };
  const titleId=esc(dialog.getAttribute('aria-labelledby'));
  const title=currentTier?'เปรียบเทียบระดับสมาชิก':'เงื่อนไขระดับสมาชิก';
  const tiers=['Silver','Bronze','Gold','Diamond'];
  const benefits=['ส่วนลด','ของขวัญฟรี','ดีลพิเศษ'];
  dialog.innerHTML=`
    <header><h2 id="${titleId}">${title}</h2><form method="dialog"><button class="btn ghost" autofocus>ปิด</button></form></header>
    <div class="orders-table-scroll" tabindex="0" role="region" aria-labelledby="${titleId}">
      <table class="tier-comparison">
        <thead><tr><th scope="col">สิทธิประโยชน์</th>${tiers.map(tier=>`
          <th scope="col" class="tier-${tier.toLowerCase()}${tier===currentTier?' current-tier':''}"${tier===currentTier?' aria-current="true"':''}>${tier}</th>`).join('')}</tr></thead>
        <tbody>${benefits.map(benefit=>`<tr><th scope="row">${benefit}</th>${tiers.map(()=>'<td>—</td>').join('')}</tr>`).join('')}</tbody>
      </table>
    </div>`;
  dialog.showModal();
}

  try{sessionStorage.setItem('dankBOPage',JSON.stringify({tab:TAB,staffTab:STAFF_TAB}));}catch(_){}
}
function setTab(id,restoredStaffTab=null){
  REPORTS_MENU_OPEN=id==='reports';REPORTS_DROPUP_OPEN=false;
  PRODUCTS_DROPUP_OPEN=false;
  PRODUCTS_MENU_OPEN=['products','product-categories'].includes(id);
  const relationshipTabs=NAV.find(n=>n.id==='relationships').children;
  const relationshipTab=relationshipTabs.find(tab=>tab.id===id);
  if(!id||(relationshipTab&&!can(relationshipTab.perm)))return;
  hideSalesTooltip();
  closeOrdersDatePicker();
  closeOrdersBranches();
  $('#main').dataset.view=id;
  STAFF_MENU_OPEN=id==='staff';
  SETTINGS_MENU_OPEN=['settings','stores','settings-legacy'].includes(id);
  RELATIONSHIPS_MENU_OPEN=Boolean(relationshipTab);
  STAFF_SUBTAB_SELECTED=false;
  if(id==='staff'){
    STAFF_TAB=restoredStaffTab&&STAFF_TABS.some(([key])=>key===restoredStaffTab)?restoredStaffTab:'directory';
    STAFF_SUBTAB_SELECTED=STAFF_TAB!=='directory';
  }
  if(id==='scheduling')STAFF_TAB='shifts';
  TAB=id; renderNav();
  rememberBackofficePage();
  return (VIEWS[id]||viewOverview)();
  const tools={inventory:[['inventory','ภาพรวมสต็อก'],['suppliers','ผู้จัดจำหน่าย'],['purchasing','ใบสั่งซื้อ']],products:[['products','สินค้าทั้งหมด'],['food','อาหารและเครื่องดื่ม'],['kitchen','รายการครัว']],reports:[['reports','รายงานการขาย'],['expenses','ค่าใช้จ่าย']]};
  const group=tools[id]||Object.values(tools).find(rows=>rows.some(r=>r[0]===id));
  if(group&&id!=='products') $('.workspace-breadcrumb',$('#main')).insertAdjacentHTML('afterend',`<div class="module-tools">${group.map(([key,label])=>`<button class="btn ${key===id?'':'ghost'}" data-act="tab" data-tab="${key}">${label}</button>`).join('')}</div>`);
}

const workspaceMain=$('#main');
let breadcrumbPage;
new MutationObserver(()=>{
  const header=$('#headerBreadcrumb');
  const breadcrumb=$('.workspace-breadcrumb',workspaceMain);
  if(breadcrumb){
    header.replaceChildren(breadcrumb);
    breadcrumbPage=workspaceMain.firstElementChild;
  }else if(breadcrumbPage!==workspaceMain.firstElementChild){
    header.replaceChildren();
    breadcrumbPage=workspaceMain.firstElementChild;
  }
}).observe(workspaceMain,{childList:true,subtree:true});

/* ---------------- event delegation (one listener, data-act switch) ---------------- */
document.addEventListener('input',event=>{
  if(event.target.id==='staffSearch'){STAFF_SEARCH=event.target.value;renderStaffDirectoryResults();}
  if(event.target.id==='storeSearch'){STORE_SEARCH=event.target.value;STORE_PAGE=1;renderStoreDirectory();}
  if(event.target.id==='ordersBranchSearch'&&ORDERS_BRANCH_DRAFT)renderOrdersBranches();
  if(event.target.id==='ordersSearch'){
    ORDERS_SEARCH=event.target.value;ORDERS_PAGE=1;renderOrdersResults();
  }
});
document.addEventListener('change',event=>{
  if(event.target.id==='employeeStore')updateEmployeeId();
  if(event.target.id==='storePageSize'){STORE_PAGE_SIZE=Number(event.target.value);STORE_PAGE=1;renderStoreDirectory();}
  if(event.target.closest('#commissionSettings'))saveCommissionSettings();
  if(ORDERS_BRANCH_DRAFT){
    const input=event.target;
    if(input.id==='ordersBranchAll'){
      ORDERS_BRANCH_DRAFT=new Set(input.checked?ordersBranches():[]);renderOrdersBranches();
    }else if(input.hasAttribute('data-order-branch')){
      if(input.checked)ORDERS_BRANCH_DRAFT.add(input.dataset.orderBranch);else ORDERS_BRANCH_DRAFT.delete(input.dataset.orderBranch);
      renderOrdersBranches();
    }
  }
  if(!ORDERS_DATE_DRAFT)return;
  const input=event.target;
  const draft=ORDERS_DATE_DRAFT;
  if(input.id==='ordersCalendarMonth'||input.id==='ordersCalendarYear'){
    draft.month=new Date(Number($('#ordersCalendarYear').value),Number($('#ordersCalendarMonth').value),1);
    renderOrdersDatePicker();
  }else if(input.id==='ordersPastMonths'){
    draft.months=Number(input.value);chooseOrdersDatePreset('lastMonths',true);
  }else if(input.id==='ordersDateStart'||input.id==='ordersDateEnd'){
    const date=parseOrderDate(input.value);
    if(!date){$('#ordersDateError').textContent='กรุณาระบุวันที่ในรูปแบบ dd/mm/yyyy';return;}
    if(input.id==='ordersDateStart')draft.start=date;else draft.end=date;
    draft.preset='custom';draft.selectingEnd=false;
    draft.month=new Date(date.getFullYear(),date.getMonth(),1);
    updateOrdersDateSelection();
  }
});
document.addEventListener('click',event=>{

document.addEventListener('submit',async e=>{
  const form=e.target.closest('[data-act]'); if(!form) return;
  e.preventDefault();
  const act=form.dataset.act;
  if(act==='store-directory-save'){saveStoreDirectory(form);return;}
  if(act==='employee-save'){await saveEmployee(form);return;}
  const fd=new FormData(form);
  const b=Object.fromEntries(fd.entries());
  try{
    if(act==='inv-adjust'){
      b.qty_delta=Number(b.qty_delta);
      await boSend('/api/backoffice/inventory','POST',b);
      if(b.qty_delta>0)notifyRestock(`${b.item_key} · เพิ่ม ${b.qty_delta} · ${b.store_id}`,b.item_type==='product'?b.item_key:null);
      refreshNotifications();
      toast('Recorded'); form.reset(); refreshLedger();
    } else if(act==='prod-settings-save'){
      await boSend('/api/backoffice/product-settings','POST',{product_key:form.dataset.key,cost_price:b.cost_price?Number(b.cost_price):null,supplier_id:b.supplier_id||null,track_stock:fd.has('track_stock')});
      toast('Saved');
    } else if(act==='supplier-add'){
      await boSend('/api/backoffice/suppliers','POST',b);
      toast('Supplier added'); form.reset(); _suppliersCache=null; viewSuppliers();
    } else if(act==='po-create'){
      const lines=[...$('#poLines').children].map(row=>({
        item_type:row.querySelector('.po-item-type').value,
        item_key:row.querySelector('.po-item-key').value,
        qty_ordered:Number(row.querySelector('.po-qty').value),
        unit_cost:Number(row.querySelector('.po-cost').value)||0,
      })).filter(l=>l.item_key&&l.qty_ordered>0);
      if(!lines.length) return toast('Add at least one line',true);
      await boSend('/api/backoffice/purchase-orders','POST',{...b,lines});
      toast('PO created'); viewPurchasing();
    } else if(act==='ing-add'){
      b.cost_per_unit=Number(b.cost_per_unit)||0;
      await boSend('/api/backoffice/ingredients','POST',b);
      toast('Ingredient added'); viewFood();
    } else if(act==='recipe-add'){
      const lines=[...$('#recipeLines').children].map(row=>({
        ingredient_id:row.querySelector('.rec-ing').value,
        qty:Number(row.querySelector('.rec-qty').value),
      })).filter(l=>l.ingredient_id&&l.qty>0);
      if(!lines.length) return toast('Add at least one ingredient line',true);
      await boSend('/api/backoffice/recipes','POST',{...b,lines});
      toast('Recipe saved'); viewFood();
    } else if(act==='expense-add'){
      b.amount=Number(b.amount);
      const file=$('#expAttachment')?.files?.[0];
      if(file){
        if(file.size>700000) return toast('Receipt photo is too large (max ~700KB)',true);
        b.attachment=await readFileAsDataURL(file);
      }
      await boSend('/api/backoffice/expenses','POST',b);
      toast('Expense recorded'); viewExpenses();
    } else if(act==='store-add'){
      await boSend('/api/backoffice/stores','POST',b);
      toast('Store added'); form.reset(); const s=await boGet('/api/backoffice/stores'); STORES=s.rows||[]; renderStoreMgmt();
    } else if(act==='stk-start'){
      const items=[...$('#stkItems').children].map(row=>({
        item_type:row.querySelector('.stk-item-type').value,
        item_key:row.querySelector('.stk-item-key').value,
      })).filter(i=>i.item_key);
      if(!items.length) return toast('Add at least one item to count',true);
      await boSend('/api/backoffice/stocktakes','POST',{store_id:b.store_id,items});
      toast('Count started'); $('#stkItems').innerHTML=''; addStkItem(); await refreshStocktakes();
    } else if(act==='xfer-create'){
      if(b.from_store_id===b.to_store_id) return toast('From and to must be different stores',true);
      const lines=[...$('#xferLines').children].map(row=>({
        item_type:row.querySelector('.xfer-item-type').value,
        item_key:row.querySelector('.xfer-item-key').value,
        qty:Number(row.querySelector('.xfer-qty').value),
      })).filter(l=>l.item_key&&l.qty>0);
      if(!lines.length) return toast('Add at least one line',true);
      await boSend('/api/backoffice/transfers','POST',{from_store_id:b.from_store_id,to_store_id:b.to_store_id,lines});
      toast('Transfer created'); $('#xferLines').innerHTML=''; addXferLine(); await refreshTransfers();
    }
  }catch(err){ toast(err.message,true); }
});

document.getElementById('boLoginForm').addEventListener('submit',async event=>{
  event.preventDefault();
  const input=$('#boPassword'), password=input.value, button=event.currentTarget.querySelector('button');
  const error=$('#boLoginError'); error.textContent='';
  if(!password) return;
  button.disabled=true;
  try{
    const r=await fetch('/api/backoffice/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',password})});
    const auth=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(auth.error||'Sign in failed');
    KEY=auth.token;
    if($('#boRemember').checked){localStorage.setItem('dankBackofficeToken',KEY);sessionStorage.removeItem('dankBackofficeToken');}
    else{sessionStorage.setItem('dankBackofficeToken',KEY);localStorage.removeItem('dankBackofficeToken');}
    input.value='';
    await boot();
  }catch(e){error.textContent=e.message==='Failed to fetch'?'BackOffice server is unavailable':e.message;}
  finally{button.disabled=false;}
});
async function boot(){
  try{setSidebarCollapsed(localStorage.getItem('dankBOSidebarCollapsed')==='true');}catch(_){}
  try{ const saved=localStorage.getItem('dankBOTheme'); document.documentElement.setAttribute('data-theme',saved||'light'); }catch(_){}
  if(!KEY){ $('#loginGate').style.display='flex'; return; }
  try{
    const r=await fetch('/api/backoffice/auth',{method:'POST',headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify({action:'verify'})});
    const auth=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error('session expired');
    PROFILE=auth.profile; PERMS=auth.permissions||[];
  }catch(e){
    KEY=''; localStorage.removeItem('dankBackofficeToken'); sessionStorage.removeItem('dankBackofficeToken');
    $('#loginGate').style.display='flex'; $('#loginGate').querySelector('p').textContent='Your session expired — please sign in again.';
    return;
  }
  $('#loginGate').style.display='none'; $('#app').style.display='block';
  const main=$('#main');
  const startup=beginDataLoad(main,'dashboard');
  try{ const s=await boGet('/api/backoffice/stores'); STORES=s.rows||[]; }catch(e){}
  await loadStoreDirectory();
  renderNav();
  const firstAllowed=NAV.find(n=>!n.external&&(n.children?n.children.some(child=>can(child.perm)):can(n.perm)));
  let savedPage;
  try{savedPage=JSON.parse(sessionStorage.getItem('dankBOPage')||'null');}catch(_){}
  try{
    const reportPage=sessionStorage.getItem('dankBOReportPage');
    if(REPORT_PAGES.some(([id])=>id===reportPage)){
      REPORT_PAGE=reportPage;
      SALES_REPORT.group=REPORT_BREAKDOWNS.some(([id])=>id===reportPage)?reportPage:'day';
      if(reportPage==='tax')SALES_REPORT.columns=['orders','net','tax','total'];
    }
  }catch(_){}
  const pagePermissions={'product-categories':'inventory_view',stores:'settings','settings-legacy':'settings',food:'inventory_view',kitchen:'inventory_view',suppliers:'inventory_view',purchasing:'inventory_view',expenses:'dashboard'};
  const savedNav=NAV.flatMap(item=>item.children||[item]).find(item=>item.id===savedPage?.tab);
  const savedAllowed=savedPage&&Object.hasOwn(VIEWS,savedPage.tab)&&can(savedNav?.perm||pagePermissions[savedPage.tab]||'dashboard');
  startup.reveal(()=>setTab(savedAllowed?savedPage.tab:firstAllowed?.children?.find(child=>can(child.perm))?.id||firstAllowed?.id||'overview',savedAllowed?savedPage.staffTab:null));
  refreshNotifications();
}
boot();
</script>
