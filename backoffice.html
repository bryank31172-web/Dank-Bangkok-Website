<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DANK BackOffice</title>
<style>
  :root{
    --brand:#007A4D; --brand-dark:#00603c;
    --bg:#f5f7f6; --panel:#ffffff; --text:#14231c; --muted:#5b6b64; --line:#dde4e1;
    --danger:#c0392b; --warn:#b8860b; --ok:#1f8a4c;
    /* Chart series colours — same pair analytics.html validated (brand green
       vs. brand gold fails the colour-blindness check outright, ΔE 4.8
       deuteranopia); s3/s4 extend it for the fulfilment donut's extra
       categories, picked for hue distance from s1/s2 and each other, not
       separately validated the way the two-series pair was. */
    --s1:#1faa63; --s2:#3987e5; --s3:#e8a33d; --s4:#8b5fbf;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1512; --panel:#161f1a; --text:#e8efe9; --muted:#9db0a6; --line:#273830; }
  }
  html[data-theme="dark"]{ --bg:#0f1512; --panel:#161f1a; --text:#e8efe9; --muted:#9db0a6; --line:#273830; }
  html[data-theme="light"]{ --bg:#f5f7f6; --panel:#ffffff; --text:#14231c; --muted:#5b6b64; --line:#dde4e1; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  a{color:var(--brand)}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text)}
  .btn{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-weight:600}
  .btn:hover{background:var(--brand-dark)}
  .btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
  .btn.danger{background:var(--danger)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  th[data-sort]{cursor:pointer;user-select:none;white-space:nowrap}
  th[data-sort]:hover{color:var(--brand)}
  .bulkbar{background:var(--panel);border:1px solid var(--brand);border-radius:8px;padding:8px 12px;margin-bottom:10px}
  svg.chart{display:block;width:100%;height:auto;overflow:visible}
  .gl{stroke:var(--line);stroke-width:1}
  .ax{fill:var(--muted);font-size:10px}
  .dot{stroke:var(--panel);stroke-width:2}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;font-size:12px;color:var(--muted)}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
  .kpicard .lab{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
  .kpicard .val{font-size:26px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
  .kpicard .chg{font-size:12px;margin-top:3px}
  .chg.up{color:var(--ok)} .chg.down{color:var(--danger)}
  .hbar-row{margin:8px 0}
  .hbar-track{background:var(--line);border-radius:6px;height:10px;overflow:hidden}
  .hbar-fill{height:100%;background:var(--s1)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.02em}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
  .badge.open{background:#fff3cd;color:#8a6500}
  .badge.ok{background:#d4f5e3;color:var(--ok)}
  .badge.warn{background:#fde2d8;color:var(--danger)}
  .kpi{font-size:26px;font-weight:800}
  .muted{color:var(--muted)}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  #loginGate{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px;text-align:center;padding:20px}
  #app{display:none}
  header.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header.top b{color:var(--brand);font-size:18px}
  .layout{display:flex;min-height:calc(100vh - 53px)}
  nav.side{width:200px;flex-shrink:0;border-right:1px solid var(--line);background:var(--panel);padding:10px}
  nav.side button{display:block;width:100%;text-align:left;background:none;border:none;padding:10px 12px;border-radius:8px;color:var(--text)}
  nav.side button.on{background:var(--brand);color:#fff}
  nav.side button[hidden]{display:none}
  main{flex:1;padding:18px;min-width:0}
  section[data-view]{display:none}
  section[data-view].on{display:block}
  h2{margin:0 0 14px}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
  .toast.on{opacity:1}
  @media (max-width:760px){
    .layout{flex-direction:column}
    nav.side{width:100%;display:flex;overflow-x:auto;gap:4px;border-right:none;border-bottom:1px solid var(--line)}
    nav.side button{white-space:nowrap}
  }
  /* PDF export = the browser's own print-to-PDF, not a new client-side
     library — keeps the zero-dependency page intact. header/nav/forms/toast
     are hidden; #main's tables print on a plain white page with a title the
     print JS injects just before calling window.print(). */
  #printHeader{display:none}
  @media print{
    header.top, nav.side, .toast, form, button, #storeSel{display:none !important}
    body{background:#fff !important;color:#000 !important}
    .layout{display:block}
    main{padding:0}
    .card{border:1px solid #999;break-inside:avoid}
    #printHeader{display:block !important;margin-bottom:14px}
    #printHeader b{font-size:18px}
    table{font-size:12px}
  }
</style>
</head>
<body>

<div id="loginGate">
  <b style="color:var(--brand);font-size:22px">DANK BackOffice</b>
  <p class="muted">Sign in on the staff portal first, then come back here.</p>
  <a class="btn" href="/staffportal">Go to Staff Portal</a>
</div>

<div id="app">
  <header class="top">
    <b>DANK BackOffice</b>
    <div class="row">
      <select id="storeSel" data-act="store-change" style="padding:6px 8px"></select>
      <span id="whoAmI" class="muted"></span>
      <button class="btn ghost" data-act="theme-toggle">🌓</button>
      <button class="btn ghost" data-act="logout">Log out</button>
    </div>
  </header>
  <div class="layout">
    <nav class="side" id="nav"></nav>
    <div id="printHeader"><b>DANK BackOffice</b><div id="printHeaderSub" class="muted"></div></div>
    <main id="main"></main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'฿'+Math.round(Number(n)||0).toLocaleString();
// Per-unit ingredient costs are routinely sub-baht (rice is ~฿0.05/g) — money()'s
// whole-baht rounding would show every one of them as "฿0". Found by actually
// opening the Food & Drinks tab in a browser, not by code review.
const moneyPrecise=n=>'฿'+(Number(n)||0).toFixed(Number(n)<1?4:2);

/* ---------------- hand-rolled inline-SVG charts (no library — same approach
   analytics.html uses, "a charting library would be a bigger download than
   the whole page") ---------------- */
function niceMaxBO(v){
  if(v<=5) return 5;
  const mag=Math.pow(10,Math.floor(Math.log10(v)));
  return Math.ceil(v/(mag/2))*(mag/2);
}
/* Cumulative sales through each hour of the day, today vs yesterday. */
function hourLineChart(today,yesterday){
  const narrow=window.innerWidth<640;
  const W=narrow?340:680, H=narrow?190:170;
  const P={t:10,r:12,b:22,l:50};
  const top=niceMaxBO(Math.max(1,...today,...yesterday));
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  const x=i=>P.l+(i*iw)/23;
  const y=v=>P.t+ih-(v/top)*ih;
  const grid=[0,top/2,top].map(v=>`<line class="gl" x1="${P.l}" y1="${y(v)}" x2="${W-P.r}" y2="${y(v)}"/>
    <text class="ax" x="${P.l-7}" y="${y(v)+3.5}" text-anchor="end">${money(v)}</text>`).join('');
  const mkPath=(arr,color)=>{
    const d=arr.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const last=arr.length-1;
    return `<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${x(last)}" cy="${y(arr[last])}" r="4" fill="${color}"/>`;
  };
  const paths=mkPath(yesterday,'var(--s2)')+mkPath(today,'var(--s1)');
  const xlab=[0,6,12,18,23].map(h=>`<text class="ax" x="${x(h)}" y="${H-6}" text-anchor="middle">${h}:00</text>`).join('');
  const hit=today.map((v,i)=>{
    const w=iw/23;
    const title=`${i}:00\nToday: ${money(today[i])}\nYesterday: ${money(yesterday[i]??0)}`;
    return `<rect x="${(x(i)-w/2).toFixed(1)}" y="${P.t}" width="${w.toFixed(1)}" height="${ih}" fill="transparent"><title>${esc(title)}</title></rect>`;
  }).join('');
  return `<div class="legend"><span><i style="background:var(--s1)"></i>Today</span><span><i style="background:var(--s2)"></i>Yesterday</span></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative sales, today vs yesterday, by hour">${grid}${paths}${xlab}${hit}</svg>`;
}
/* Donut over segments [{label,value,color}] — plain stroked arcs on one
   circle, rotated so the first segment starts at 12 o'clock. */
function donutChart(segments){
  const live=segments.filter(s=>s.value>0);
  const total=live.reduce((s,x)=>s+x.value,0);
  if(!total) return '<p class="muted">No sales in this range.</p>';
  const cx=90,cy=90,r=62,stroke=26,circ=2*Math.PI*r;
  let offset=0;
  const arcs=live.map(s=>{
    const dash=(s.value/total)*circ;
    const el=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${stroke}"
      stroke-dasharray="${dash.toFixed(2)} ${(circ-dash).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}"
      transform="rotate(-90 ${cx} ${cy})"><title>${esc(s.label)}: ${money(s.value)} (${Math.round(s.value/total*100)}%)</title></circle>`;
    offset+=dash; return el;
  }).join('');
  const legend=live.map(s=>`<div class="row" style="gap:6px;margin:3px 0"><i style="width:10px;height:10px;border-radius:2px;background:${s.color};display:inline-block"></i>
    <span>${esc(s.label)} — ${money(s.value)} <span class="muted">(${Math.round(s.value/total*100)}%)</span></span></div>`).join('');
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
    <svg class="chart" style="width:180px;height:180px;flex:none" viewBox="0 0 180 180" role="img" aria-label="Sales by fulfilment">${arcs}</svg>
    <div>${legend}</div></div>`;
}
/* Horizontal bars — one row per entry, width proportional to the max. */
function hBarChart(rows){
  if(!rows.length) return '<p class="muted">No data.</p>';
  const max=Math.max(1,...rows.map(r=>r.value));
  return rows.map(r=>{
    const pct=Math.max(2,Math.round(r.value/max*100));
    return `<div class="hbar-row"><div class="row" style="justify-content:space-between"><span>${esc(r.label)}</span><span class="muted">${money(r.value)}</span></div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${pct}%"></div></div></div>`;
  }).join('');
}

let KEY=localStorage.getItem('dankStaffToken')||sessionStorage.getItem('dankStaffToken')||localStorage.getItem('dankStaffKey')||'';
let PROFILE=null, PERMS=[], STORES=[], CURRENT_STORE='all', TAB='overview';
const can=p=>PERMS.includes('*')||PERMS.includes(p);

function authHeaders(){ return {'X-Staff-Key':KEY,'Authorization':'Bearer '+KEY}; }
async function boGet(path){
  const r=await fetch(path,{headers:authHeaders()});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||j.detail||('HTTP '+r.status));
  return j;
}
async function boSend(path,method,body){
  const r=await fetch(path,{method,headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||j.detail||('HTTP '+r.status));
  return j;
}
let toastT;
function toast(msg,isErr){
  const t=$('#toast'); t.textContent=msg; t.style.background=isErr?'var(--danger)':'var(--text)';
  t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),3200);
}

const NAV=[
  {id:'overview',label:'Overview',perm:'dashboard'},
  {id:'products',label:'Products',perm:'inventory_view'},
  {id:'inventory',label:'Inventory',perm:'inventory_view'},
  {id:'food',label:'Food & Drinks',perm:'food_ops'},
  {id:'kitchen',label:'Kitchen',perm:'kitchen_tickets'},
  {id:'reports',label:'Sales Reports',perm:'dashboard'},
  {id:'suppliers',label:'Suppliers',perm:'suppliers'},
  {id:'purchasing',label:'Purchase Orders',perm:'purchasing'},
  {id:'expenses',label:'Expenses',perm:'expenses'},
  {id:'promotions',label:'Promotions',perm:'promotions'},
  {id:'staff',label:'Staff',perm:'staff_manage',external:'/staffportal#staffinfo'},
  {id:'settings',label:'Settings',perm:'settings'},
];

function renderNav(){
  $('#nav').innerHTML=NAV.map(n=>can(n.perm)
    ?`<button data-act="tab" data-tab="${n.id}" data-ext="${esc(n.external||'')}" class="${TAB===n.id?'on':''}">${esc(n.label)}</button>`
    :'').join('');
}

function renderStoreSelect(){
  $('#storeSel').innerHTML='<option value="all">All stores</option>'+
    STORES.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
  $('#storeSel').value=CURRENT_STORE;
}

/* ---------------- Overview ---------------- */
const OV_RANGES=[{id:'today',label:'Today'},{id:'week',label:'This week'},{id:'month',label:'This month'}];
let OV_RANGE='today';
async function viewOverview(){
  const m=$('#main');
  m.innerHTML=`<h2>Overview</h2>
    <div class="row" style="margin-bottom:12px">${OV_RANGES.map(r=>`<button class="btn ${r.id===OV_RANGE?'':'ghost'}" data-act="ov-range" data-range="${r.id}">${r.label}</button>`).join('')}</div>
    <div id="ovBody"><p class="muted">Loading…</p></div>`;
  await loadOverview();
}
async function loadOverview(){
  const box=$('#ovBody'); if(!box) return;
  box.innerHTML='<p class="muted">Loading…</p>';
  try{
    const d=await boGet(`/api/backoffice/dashboard?range=${OV_RANGE}&store=${encodeURIComponent(CURRENT_STORE)}`);
    const sales=d.sales||{}, lowStock=d.lowStock||{rows:[]}, po=d.purchaseOrders||{}, kt=d.kitchenTickets||{};
    const trend=d.trend||{today:[],yesterday:[]};
    const chanRows=(d.salesByFulfilment?.rows||[]).map((r,i)=>({label:r.fulfilment,value:r.gross,color:['var(--s1)','var(--s2)','var(--s3)','var(--s4)'][i%4]}));
    const storeRows=(d.salesByStoreBreakdown?.rows||[]).map(r=>({label:STORES.find(s=>s.id===r.store_id)?.name||r.store_id,value:r.gross}));
    const top=d.topProducts?.rows||[];
    const chg=sales.changePct;
    const chgHtml=chg==null?'<span class="muted">vs prior period: —</span>':`<span class="chg ${chg>=0?'up':'down'}">${chg>=0?'▲':'▼'} ${Math.abs(chg)}% vs prior period</span>`;
    box.innerHTML=`
      <div class="grid">
        <div class="card kpicard"><div class="lab">Sales (${esc(sales.source||'—')})</div><div class="val">${money(sales.total)}</div><div class="chg">${chgHtml}</div></div>
        <div class="card kpicard"><div class="lab">Orders</div><div class="val">${sales.count||0}</div></div>
        <div class="card kpicard"><div class="lab">Avg order value</div><div class="val">${money(sales.avgOrderValue)}</div></div>
        <div class="card kpicard"><div class="lab">Avg items / order</div><div class="val">${sales.avgItemsPerOrder??0}</div></div>
        <div class="card kpicard"><div class="lab">Low stock</div><div class="val">${lowStock.count||0}</div><div class="muted" style="font-size:11px">items at/under threshold</div></div>
        <div class="card kpicard"><div class="lab">Open purchase orders</div><div class="val">${po.open||0}</div></div>
        <div class="card kpicard"><div class="lab">Pending kitchen tickets</div><div class="val">${kt.pending||0}</div></div>
      </div>
      <div class="card">
        <h3>Sales trend — today vs yesterday</h3>
        ${trend.today.length?hourLineChart(trend.today,trend.yesterday):'<p class="muted">Not available.</p>'}
      </div>
      <div class="row" style="align-items:stretch;flex-wrap:wrap">
        <div class="card" style="flex:1;min-width:280px">
          <h3>Sales by fulfilment</h3>
          <p class="muted" style="font-size:12px">${esc(d.salesByFulfilment?.note||'')}</p>
          ${donutChart(chanRows)}
        </div>
        <div class="card" style="flex:1;min-width:280px">
          <h3>Sales by store</h3>
          ${hBarChart(storeRows)}
        </div>
      </div>
      <div class="card">
        <h3>Top products</h3>
        ${top.length?`<table><tr><th>Product</th><th>Qty sold</th><th>Revenue</th><th>Days sold</th></tr>
          ${top.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.qty)}</td><td>${money(r.gross)}</td><td>${esc(r.daysSold)}</td></tr>`).join('')}
          </table>`:'<p class="muted">No sales in this range.</p>'}
      </div>
      <div class="card">
        <h3>Recent stock adjustments</h3>
        ${renderLedgerTable((d.recentStockAdjustments||{}).rows||[])}
      </div>
      <div class="card">
        <h3>Low-stock items</h3>
        ${lowStock.rows.length?`<table><tr><th>Product</th><th>Store</th><th>Balance</th><th>Threshold</th></tr>
          ${lowStock.rows.map(r=>`<tr><td>${esc(r.product_key)}</td><td>${esc(r.store_id)}</td><td>${esc(r.balance)}</td><td>${esc(r.threshold)}</td></tr>`).join('')}
        </table>`:'<p class="muted">Nothing below threshold.</p>'}
      </div>
    `;
  }catch(e){ box.innerHTML=`<p class="muted">Couldn't load: ${esc(e.message)}</p>`; }
}
function renderLedgerTable(rows){
  if(!rows.length) return '<p class="muted">No movements yet.</p>';
  return `<table><tr><th>When</th><th>Item</th><th>Store</th><th>Δ</th><th>Balance</th><th>Reason</th></tr>
    ${rows.map(r=>`<tr><td>${new Date(r.created_at).toLocaleString()}</td><td>${esc(r.item_type)}:${esc(r.item_key)}</td><td>${esc(r.store_id)}</td>
      <td style="color:${r.qty_delta<0?'var(--danger)':'var(--ok)'}">${r.qty_delta>0?'+':''}${esc(r.qty_delta)}</td>
      <td>${esc(r.balance_after)}</td><td>${esc(r.reason)}</td></tr>`).join('')}</table>`;
}

/* ---------------- Products (BackOffice fields only — BRYAN POS owns the rest) ---------------- */
async function viewProducts(){
  const m=$('#main');
  m.innerHTML=`<h2>Products</h2>
    <p class="muted">Name, price and stock count are owned by BRYAN POS and shown read-only. Cost, supplier and
    per-store par levels are BackOffice-only fields.</p>
    <div class="row"><input id="prodSearch" placeholder="Search by name or SKU…" style="flex:1;min-width:200px"><button class="btn" data-act="prod-search">Search</button></div>
    <div id="prodResults" class="card" style="margin-top:12px"><p class="muted">Search for a product to edit its BackOffice fields.</p></div>`;
}
async function searchProducts(){
  const q=$('#prodSearch').value.trim().toLowerCase();
  const r=await fetch('/api/products'); const j=await r.json().catch(()=>({}));
  const list=(j.products||j||[]).filter(p=>!q||String(p.name||'').toLowerCase().includes(q)||String(p.id||p.sku||'').toLowerCase().includes(q)).slice(0,25);
  $('#prodResults').innerHTML=list.length?`<table><tr><th>Name</th><th>SKU</th><th>Stock</th><th></th></tr>
    ${list.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.id||p.sku)}</td><td>${esc(p.stock)}</td>
      <td><button class="btn ghost" data-act="prod-edit" data-key="${esc(p.id||p.sku)}" data-name="${esc(p.name)}">Edit BackOffice fields</button></td></tr>`).join('')}
    </table>`:'<p class="muted">No matches.</p>';
}
async function editProductSettings(key,name){
  let settings={};
  try{ const j=await boGet(`/api/backoffice/product-settings?product_key=${encodeURIComponent(key)}`); settings=j.settings||{}; }catch(e){}
  const suppliers=await loadSuppliersCached();
  $('#prodResults').innerHTML=`<h3>${esc(name)}</h3>
    <form data-act="prod-settings-save" data-key="${esc(key)}" class="row">
      <label>Cost price <input name="cost_price" type="number" step="0.01" value="${esc(settings.cost_price??'')}" style="width:110px"></label>
      <label>Supplier <select name="supplier_id"><option value="">—</option>${suppliers.map(s=>`<option value="${esc(s.id)}" ${s.id===settings.supplier_id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>
      <label><input type="checkbox" name="track_stock" ${settings.track_stock!==false?'checked':''}> Track stock</label>
      <button class="btn" type="submit">Save</button>
      <button class="btn ghost" type="button" data-act="prod-search">Back to search</button>
    </form>`;
}
let _suppliersCache=null;
async function loadSuppliersCached(){

let _ledgerRows=[], _ledgerSort={key:'created_at',dir:'desc'};
async function refreshLedger(){
  try{
    const limit=$('#invLimit')?.value||50;
    const q=CURRENT_STORE!=='all'?`&store=${encodeURIComponent(CURRENT_STORE)}`:'';
    const j=await boGet(`/api/backoffice/inventory?limit=${limit}${q}`);
    _ledgerRows=j.rows||[];
    renderLedgerBox();
  }catch(e){ $('#ledgerBox').innerHTML=`<p class="muted">Couldn't load: ${esc(e.message)}</p>`; }
}
function renderLedgerBox(){
  const box=$('#ledgerBox'); if(!box) return;
  if(!_ledgerRows.length){ box.innerHTML='<p class="muted">No movements yet.</p>'; return; }
  const {key,dir}=_ledgerSort;
  const rows=[..._ledgerRows].sort((a,b)=>{
    const va=key==='qty_delta'||key==='balance_after'?Number(a[key]):String(a[key]??'');
    const vb=key==='qty_delta'||key==='balance_after'?Number(b[key]):String(b[key]??'');
    return (va<vb?-1:va>vb?1:0)*(dir==='asc'?1:-1);
  });
  const arrow=(k)=>k===key?(dir==='asc'?' ▲':' ▼'):'';
  box.innerHTML=`<table><tr>
    <th data-act="inv-sort" data-key="created_at">When${arrow('created_at')}</th>
    <th data-act="inv-sort" data-key="item_key">Item${arrow('item_key')}</th>
    <th data-act="inv-sort" data-key="store_id">Store${arrow('store_id')}</th>
    <th data-act="inv-sort" data-key="qty_delta">Δ${arrow('qty_delta')}</th>
    <th data-act="inv-sort" data-key="balance_after">Balance${arrow('balance_after')}</th>
    <th data-act="inv-sort" data-key="reason">Reason${arrow('reason')}</th></tr>
    ${rows.map(r=>`<tr><td>${new Date(r.created_at).toLocaleString()}</td><td>${esc(r.item_type)}:${esc(r.item_key)}</td><td>${esc(r.store_id)}</td>
      <td style="color:${r.qty_delta<0?'var(--danger)':'var(--ok)'}">${r.qty_delta>0?'+':''}${esc(r.qty_delta)}</td>
      <td>${esc(r.balance_after)}</td><td>${esc(r.reason)}</td></tr>`).join('')}</table>`;
}

let _poRows=[], _poSort={key:'po_number',dir:'desc'}, _poSelected=new Set();
async function refreshPOs(){
  try{
    const j=await boGet('/api/backoffice/purchase-orders');
    _poRows=j.rows||[];
    _poSelected=new Set([..._poSelected].filter(id=>_poRows.some(po=>po.id===id&&po.status==='draft')));
    renderPOList();
  }catch(e){ $('#poList').innerHTML=`<p class="muted">Couldn't load: ${esc(e.message)}</p>`; }

function renderPOList(){
  const box=$('#poList'); if(!box) return;
  if(!_poRows.length){ box.innerHTML='<p class="muted">No purchase orders yet.</p>'; return; }
  const {key,dir}=_poSort;
  const rows=[..._poRows].sort((a,b)=>{
    const va=String(a[key]??''), vb=String(b[key]??'');
    return (va<vb?-1:va>vb?1:0)*(dir==='asc'?1:-1);
  });
  const arrow=(k)=>k===key?(dir==='asc'?' ▲':' ▼'):'';
  const draftIds=_poRows.filter(po=>po.status==='draft').map(po=>po.id);
  const bulkBar=_poSelected.size?`<div class="row bulkbar"><span>${_poSelected.size} draft PO(s) selected</span>
    <button class="btn ghost" data-act="po-bulk-send">Send selected</button>
    <button class="btn ghost" data-act="po-clear-selection">Clear</button></div>`:'';
  box.innerHTML=bulkBar+`<table><tr>
    <th>${draftIds.length?`<input type="checkbox" id="poSelAll" ${draftIds.length&&draftIds.every(id=>_poSelected.has(id))?'checked':''}>`:''}</th>
    <th data-act="po-sort" data-key="po_number">PO#${arrow('po_number')}</th>
    <th data-act="po-sort" data-key="status">Status${arrow('status')}</th>
    <th data-act="po-sort" data-key="store_id">Store${arrow('store_id')}</th>
    <th>Lines</th><th></th></tr>
    ${rows.map(po=>`<tr><td>${po.status==='draft'?`<input type="checkbox" class="po-sel" data-id="${esc(po.id)}" ${_poSelected.has(po.id)?'checked':''}>`:''}</td>
      <td>${esc(po.po_number)}</td><td><span class="badge ${po.status==='completed'?'ok':po.status==='draft'?'':'open'}">${esc(po.status)}</span></td>
      <td>${esc(po.store_id)}</td><td>${(po.lines||[]).length}</td>
      <td>${po.status==='draft'?`<button class="btn ghost" data-act="po-send" data-id="${esc(po.id)}">Send</button>`:''}
      ${['ordered','receiving'].includes(po.status)?`<button class="btn ghost" data-act="po-receive" data-id="${esc(po.id)}">Receive</button>`:''}</td></tr>`).join('')}
    </table>`;
}
async function receivePO(id){
  const j=await boGet('/api/backoffice/purchase-orders');
  const po=(j.rows||[]).find(p=>p.id===id);
  if(!po) return toast('PO not found',true);
  const lines=[];
  for(const l of po.lines||[]){
    const remaining=Number(l.qty_ordered)-Number(l.qty_received);
    if(remaining<=0) continue;
    const v=prompt(`Receive how much of ${l.item_key}? (ordered ${l.qty_ordered}, received so far ${l.qty_received})`,remaining);
    if(v==null) continue;
    const qty=Number(v); if(qty>0) lines.push({line_id:l.id,qty_received:qty});
  }
  if(!lines.length) return;
  try{ await boSend('/api/backoffice/purchase-orders','POST',{id,action:'receive',lines}); toast('Received'); refreshPOs(); }
  catch(e){ toast(e.message,true); }
}

/* Minimal CSV parser for the import box — handles quoted fields with commas,
   not a general RFC4180 parser, but enough for a bank/accounting export
   with date,amount,description columns in any order. */
function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return [];
  const splitRow=row=>{
    const out=[]; let cur='', inQuotes=false;
    for(let i=0;i<row.length;i++){
      const c=row[i];
      if(inQuotes){ if(c==='"'){ if(row[i+1]==='"'){cur+='"';i++;} else inQuotes=false; } else cur+=c; }
      else if(c==='"') inQuotes=true;
      else if(c===','){ out.push(cur); cur=''; }
      else cur+=c;
    }
    out.push(cur); return out.map(s=>s.trim());
  };
  const header=splitRow(lines[0]).map(h=>h.toLowerCase());
  const dateCol=header.findIndex(h=>h.includes('date'));
  const amountCol=header.findIndex(h=>h.includes('amount')||h.includes('total')||h.includes('value'));
  const descCol=header.findIndex(h=>h.includes('desc')||h.includes('note')||h.includes('memo')||h.includes('vendor'));
  return lines.slice(1).map(line=>{
    const cells=splitRow(line);
    return { date: cells[dateCol>=0?dateCol:0], amount: cells[amountCol>=0?amountCol:1], description: descCol>=0?cells[descCol]:'' };
  });
}
async function runImport(){
  const file=$('#importFile')?.files?.[0];
  const label=$('#importLabel')?.value?.trim();
  if(!file) return toast('Choose a CSV file first',true);
  if(!label) return toast('Give this import a source label',true);
  const text=await file.text();
  const rows=parseCSV(text);
  if(!rows.length) return toast('No rows found in that file',true);
  try{
    const j=await boSend('/api/backoffice/import','POST',{import_type:'expenses',source_label:label,rows});
    const s=j.summary;
    $('#importResult').innerHTML=`
      <div class="grid">
        <div class="card"><div class="muted">Matched</div><div class="kpi" style="color:var(--ok)">${s.matched}</div><div class="muted">${money(s.matchedAmount)}</div></div>
        <div class="card"><div class="muted">Unmatched</div><div class="kpi" style="color:var(--warn)">${s.unmatched}</div><div class="muted">${money(s.unmatchedAmount)} — needs a look</div></div>
        <div class="card"><div class="muted">Duplicates in file</div><div class="kpi">${s.duplicates}</div></div>
        <div class="card"><div class="muted">Invalid rows</div><div class="kpi" style="color:var(--danger)">${s.invalid}</div></div>
      </div>`;
    toast('Reconciliation complete');
  }catch(e){ toast(e.message,true); }
}
function readFileAsDataURL(file){
  return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); });
}

function exportCSV(){

  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`dank-backoffice-${$('#repType').value}-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();

/* ---------------- event delegation (one listener, data-act switch — same pattern as staffportal.html) ---------------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;
  switch(act){
    case 'tab': {
      if(el.dataset.ext){ location.href=el.dataset.ext; return; }
      setTab(el.dataset.tab); return;
    }
    case 'ov-range': {
      OV_RANGE=el.dataset.range;
      document.querySelectorAll('[data-act="ov-range"]').forEach(b=>b.classList.toggle('ghost',b.dataset.range!==OV_RANGE));
      await loadOverview(); return;
    }
    case 'theme-toggle': {
      const cur=document.documentElement.getAttribute('data-theme');
      const next=cur==='dark'?'light':'dark';
      document.documentElement.setAttribute('data-theme',next);
      try{ localStorage.setItem('dankBOTheme',next); }catch(_){}
      return;
    }
    case 'logout': { localStorage.removeItem('dankStaffToken'); sessionStorage.removeItem('dankStaffToken'); location.href='/staffportal'; return; }
    case 'prod-search': { await searchProducts(); return; }
    case 'prod-edit': { await editProductSettings(el.dataset.key,el.dataset.name); return; }
    case 'inv-refresh': { await refreshLedger(); return; }
    case 'po-add-line': { addPOLine(); return; }
    case 'po-remove-line': { el.closest('.row').remove(); return; }
    case 'po-send': {
      try{ await boSend('/api/backoffice/purchase-orders','POST',{id:el.dataset.id,action:'send'}); toast('Sent'); refreshPOs(); }
      catch(err){ toast(err.message,true); } return;
    }
    case 'po-receive': { await receivePO(el.dataset.id); return; }
    case 'po-sort': {
      _poSort = _poSort.key===el.dataset.key ? {key:el.dataset.key,dir:_poSort.dir==='asc'?'desc':'asc'} : {key:el.dataset.key,dir:'asc'};
      renderPOList(); return;
    }
    case 'po-clear-selection': { _poSelected.clear(); renderPOList(); return; }
    case 'po-bulk-send': {
      const ids=[..._poSelected];
      if(!ids.length) return;
      if(!confirm(`Send ${ids.length} draft purchase order(s)?`)) return;
      let ok=0, failed=0;
      for(const id of ids){
        try{ await boSend('/api/backoffice/purchase-orders','POST',{id,action:'send'}); ok++; }
        catch(err){ failed++; }
      }
      _poSelected.clear();
      toast(failed?`Sent ${ok}, ${failed} failed`:`Sent ${ok} purchase order(s)`,Boolean(failed));
      refreshPOs(); return;
    }
    case 'recipe-add-line': { addRecipeLine(); return; }
    case 'recipe-remove-line': { el.closest('.row').remove(); return; }
    case 'ticket-advance': {
      try{ await boSend('/api/backoffice/kitchen','PATCH',{id:el.dataset.id,status:el.dataset.to}); toast('Updated'); refreshKitchen(); }
      catch(err){ toast(err.message,true); } return;
    }
    case 'store-save': {
      const tr=el.closest('tr');
      const body={id:el.dataset.id,name:tr.querySelector('.st-name').value,address:tr.querySelector('.st-address').value,active:tr.querySelector('.st-active').checked};
      try{ await boSend('/api/backoffice/stores','PATCH',body); toast('Saved'); STORES=(await boGet('/api/backoffice/stores')).rows||[]; renderStoreSelect(); }
      catch(err){ toast(err.message,true); } return;
    }
    case 'staff-scopes-save': {
      const tr=el.closest('tr');
      const scopes=[...tr.querySelectorAll('input[type=checkbox]:checked')].map(cb=>cb.className.replace('sc-',''));
      try{ await boSend('/api/staff-auth','POST',{action:'scopes',id:el.dataset.id,scopes}); toast('Permissions saved'); }
      catch(err){ toast(err.message,true); } return;
    }
    case 'rep-load': { await loadReport(); return; }
    case 'rep-export': { exportCSV(); return; }
    case 'rep-export-pdf': { printSection(REPORT_TYPES.find(t=>t.id===$('#repType').value)?.label||'Report'); return; }
    case 'audit-load': { await renderAuditLog(); return; }
    case 'exp-export-pdf': { printSection('Expenses'); return; }
    case 'import-run': { await runImport(); return; }
    case 'exp-sort': {
      _expSort = _expSort.key===el.dataset.key ? {key:el.dataset.key,dir:_expSort.dir==='asc'?'desc':'asc'} : {key:el.dataset.key,dir:'asc'};
      renderExpenseList(); return;
    }
    case 'exp-clear-selection': { _expSelected.clear(); renderExpenseList(); return; }
    case 'exp-delete': {
      if(!confirm('Delete this expense? This cannot be undone.')) return;
      try{ await boSend('/api/backoffice/expenses','DELETE',{id:el.dataset.id}); toast('Deleted'); refreshExpenses(); }
      catch(err){ toast(err.message,true); } return;
    }
    case 'exp-bulk-delete': {
      const ids=[..._expSelected];
      if(!ids.length) return;
      if(!confirm(`Delete ${ids.length} expense(s)? This cannot be undone.`)) return;
      let ok=0, failed=0;
      for(const id of ids){
        try{ await boSend('/api/backoffice/expenses','DELETE',{id}); ok++; }
        catch(err){ failed++; }
      }
      _expSelected.clear();
      toast(failed?`Deleted ${ok}, ${failed} failed`:`Deleted ${ok} expense(s)`,Boolean(failed));
      refreshExpenses(); return;
    }
    case 'inv-sort': {
      _ledgerSort = _ledgerSort.key===el.dataset.key ? {key:el.dataset.key,dir:_ledgerSort.dir==='asc'?'desc':'asc'} : {key:el.dataset.key,dir:'asc'};
      renderLedgerBox(); return;
    }
    case 'stk-add-item': { addStkItem(); return; }
    case 'stk-remove-item': { el.closest('.row').remove(); return; }
    case 'stk-open': { _stkDetailId=el.dataset.id; _stkDetailLines=(_stkRows.find(s=>s.id===_stkDetailId)?.lines||[]).map(l=>({...l})); renderStkDetail(); return; }
    case 'stk-close': { _stkDetailId=null; renderStkDetail(); return; }
    case 'stk-save-counts': {
      const lines=_stkDetailLines.map((l,i)=>{
        const input=document.querySelector(`.stk-counted[data-idx="${i}"]`);
        return { item_type:l.item_type, item_key:l.item_key, counted_qty: input&&input.value!==''?Number(input.value):null };
      }).filter(l=>l.counted_qty!=null);
      if(!lines.length) return toast('Enter at least one count',true);
      try{ await boSend('/api/backoffice/stocktakes','PATCH',{id:_stkDetailId,lines}); toast('Counts saved'); await refreshStocktakes(); _stkDetailLines=(_stkRows.find(s=>s.id===_stkDetailId)?.lines||[]).map(l=>({...l})); renderStkDetail(); }
      catch(err){ toast(err.message,true); } return;
    }
    case 'stk-complete': {
      if(!confirm('Complete this count? Every counted item that differs from the ledger will post an adjustment.')) return;
      try{ const j=await boSend('/api/backoffice/stocktakes','POST',{id:_stkDetailId,action:'complete'}); toast(`Completed — ${(j.adjustments||[]).length} adjustment(s) posted`); await refreshStocktakes(); }
      catch(err){ toast(err.message,true); } return;
    }
    case 'xfer-add-line': { addXferLine(); return; }
    case 'xfer-remove-line': { el.closest('.row').remove(); return; }
    case 'xfer-complete': {
      if(!confirm('Complete this transfer? Stock will move from the source to the destination store.')) return;
      try{ await boSend('/api/backoffice/transfers','POST',{id:el.dataset.id,action:'complete'}); toast('Transfer completed'); refreshTransfers(); refreshLedger(); }
      catch(err){ toast(err.message,true); } return;
    }
  }
});

document.addEventListener('submit',async e=>{
  const form=e.target.closest('[data-act]'); if(!form) return;
  e.preventDefault();
  const act=form.dataset.act;
  const fd=new FormData(form);
  const b=Object.fromEntries(fd.entries());
  try{
    if(act==='inv-adjust'){
      b.qty_delta=Number(b.qty_delta);
      await boSend('/api/backoffice/inventory','POST',b);
      toast('Recorded'); form.reset(); refreshLedger();
    } else if(act==='prod-settings-save'){
      await boSend('/api/backoffice/product-settings','POST',{product_key:form.dataset.key,cost_price:b.cost_price?Number(b.cost_price):null,supplier_id:b.supplier_id||null,track_stock:fd.has('track_stock')});
      toast('Saved');
    } else if(act==='supplier-add'){
      await boSend('/api/backoffice/suppliers','POST',b);
      toast('Supplier added'); form.reset(); _suppliersCache=null; viewSuppliers();
    } else if(act==='po-create'){
      const lines=[...$('#poLines').children].map(row=>({
        item_type:row.querySelector('.po-item-type').value,
        item_key:row.querySelector('.po-item-key').value,
        qty_ordered:Number(row.querySelector('.po-qty').value),
        unit_cost:Number(row.querySelector('.po-cost').value)||0,
      })).filter(l=>l.item_key&&l.qty_ordered>0);
      if(!lines.length) return toast('Add at least one line',true);
      await boSend('/api/backoffice/purchase-orders','POST',{...b,lines});
      toast('PO created'); viewPurchasing();
    } else if(act==='ing-add'){
      b.cost_per_unit=Number(b.cost_per_unit)||0;
      await boSend('/api/backoffice/ingredients','POST',b);
      toast('Ingredient added'); viewFood();
    } else if(act==='recipe-add'){
      const lines=[...$('#recipeLines').children].map(row=>({
        ingredient_id:row.querySelector('.rec-ing').value,
        qty:Number(row.querySelector('.rec-qty').value),
      })).filter(l=>l.ingredient_id&&l.qty>0);
      if(!lines.length) return toast('Add at least one ingredient line',true);
      await boSend('/api/backoffice/recipes','POST',{...b,lines});
      toast('Recipe saved'); viewFood();
    } else if(act==='expense-add'){
      b.amount=Number(b.amount);
      const file=$('#expAttachment')?.files?.[0];
      if(file){
        if(file.size>700000) return toast('Receipt photo is too large (max ~700KB)',true);
        b.attachment=await readFileAsDataURL(file);
      }
      await boSend('/api/backoffice/expenses','POST',b);
      toast('Expense recorded'); viewExpenses();
    } else if(act==='store-add'){
      await boSend('/api/backoffice/stores','POST',b);
      toast('Store added'); form.reset(); const s=await boGet('/api/backoffice/stores'); STORES=s.rows||[]; renderStoreSelect(); renderStoreMgmt();
    } else if(act==='stk-start'){
      const items=[...$('#stkItems').children].map(row=>({
        item_type:row.querySelector('.stk-item-type').value,
        item_key:row.querySelector('.stk-item-key').value,
      })).filter(i=>i.item_key);
      if(!items.length) return toast('Add at least one item to count',true);
      await boSend('/api/backoffice/stocktakes','POST',{store_id:b.store_id,items});
      toast('Count started'); $('#stkItems').innerHTML=''; addStkItem(); await refreshStocktakes();
    } else if(act==='xfer-create'){
      if(b.from_store_id===b.to_store_id) return toast('From and to must be different stores',true);
      const lines=[...$('#xferLines').children].map(row=>({
        item_type:row.querySelector('.xfer-item-type').value,
        item_key:row.querySelector('.xfer-item-key').value,
        qty:Number(row.querySelector('.xfer-qty').value),
      })).filter(l=>l.item_key&&l.qty>0);
      if(!lines.length) return toast('Add at least one line',true);
      await boSend('/api/backoffice/transfers','POST',{from_store_id:b.from_store_id,to_store_id:b.to_store_id,lines});
      toast('Transfer created'); $('#xferLines').innerHTML=''; addXferLine(); await refreshTransfers();
    }
  }catch(err){ toast(err.message,true); }
});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='storeSel'){ CURRENT_STORE=t.value; VIEWS[TAB]&&VIEWS[TAB](); return; }
  if(t.id==='invLimit'){ refreshLedger(); return; }
  if(t.classList.contains('po-sel')){
    if(t.checked) _poSelected.add(t.dataset.id); else _poSelected.delete(t.dataset.id);
    renderPOList(); return;
  }
  if(t.id==='poSelAll'){
    const draftIds=_poRows.filter(po=>po.status==='draft').map(po=>po.id);
    if(t.checked) draftIds.forEach(id=>_poSelected.add(id)); else draftIds.forEach(id=>_poSelected.delete(id));
    renderPOList(); return;
  }
  if(t.classList.contains('exp-sel')){
    if(t.checked) _expSelected.add(t.dataset.id); else _expSelected.delete(t.dataset.id);
    renderExpenseList(); return;
  }
  if(t.id==='expSelAll'){
    if(t.checked) _expRows.forEach(e=>_expSelected.add(e.id)); else _expSelected.clear();
    renderExpenseList(); return;
  }
});

/* ---------------- boot ---------------- */
async function boot(){
  try{ const saved=localStorage.getItem('dankBOTheme'); if(saved) document.documentElement.setAttribute('data-theme',saved); }catch(_){}
  if(!KEY){ $('#loginGate').style.display='flex'; return; }
  try{
    const r=await fetch('/api/staff-auth',{method:'POST',headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify({action:'verify'})});
    const auth=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error('session expired');
    PROFILE=auth.profile; PERMS=auth.permissions||[];
  }catch(e){
    $('#loginGate').style.display='flex'; $('#loginGate').querySelector('p').textContent='Your session expired — please sign in again.';
    return;
  }
  $('#loginGate').style.display='none'; $('#app').style.display='block';
  $('#whoAmI').textContent=PROFILE?.name?('👤 '+PROFILE.name):'';
  try{ const s=await boGet('/api/backoffice/stores'); STORES=s.rows||[]; renderStoreSelect(); }catch(e){}
  renderNav();
  const firstAllowed=NAV.find(n=>can(n.perm)&&!n.external);
  setTab(firstAllowed?firstAllowed.id:'overview');
}
boot();
</script>
