<!doctype html>
<html lang="th">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:"TH Krub";
    src:url("assets/fonts/th-krub/TH%20Krub.ttf") format("truetype");
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:"TH Krub";
    src:url("assets/fonts/th-krub/TH%20Krub%20Bold.ttf") format("truetype");
    font-weight:700;
    font-style:normal;
    font-display:swap;
  }
  :root{
    --brand:#007A4D; --brand-dark:#00603c;
    --bg:#f5f7f6; --panel:#ffffff; --text:#14231c; --muted:#5b6b64; --line:#dde4e1;
    --danger:#c0392b; --warn:#b8860b; --ok:#1f8a4c;
    /* Chart series colours — same pair analytics.html validated (brand green
       vs. brand gold fails the colour-blindness check outright, ΔE 4.8
       deuteranopia); s3/s4 extend it for the fulfilment donut's extra
       categories, picked for hue distance from s1/s2 and each other, not
       separately validated the way the two-series pair was. */
    --s1:#1faa63; --s2:#3987e5; --s3:#e8a33d; --s4:#8b5fbf;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1512; --panel:#161f1a; --text:#e8efe9; --muted:#9db0a6; --line:#273830; }
  }
  html[data-theme="dark"]{ --bg:#0f1512; --panel:#161f1a; --text:#e8efe9; --muted:#9db0a6; --line:#273830; }
  html[data-theme="light"]{ --bg:#f5f7f6; --panel:#ffffff; --text:#14231c; --muted:#5b6b64; --line:#dde4e1; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  a{color:var(--brand)}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text)}
  .btn{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-weight:600}
  .btn:hover{background:var(--brand-dark)}
  .btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
  .btn.danger{background:var(--danger)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  th[data-sort]{cursor:pointer;user-select:none;white-space:nowrap}
  th[data-sort]:hover{color:var(--brand)}
  .bulkbar{background:var(--panel);border:1px solid var(--brand);border-radius:8px;padding:8px 12px;margin-bottom:10px}
  svg.chart{display:block;width:100%;height:auto;overflow:visible}
  .gl{stroke:var(--line);stroke-width:1}
  .ax{fill:var(--muted);font-size:10px}
  .dot{stroke:var(--panel);stroke-width:2}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;font-size:12px;color:var(--muted)}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
  .kpicard .lab{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
  .kpicard .val{font-size:26px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
  .kpicard .chg{font-size:12px;margin-top:3px}
  .chg.up{color:var(--ok)} .chg.down{color:var(--danger)}
  .hbar-row{margin:8px 0}
  .hbar-track{background:var(--line);border-radius:6px;height:10px;overflow:hidden}
  .hbar-fill{height:100%;background:var(--s1)}
  /* overflow-x:auto so a wide table (Expenses: checkbox+date+category+vendor+
     amount+note+receipt+delete, 8 columns) scrolls within its own card on a
     narrow phone instead of forcing the whole page wider — found by actually
     resizing a real browser window narrow, not by reading the CSS. */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;overflow-x:auto}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.02em}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
  .badge.open{background:#fff3cd;color:#8a6500}
  .badge.ok{background:#d4f5e3;color:var(--ok)}
  .badge.warn{background:#fde2d8;color:var(--danger)}
  .kpi{font-size:26px;font-weight:800}
  .muted{color:var(--muted)}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  #loginGate{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px;text-align:center;padding:20px}
  #app{display:none}
  header.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header.top b{color:var(--brand);font-size:18px}
  .layout{display:flex;min-height:calc(100vh - 53px)}
  nav.side{width:200px;flex-shrink:0;border-right:1px solid var(--line);background:var(--panel);padding:10px}
  nav.side button{display:block;width:100%;text-align:left;background:none;border:none;padding:10px 12px;border-radius:8px;color:var(--text)}
  nav.side button.on{background:var(--brand);color:#fff}
  nav.side button[hidden]{display:none}
  main{flex:1;padding:18px;min-width:0}
  section[data-view]{display:none}
  section[data-view].on{display:block}
  h2{margin:0 0 14px}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
  .toast.on{opacity:1}
  @media (max-width:760px){
    .layout{flex-direction:column}
    nav.side{width:100%;display:flex;overflow-x:auto;gap:4px;border-right:none;border-bottom:1px solid var(--line)}
    nav.side button{white-space:nowrap;width:auto;flex:0 0 auto}
  }
  @media (max-width:480px){
    header.top{flex-wrap:wrap;gap:8px}
    header.top .row{max-width:100%}
    main{padding:12px}
    .row input,.row select,.row textarea{max-width:100%}
    .grid{grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr))}
  }
  /* PDF export = the browser's own print-to-PDF, not a new client-side
     library — keeps the zero-dependency page intact. header/nav/forms/toast
     are hidden; #main's tables print on a plain white page with a title the
     print JS injects just before calling window.print(). */
  #printHeader{display:none}
  @media print{
    header.top, nav.side, .toast, form, button, #storeSel{display:none !important}
    body{background:#fff !important;color:#000 !important}
    .layout{display:block}
    main{padding:0}
    .card{border:1px solid #999;break-inside:avoid}
    #printHeader{display:block !important;margin-bottom:14px}
    #printHeader b{font-size:18px}
    table{font-size:12px}
  }
  /* Dashboard workspace, following the supplied POS reference. */
  :root{--brand:#4c7cf3;--brand-dark:#3565dc;--bg:#f5f6f8;--text:#202735;--muted:#828896;--line:#edf0f4;--s1:#4c7cf3;--s2:#91b3ff}
  html[data-theme="light"]{--bg:#f5f6f8;--panel:#fff;--text:#202735;--muted:#828896;--line:#edf0f4}
  body{font-family:"Inter","Noto Sans Thai",Tahoma,sans-serif;font-size:13px;line-height:1.6;background:var(--bg);-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font-family:inherit}
  #app{max-width:1600px;margin:28px auto;border:1px solid var(--line);border-radius:18px;overflow:clip;background:var(--panel);box-shadow:0 12px 48px #1b31500a}
  header.top{height:76px;padding:0 24px 0 262px;gap:16px}
  header.top b{font-size:17px;color:var(--text);font-weight:600}
  header.top .row{gap:12px}
  header.top .btn{padding:7px 10px;font-size:12px}
  .layout{min-height:calc(100vh - 135px)}
  nav.side{width:238px;padding:0 15px 20px;position:relative;margin-top:-76px;z-index:6;display:flex;flex-direction:column;gap:4px}
  .side-brand{height:76px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);margin:0 -15px 17px;padding:0 22px}
  .brand-mark{width:34px;height:34px;background:var(--brand);border-radius:11px;color:white;display:grid;place-items:center;font-size:18px;font-weight:800}
  .brand-name{font-size:13px;font-weight:800;letter-spacing:1px}.brand-caption{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:.3px}
  nav.side button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:6px;font-size:13px;margin:2px 0;transition:background .15s}
  nav.side button:hover{background:#4c7cf30d}nav.side button.on{background:var(--brand);box-shadow:0 3px 9px #4c7cf326;color:white}
  .nav-emoji{width:22px;text-align:center;font-size:17px}.side-footer{margin-top:auto;border-top:1px solid var(--line);padding-top:15px}.side-footer button{color:var(--danger)}
  main{padding:24px}h2{font-size:19px;font-weight:600;margin:0 0 5px}h3{font-size:13px;font-weight:600;margin:0 0 14px}
  .card{border-radius:9px;box-shadow:0 2px 5px #20375a03;padding:18px;margin-bottom:14px}
  .summary-card,.chart-card{margin-bottom:0}
  .workspace-heading{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.workspace-heading p{margin:5px 0 0;font-size:12px}
  .period-switch{display:flex;gap:5px;padding:4px;border:1px solid var(--line);border-radius:8px}.period-switch .btn{font-size:11px;padding:7px 12px;border:0}.period-switch .ghost{color:var(--muted)}
  .summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}.summary-grid .wide{grid-column:span 2}
  .summary-card{padding:17px 0 0;overflow:hidden}.summary-content{padding:0 17px 15px;position:relative}.summary-icon{position:absolute;right:17px;top:0;background:#4c7cf30c;padding:3px 5px;border-radius:5px}
  .summary-card .lab{font-size:11px;color:var(--muted);padding-right:28px}.summary-card .val{font-size:25px;letter-spacing:-.7px;font-weight:600;margin:7px 0}.summary-note{font-size:10px;color:var(--muted);min-height:16px}
  .card-link{width:100%;display:flex;justify-content:space-between;align-items:center;padding:11px 17px;background:transparent;border:0;border-top:1px solid var(--line);color:var(--brand);font-size:11px}
  .dashboard-charts{display:grid;grid-template-columns:1fr 1.8fr;gap:12px;margin:14px 0}.chart-card{min-height:220px}.chart-title{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:20px}.chart-placeholder{min-height:125px;display:grid;place-content:center;text-align:center;color:var(--muted);font-size:12px}.placeholder-ring{width:96px;height:96px;border:16px solid var(--line);border-radius:50%;margin:0 auto 12px}
  .data-notice{padding:10px 14px;background:#4c7cf309;border:1px solid #4c7cf31a;border-radius:8px;color:var(--muted);font-size:11px;margin:12px 0}
  .dashboard-section{margin-top:22px}.section-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.section-heading p{margin:5px 0;color:var(--muted);font-size:11px}.empty-table{padding:34px 16px;text-align:center;color:var(--muted)}
  .module-tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.module-tools button{font-size:12px}
  #loginGate form{padding:24px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  @media(min-width:1100px){#app{width:calc(100% - 80px)}}
  @media(max-width:1000px){header.top{padding-left:222px}nav.side{width:198px}.summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-charts{grid-template-columns:1fr 1fr}}
  @media(max-width:760px){#app{margin:0;border-radius:0;border:0}header.top{height:auto;min-height:64px;padding:14px 16px;flex-wrap:wrap}.layout{flex-direction:column}nav.side{margin-top:0;width:100%;padding:8px 10px;flex-direction:row;position:static;overflow:auto;gap:5px}.side-brand,.side-footer{display:none}nav.side button{flex:0 0 auto;width:auto;padding:9px 12px}.nav-emoji{width:auto}main{padding:18px}.workspace-heading{flex-wrap:wrap}.dashboard-charts{grid-template-columns:1fr}.summary-grid{gap:9px}.period-switch .btn{padding:6px 9px}}
  @media(max-width:760px){.side-footer{display:block;flex:0 0 auto;margin:0;padding:0;border:0}.side-footer button{white-space:nowrap}}
  @media print{#app{margin:0;max-width:none;border:0;box-shadow:none}.module-tools{display:none}}
  header.top{padding:0 24px;height:68px;z-index:20}
  nav.side{margin-top:0;padding-top:18px}
  nav.side button{font-size:calc(13px + 1.5pt)}
  .nav-icon{display:inline-flex;align-items:center;justify-content:center;width:22px;flex:0 0 22px}
  .workspace-content{flex:1;min-width:0}
  .workspace-content,#main[data-view]{background:#F7F7F7}
  main[data-view="overview"] .period-switch{background:var(--panel)}
  .catalog-heading{color:#ff8a05;font-size:30px}
  .product-editor{background:var(--panel);padding:20px}
  .product-editor section{margin:30px 0}
  .product-editor h3{color:#ff8a05;font-size:23px;border-bottom:1px solid var(--line);padding-bottom:8px}
  .product-fields,.product-prices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px}
  .product-prices{grid-template-columns:repeat(3,minmax(0,1fr));padding:14px;border:1px solid var(--line)}
  .product-field{display:grid;gap:6px;align-content:start}
  .product-field :is(input:not([type=checkbox]),select){width:100%;min-height:40px}
  .product-editor [hidden]{display:none!important}
  .product-uom-note{background:#e3f5ff;color:#174061;border:1px solid #91cbff;padding:14px}
  .product-image-preview{display:block;width:120px;height:120px;object-fit:contain;background:var(--bg)}
  .product-editor footer{padding:16px;background:var(--bg)}
  @media(max-width:650px){.product-fields,.product-prices{grid-template-columns:1fr}}
  .catalog-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:16px 0}
  .catalog-pages,.catalog-search{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .catalog-search[hidden],.catalog-bulk[hidden]{display:none}
  .catalog-bulk{display:flex;gap:6px;flex-wrap:wrap}
  .t-acc{
    --acc-expand:250ms;
    --acc-collapse:250ms;
    --acc-chevron:250ms;
    --acc-ease:cubic-bezier(.22,1,.36,1);
    --acc-blur:2px;
    position:relative;
  }
  .t-acc-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--acc-collapse) var(--acc-ease)}
  .t-acc[data-open="true"]>.t-acc-panel{grid-template-rows:1fr;transition-duration:var(--acc-expand)}
  .t-acc-panel-inner{
    min-height:0;overflow:hidden;opacity:0;filter:blur(var(--acc-blur));
    transition:opacity var(--acc-collapse) var(--acc-ease),filter var(--acc-collapse) var(--acc-ease);
  }
  .t-acc[data-open="true"]>.t-acc-panel>.t-acc-panel-inner{opacity:1;filter:blur(0);transition-duration:var(--acc-expand)}
  .t-acc-chevron{display:inline-flex;flex:none;transition:transform var(--acc-chevron,250ms) var(--acc-ease,cubic-bezier(.22,1,.36,1))}
  [aria-expanded="true"]>.t-acc-chevron{transform:scaleY(-1)}
  .t-acc-chevron path{vector-effect:non-scaling-stroke}
  .catalog-bulk .t-acc-panel{position:absolute;top:100%;left:0;z-index:4;min-width:max-content}
  .catalog-menu{display:grid;gap:4px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
  .t-acc-overlay>.t-acc-panel{position:absolute;right:0;top:100%;z-index:35}
  .t-acc-overlay>.t-acc-panel>.t-acc-panel-inner{padding:0}
  .t-acc-overlay>.t-acc-panel>.t-acc-panel-inner>*{position:static}
  .t-acc-overlay>.t-acc-panel>.t-acc-panel-inner>.orders-date-popover{margin-top:12px}
  .t-acc-overlay>.t-acc-panel>.t-acc-panel-inner>.orders-branch-popover{margin-top:8px}
  .t-acc-overlay>:is(button[aria-expanded="true"])+.t-acc-panel{grid-template-rows:1fr;transition-duration:var(--acc-expand)}
  .t-acc-overlay>:is(button[aria-expanded="true"])+.t-acc-panel>.t-acc-panel-inner{opacity:1;filter:blur(0);transition-duration:var(--acc-expand)}
  .t-acc-overlay>button[aria-expanded="false"]+.t-acc-panel,.t-acc[data-open="false"]>.t-acc-panel{pointer-events:none}
  @media(prefers-reduced-motion:reduce){
    .t-acc-panel,.t-acc-panel-inner,.t-acc-chevron{transition:none!important}
  }
  .catalog-low-stock{display:inline-block;background:#b42318;color:#fff;padding:3px 8px;border-radius:4px;font-weight:700}
  .catalog-import-gauge{--percent:0%;margin-top:12px}
  /* Adapted from transitions.dev: Skeleton loader and reveal. */
  .t-skel{
    --pulse-dur:1000ms;
    --pulse-min:.5;
    --reveal-dur:400ms;
    --reveal-blur:2px;
    --reveal-ease:ease-in-out;
    position:relative;
  }
  .t-skel-skeleton{display:grid;grid-column:1/-1;gap:10px;padding:12px 0;pointer-events:none}
  .t-skel-line{
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:12px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--panel);
    animation:t-skel-pulse var(--pulse-dur) ease-in-out infinite;
  }
  .t-skel-line i,.t-skel-block i{display:block;height:12px;border-radius:4px;background:var(--line)}
  .t-skel-line i:nth-child(2n){width:72%}
  .t-skel-cards{grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr))}
  .t-skel-block{
    display:grid;
    align-content:center;
    gap:12px;
    min-height:88px;
    padding:16px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--panel);
    animation:t-skel-pulse var(--pulse-dur) ease-in-out infinite;
  }
  .t-skel-block i:last-child{width:55%}
  .t-skel-chart{grid-column:1/-1;min-height:200px}
  .t-skel.is-revealed>.t-skel-skeleton{
    position:absolute;
    inset:0;
    z-index:1;
    overflow:hidden;
    animation:t-skel-exit var(--reveal-dur) var(--reveal-ease) both;
  }
  .t-skel.is-revealed>:not(.t-skel-skeleton){animation:t-skel-enter var(--reveal-dur) var(--reveal-ease)}
  @keyframes t-skel-pulse{50%{opacity:var(--pulse-min)}}
  @keyframes t-skel-exit{to{opacity:0;filter:blur(var(--reveal-blur))}}
  @keyframes t-skel-enter{from{opacity:0;filter:blur(var(--reveal-blur))}}
  @media(prefers-reduced-motion:reduce){
    .t-skel-skeleton *,.t-skel.is-revealed>.t-skel-skeleton,.t-skel.is-revealed>:not(.t-skel-skeleton){animation:none}
  }
  .catalog-import-success{margin:12px 0 0;text-align:center}
  .catalog-import-success svg{width:58px;height:58px;color:var(--ok)}
  /* Success check motion from transitions.dev, scoped to the CSV dialog. */
  .catalog-import-dialog .t-success-check{
    --check-opacity-dur:550ms;
    --check-rotate-dur:550ms;
    --check-rotate-from:80deg;
    --check-bob-dur:450ms;
    --check-y-amount:40px;
    --check-blur-dur:500ms;
    --check-blur-from:10px;
    --check-path-dur:550ms;
    --check-path-delay:80ms;
    --check-ease-out:cubic-bezier(.22,1,.36,1);
    --check-ease-bob:cubic-bezier(.34,1.35,.64,1);
    display:inline-block;
    transform-origin:center;
    opacity:0;
  }
  .t-success-check svg{display:block;overflow:visible}
  .t-success-check svg path{stroke-dasharray:1;stroke-dashoffset:1}
  .t-success-check[data-state="in"]{
    animation:
      t-check-fade var(--check-opacity-dur) var(--check-ease-out) forwards,
      t-check-rotate var(--check-rotate-dur) var(--check-ease-out) forwards,
      t-check-blur var(--check-blur-dur) var(--check-ease-out) forwards,
      t-check-bob var(--check-bob-dur) var(--check-ease-bob) forwards;
  }
  .t-success-check[data-state="in"] svg path{
    animation:t-check-draw var(--check-path-dur) var(--check-ease-out) var(--check-path-delay) forwards;
  }
  @keyframes t-check-fade{from{opacity:0}to{opacity:1}}
  @keyframes t-check-rotate{from{transform:rotate(var(--check-rotate-from))}to{transform:rotate(0deg)}}
  @keyframes t-check-blur{from{filter:blur(var(--check-blur-from))}to{filter:blur(0)}}
  @keyframes t-check-bob{from{translate:0 var(--check-y-amount)}to{translate:0 0}}

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const tabletMenuMedia=matchMedia('(min-width:761px) and (max-width:1024px)');
function setTabletMenu(open){
  document.documentElement.classList.toggle('tablet-menu-open',open&&tabletMenuMedia.matches);
  $('#tabletMenuToggle').setAttribute('aria-expanded',String(open&&tabletMenuMedia.matches));
  $('#nav').inert=tabletMenuMedia.matches&&!open;
}
$('#tabletMenuToggle').addEventListener('click',()=>{
  setTabletMenu(!document.documentElement.classList.contains('tablet-menu-open'));
});
document.addEventListener('click',event=>{
  if(typeof REPORTS_DROPUP_OPEN!=='undefined'&&REPORTS_DROPUP_OPEN&&!event.target.closest('#reportsDropup,[data-tab="reports"]')){
    REPORTS_DROPUP_OPEN=false;
    const menu=$('#reportsDropup');if(menu)menu.hidden=true;
  }
  if(document.documentElement.classList.contains('tablet-menu-open')&&!event.target.closest('#nav,#tabletMenuToggle'))setTabletMenu(false);
},true);
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&document.documentElement.classList.contains('tablet-menu-open')){
    setTabletMenu(false);
    $('#tabletMenuToggle').focus();
  }
});
tabletMenuMedia.addEventListener('change',()=>setTabletMenu(false));
setTabletMenu(false);
const accordionChevron='<svg class="t-acc-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6L8 10L12 6"/></svg>';

function setAccordion(item,open){
  const button=$('.t-acc-head',item);
  if(!open&&item.contains(document.activeElement))button.focus();
  item.dataset.open=String(open);
  button.setAttribute('aria-expanded',String(open));
  $('.t-acc-panel',item).inert=!open;
}

document.addEventListener('click',event=>{
  if(typeof PRODUCTS_DROPUP_OPEN!=='undefined'&&PRODUCTS_DROPUP_OPEN&&!event.target.closest('#productsDropup,[data-act="products-menu"]')){
    PRODUCTS_DROPUP_OPEN=false;
    const menu=$('#productsDropup');if(menu)menu.hidden=true;
    document.querySelector('#mobileBottomNav [data-act="products-menu"]')?.setAttribute('aria-expanded','false');
  }
  document.querySelectorAll('.orders-selection-menu[open]').forEach(menu=>{
    if(!menu.contains(event.target))menu.open=false;
  });
  const item=event.target.closest('.t-acc-head')?.closest('.t-acc[data-open]');
  document.querySelectorAll('.t-acc[data-open="true"]').forEach(open=>{
    if(!open.contains(event.target))setAccordion(open,false);
  });
  if(item)setAccordion(item,item.dataset.open!=='true');
});
document.addEventListener('keydown',event=>{
  if(event.key!=='Escape')return;
  const item=event.target.closest('.t-acc[data-open="true"]');
  if(item)setAccordion(item,false);
});
const dataLoads=new WeakMap();

function beginDataLoad(target,layout='table'){
  const skeleton=document.createElement('div');
  skeleton.className='t-skel-skeleton';
  skeleton.setAttribute('aria-hidden','true');
  const cards=layout==='dashboard'||layout==='cards'||layout==='form';
  if(cards)skeleton.classList.add('t-skel-cards');
  const count=layout==='compact'?2:layout==='form'?3:4;
  for(let index=0;index<count;index++){
    const block=document.createElement('div');
    block.className=cards?'t-skel-block':'t-skel-line';
    block.innerHTML=cards?'<i></i><i></i>':'<i></i><i></i><i></i>';
    skeleton.append(block);
  }
  if(layout==='dashboard'){
    const chart=document.createElement('div');
    chart.className='t-skel-block t-skel-chart';
    chart.innerHTML='<i></i><i></i>';
    skeleton.append(chart);
  }
  target.classList.add('t-skel');
  target.classList.remove('is-revealed');
  target.setAttribute('aria-busy','true');
  target.replaceChildren(skeleton);
  const load={
    current:()=>target.isConnected&&dataLoads.get(target)===load,
    reveal(render){
      if(!load.current())return false;
      target.removeAttribute('aria-busy');
      render();
      if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
        target.classList.add('is-revealed');
        target.append(skeleton);
        const exit=skeleton.getAnimations().find(animation=>animation.animationName==='t-skel-exit');
        if(exit)exit.finished.then(()=>skeleton.remove(),()=>skeleton.remove());
        else skeleton.remove();
      }else skeleton.remove();
      return true;
    }
  };
  dataLoads.set(target,load);
  return load;
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'฿'+Math.round(Number(n)||0).toLocaleString();
// Per-unit ingredient costs are routinely sub-baht (rice is ~฿0.05/g) — money()'s
// whole-baht rounding would show every one of them as "฿0". Found by actually
// opening the Food & Drinks tab in a browser, not by code review.
const moneyPrecise=n=>'฿'+(Number(n)||0).toFixed(Number(n)<1?4:2);

/* ---------------- hand-rolled inline-SVG charts (no library — same approach
   analytics.html uses, "a charting library would be a bigger download than
   the whole page") ---------------- */
/* Cumulative sales through each hour of the day, today vs yesterday. */
function hourLineChart(today,yesterday,trend={}){
  const labels=trend.labels||Array.from({length:24},(_,hour)=>`${String(hour).padStart(2,'0')}:00`);
  const currentLabel=trend.currentLabel||'วันนี้';
  const previousLabel=trend.previousLabel||'เมื่อวาน';
  if(!trend.labels)today=today.slice(0,new Date().getHours()+1);
  const narrow=window.innerWidth<640;
  const W=narrow?380:820, H=narrow?250:310;
  const P={t:18,r:18,b:34,l:76};
  const maximum=Math.max(100,...today,...yesterday);
  const roughStep=maximum/4;
  const magnitude=Math.pow(10,Math.floor(Math.log10(roughStep)));
  const normalizedStep=roughStep/magnitude;
  const step=[1,2,5,10].find(value=>value>=normalizedStep)*magnitude;
  const top=Math.ceil(maximum/step)*step;
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  const pointCount=Math.max(1,labels.length-1);
  const x=i=>P.l+(i*iw)/pointCount;
  const y=v=>P.t+ih-(v/top)*ih;
  const ticks=Array.from({length:Math.round(top/step)+1},(_,index)=>index*step);
  const labelStep=Math.ceil(labels.length/(narrow?6:12));
  const hours=labels.map((_,index)=>index).filter(index=>index%labelStep===0||index===labels.length-1);
  const grid=ticks.map(value=>`<line class="gl" x1="${P.l}" y1="${y(value)}" x2="${W-P.r}" y2="${y(value)}"/>
    <text class="ax" x="${P.l-9}" y="${y(value)+3.5}" text-anchor="end">${Number(value).toLocaleString('en-US')}</text>`).join('')+
    hours.map(hour=>`<line class="gl" x1="${x(hour)}" y1="${P.t}" x2="${x(hour)}" y2="${H-P.b}"/>`).join('');
  const mkPath=(arr,color)=>{
    const d=arr.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const points=arr.map((value,index)=>{
      const currentValue=index<today.length?today[index]:'';
      const previousValue=index<yesterday.length?yesterday[index]:'';
      const label=trend.currentLabel==='ปีนี้'
        ?BOI18n.formatDate(new Date(2000,index,1),'toLocaleDateString',{month:'long'})
        :trend.currentLabel==='เดือนนี้'?`วันที่ ${labels[index]}`:labels[index];
      return `<circle class="sales-chart-point" cx="${x(index)}" cy="${y(value)}" r="4" fill="var(--panel)" stroke="${color}" stroke-width="2" tabindex="0" role="button" aria-pressed="false" aria-label="${esc(label)} · ${esc(currentLabel)} / ${esc(previousLabel)}" aria-describedby="salesChartTooltip" data-chart-index="${index}" data-chart-label="${esc(label)}" data-current-label="${esc(currentLabel)}" data-previous-label="${esc(previousLabel)}" data-current-value="${currentValue}" data-previous-value="${previousValue}"/>`;
    }).join('');
    return `<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${points}`;
  };
  const paths=mkPath(yesterday,'#3399ff')+mkPath(today,'#ff7518');
  const xlab=hours.map(index=>`<text class="ax" x="${x(index)}" y="${H-6}" text-anchor="middle">${esc(labels[index])}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="group" aria-label="ยอดขายสะสม ${esc(currentLabel)} เปรียบเทียบกับ${esc(previousLabel)}">${grid}${paths}${xlab}</svg>
    <div class="legend cumulative-legend"><span><i style="background:#3399ff"></i>${esc(previousLabel)}</span><span><i style="background:#ff7518"></i>${esc(currentLabel)}</span></div>`;
}

let pinnedSalesPoint=null;

function hideSalesTooltip(){
  if(pinnedSalesPoint)pinnedSalesPoint.setAttribute('aria-pressed','false');
  pinnedSalesPoint=null;
  const tooltip=$('#salesChartTooltip');
  tooltip.hidden=true;
  tooltip.dataset.pinned='false';
}

function showSalesTooltip(point,clientX,clientY){
  const tooltip=$('#salesChartTooltip');
  const amount=value=>value===''||!Number.isFinite(Number(value))
    ?'—'
    :`${Number(value).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})} บาท`;
  tooltip.innerHTML=`<div class="sales-tooltip-heading">${esc(point.dataset.chartLabel)}</div>
    <div class="sales-tooltip-row"><span class="sales-tooltip-dot current"></span><span>${esc(point.dataset.currentLabel)}: ${amount(point.dataset.currentValue)}</span></div>
    <div class="sales-tooltip-row"><span class="sales-tooltip-dot previous"></span><span>${esc(point.dataset.previousLabel)}: ${amount(point.dataset.previousValue)}</span></div>`;
  tooltip.hidden=false;
  tooltip.style.left=Math.max(8,Math.min(clientX+16,window.innerWidth-tooltip.offsetWidth-8))+'px';
  tooltip.style.top=Math.max(8,Math.min(clientY+12,window.innerHeight-tooltip.offsetHeight-8))+'px';
}

function pinSalesTooltip(point,clientX,clientY){
  if(pinnedSalesPoint===point){hideSalesTooltip();return;}
  hideSalesTooltip();
  pinnedSalesPoint=point;
  point.setAttribute('aria-pressed','true');
  $('#salesChartTooltip').dataset.pinned='true';
  showSalesTooltip(point,clientX,clientY);
}

document.addEventListener('pointermove',event=>{
  if(pinnedSalesPoint)return;
  const point=event.target.closest('[data-chart-index]');
  if(!point){hideSalesTooltip();return;}
  showSalesTooltip(point,event.clientX,event.clientY);
});
document.addEventListener('focusin',event=>{
  if(pinnedSalesPoint)return;
  const point=event.target.closest('[data-chart-index]');
  if(!point)return;
  const bounds=point.getBoundingClientRect();
  showSalesTooltip(point,bounds.right,bounds.top);
});
document.addEventListener('focusout',event=>{
  if(!pinnedSalesPoint&&event.target.closest('[data-chart-index]'))hideSalesTooltip();
});
document.addEventListener('click',event=>{
  const point=event.target.closest('[data-chart-index]');
  if(point){pinSalesTooltip(point,event.clientX,event.clientY);return;}
  if(!event.target.closest('#salesChartTooltip'))hideSalesTooltip();
});

document.addEventListener('keydown',event=>{
  if(event.key==='Escape'){hideSalesTooltip();return;}
  const point=event.target.closest('[data-chart-index]');
  if(point&&(event.key==='Enter'||event.key===' ')){
    event.preventDefault();

    pinSalesTooltip(point,bounds.right,bounds.top);

});
function repositionPinnedSalesTooltip(){

/* Donut over segments [{label,value,color}] — plain stroked arcs on one
   circle, rotated so the first segment starts at 12 o'clock. */
function donutChart(segments){
  const live=segments.filter(s=>s.value>0);
  const total=live.reduce((s,x)=>s+x.value,0);
  if(!total) return '<p class="muted">No sales in this range.</p>';
  const cx=90,cy=90,r=62,stroke=26,circ=2*Math.PI*r;
  let offset=0;
  const arcs=live.map(s=>{
    const dash=(s.value/total)*circ;
    const el=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${stroke}"
      stroke-dasharray="${dash.toFixed(2)} ${(circ-dash).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}"
      transform="rotate(-90 ${cx} ${cy})"><title>${esc(s.label)}: ${money(s.value)} (${Math.round(s.value/total*100)}%)</title></circle>`;
    offset+=dash; return el;
  }).join('');
  const legend=live.map(s=>`<div class="row" style="gap:6px;margin:3px 0"><i style="width:10px;height:10px;border-radius:2px;background:${s.color};display:inline-block"></i>
    <span>${esc(s.label)} — ${money(s.value)} <span class="muted">(${Math.round(s.value/total*100)}%)</span></span></div>`).join('');
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
    <svg class="chart" style="width:180px;height:180px;flex:none" viewBox="0 0 180 180" role="img" aria-label="Sales by fulfilment">${arcs}</svg>
    <div>${legend}</div></div>`;
}
/* Horizontal bars — one row per entry, width proportional to the max. */
function hBarChart(rows){
  if(!rows.length) return '<p class="muted">No data.</p>';
  const max=Math.max(1,...rows.map(r=>r.value));
  return rows.map(r=>{
    const pct=Math.max(2,Math.round(r.value/max*100));
    return `<div class="hbar-row"><div class="row" style="justify-content:space-between"><span>${esc(r.label)}</span><span class="muted">${money(r.value)}</span></div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${pct}%"></div></div></div>`;
  }).join('');
}

function overviewMockOrders(total,now,range=OV_RANGE){
  const quantities=[3,2,4,1,3,2,5,2,3,4,2,2];
  const weights=[2400,1850,3200,950,2600,1750,4250,1950,2800,3400,1650,2150];
  const names=['MAC1','Blue Dream','Gelato','OG Kush','Wedding Cake','Gorilla Glue','Pineapple Express','Sour Diesel','White Widow','Runtz'];
  const customers=['คุณอาร์ม','คุณเมย์','คุณต้น','คุณแพรว','คุณเจมส์','คุณแนน','คุณบี','คุณกอล์ฟ','คุณฟ้า','คุณมิน','คุณโจ','คุณพลอย'];
  const branchNames=STORE_DIRECTORY.filter(store=>!store.deletedAt).map(store=>store.name);
  if(!branchNames.length)return [];
  const employees=['คุณต้น','คุณเมย์','คุณอาร์ม'];
  const orderTypes=['หน้าร้าน','เดลิเวอรี่'];
  const start=new Date(now);
  start.setHours(0,0,0,0);
  if(range==='week')start.setDate(start.getDate()-(start.getDay()+6)%7);
  if(range==='month')start.setDate(1);
  if(range==='year')start.setMonth(0,1);
  const totalCents=Math.round(total*100);
  const weightSum=weights.reduce((sum,weight)=>sum+weight,0);
  let allocated=0;
  const cancellations=readOrderCancellations();
  return quantities.map((qty,index)=>{
    const cents=index===quantities.length-1?totalCents-allocated:Math.floor(totalCents*weights[index]/weightSum);
    allocated+=cents;
    const netCents=Math.round(cents/1.07);
    const discountCents=index%3===0?Math.round(netCents*0.05):0;
    const costCents=Math.round(netCents*(0.55+(index%4)*0.05));
    const id=`DANK-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-${String(index+1).padStart(3,'0')}`;
    const order = {
      id,
      cancelledAt:cancellations[`${range}:${id}`],
      at:start.getTime()+(now.getTime()-start.getTime())*(index+1)/13,
      customer:customers[index],product:names[index%names.length],qty,
      sku:'DEMO-'+String(index%names.length+1).padStart(3,'0'),
      productKey:'demo-product-'+index%names.length,category:index%3===0?'Exotics':'Top Shelf',
      customerId:'demo-customer-'+index,channel:'sample',
      grams:qty*[1,3.5,5][index%3],total:cents/100,
      branch:branchNames[index%branchNames.length],
      employee:employees[index%employees.length],
      orderType:orderTypes[index%orderTypes.length],
      subtotal:(netCents+discountCents)/100,
      discount:discountCents/100,
      tax:(cents-netCents)/100,
      cost:costCents/100,
      profit:(netCents-costCents)/100,
      payments:[{method:index%2?'PromptPay':'Cash',amount:cents/100,tendered:index%2?cents/100:Math.ceil(cents/10000)*100,change:index%2?0:(Math.ceil(cents/10000)*10000-cents)/100}],
      status:index<9?'สำเร็จ':'กำลังดำเนินการ'
    };
    order.receipt=createOrderReceiptSnapshot(order);
    return order;
  });
}

// Capture sale-time values. This function deliberately never reads the catalogue.
function createOrderReceiptSnapshot(order){
  const copy=value=>JSON.parse(JSON.stringify(value));
  const items=Array.isArray(order.items)&&order.items.length?order.items:[{
    name:order.product,sku:order.sku??null,productKey:order.productKey??null,category:order.category??null,quantity:order.qty,
    unitPrice:order.qty?order.subtotal/order.qty:null,subtotal:order.subtotal,
    discount:order.discount,tax:order.tax,total:order.total
  }];
  const snapshot=copy({version:1,id:order.id,at:order.at,customer:order.customer,
    branch:order.branch,employee:order.employee,orderType:order.orderType,posNumber:order.posNumber,
    items,subtotal:order.subtotal,discount:order.discount,tax:order.tax,total:order.total,profit:order.profit,
    payments:order.payments??[],activity:order.activity??[{at:order.at,type:'Sale recorded',by:order.employee}]});
  function freeze(value){
    if(value&&typeof value==='object'){Object.values(value).forEach(freeze);Object.freeze(value);}
    return value;
  }
  return freeze(snapshot);
}

function overviewDemoData(range=OV_RANGE){
  const yesterday=[2500,2500,2500,2500,2500,2500,2500,2500,10000,18000,18000,18000,18000,18000,20000,25000,31500,32000,32000,53500,55000,62500,63000,65750];
  const today=[1800,1800,1800,1800,1800,1800,1800,1800,12000,22350,22350,22350,24500,27000,30000,33500,37000,41000,45000,54000,58000,62500,66500,68500];
  const now=new Date();
  const hour=now.getHours();
  let trend={
    current:today.slice(0,hour+1),previous:yesterday,
    labels:Array.from({length:24},(_,index)=>`${String(index).padStart(2,'0')}:00`),
    currentLabel:'วันนี้',previousLabel:'เมื่อวาน'
  };
  if(range!=='today'){
    const weekly=range==='week';
    const yearly=range==='year';
    const elapsedPoints=yearly?now.getMonth()+1:weekly?(now.getDay()+6)%7+1:now.getDate();
    const previousPoints=yearly?12:weekly?7:new Date(now.getFullYear(),now.getMonth(),0).getDate();
    const totalPoints=yearly?12:weekly?7:new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
    const sampleSales=yearly
      ?[420000,385000,468000,442000,490000,512000,475000,535000,520000,568000,546000,610000]
      :[18750,22350,26400,24100,31650,38200,29800];
    const cumulative=values=>{
      let sum=0;
      return values.map(value=>{sum+=value;return sum;});
    };
    const progress=yearly
      ?(now.getDate()-1+(hour+1)/24)/new Date(now.getFullYear(),now.getMonth()+1,0).getDate()
      :(hour+1)/24;
    const currentValues=Array.from({length:elapsedPoints},(_,index)=>sampleSales[index%sampleSales.length]*(index===elapsedPoints-1?progress:1));
    const previousValues=Array.from({length:previousPoints},(_,index)=>sampleSales[(index+2)%sampleSales.length]*0.85);
    const labels=yearly
      ?Array.from({length:12},(_,month)=>BOI18n.formatDate(new Date(2000,month,1),'toLocaleDateString',{month:'short'}))
      :weekly?['จ.','อ.','พ.','พฤ.','ศ.','ส.','อา.']:Array.from({length:Math.max(totalPoints,previousPoints)},(_,day)=>String(day+1));
    trend={
      current:cumulative(currentValues),previous:cumulative(previousValues),
      labels,
      currentLabel:yearly?'ปีนี้':weekly?'สัปดาห์นี้':'เดือนนี้',
      previousLabel:yearly?'ปีที่แล้ว':weekly?'สัปดาห์ที่แล้ว':'เดือนที่แล้ว'
    };
  }
  const demoTotal=Math.round(trend.current.at(-1)*100)/100;
  const previous=trend.previous[Math.min(trend.current.length,trend.previous.length)-1];
  const orders=overviewMockOrders(demoTotal,now,range);
  const activeOrders=orders.filter(order=>!order.cancelledAt);
  trend.current=trend.current.map((_,index)=>{
    const cents=activeOrders.filter(order=>{
      const date=new Date(order.at);
      const point={today:date.getHours(),week:(date.getDay()+6)%7,month:date.getDate()-1,year:date.getMonth()}[range];
      return point<=index;
    }).reduce((sum,order)=>sum+Math.round(order.total*100),0);
    return cents/100;
  });
  const gramsByProduct=new Map();
  for(const order of activeOrders){
    gramsByProduct.set(order.product,(gramsByProduct.get(order.product)||0)+order.grams);
  }
  const topProducts=Array.from(gramsByProduct,([name,gramsSold])=>({name,gramsSold})).sort((left,right)=>right.gramsSold-left.gramsSold);
  const total=trend.current.at(-1);
  const orderCount=activeOrders.length;
  const avgOrderValue=orderCount?total/orderCount:0;
  const priorOrderCount=8;
  const change=(current,prior)=>Math.round((current-prior)/prior*1000)/10;
  return {
    ...overviewDemoPeriods(range,now),
    sales:{
      source:'recorded',total,count:orderCount,
      avgOrderValue,avgItemsPerOrder:2.75,
      changePct:change(total,previous),
      avgOrderValueChangePct:change(avgOrderValue,previous/priorOrderCount),
      avgItemsPerOrderChangePct:change(2.75,3),
      totalChange:Math.round((total-previous)*100)/100,
      avgOrderValueChange:Math.round((avgOrderValue-previous/priorOrderCount)*100)/100,
      avgItemsPerOrderChange:2.75-3
    },
    lowStock:{source:'derived',rows:[
      {name:'MAC1',balance:3},
      {name:'Blue Dream',balance:5},
      {name:'Gelato',balance:2},
      {name:'OG Kush',balance:4}
    ]},
    trend,mockOrders:orders,
    topProductsByGrams:{rows:topProducts}
  };
}
function overviewDemoPeriods(range,now){
  const start=new Date(now);
  start.setHours(0,0,0,0);
  if(range==='week')start.setDate(start.getDate()-(start.getDay()+6)%7);
  if(range==='month')start.setDate(1);
  if(range==='year')start.setMonth(0,1);
  const previousStart=new Date(start);
  if(range==='today')previousStart.setDate(previousStart.getDate()-1);
  else if(range==='week')previousStart.setDate(previousStart.getDate()-7);
  else if(range==='month')previousStart.setMonth(previousStart.getMonth()-1);
  else previousStart.setFullYear(previousStart.getFullYear()-1);
  // Sample comparisons use cumulative buckets through the matching hour/day/month.
  const previousEnd=new Date(previousStart);
  if(range==='today')previousEnd.setHours(now.getHours()+1);
  else if(range==='week')previousEnd.setDate(previousEnd.getDate()+(now.getDay()+6)%7+1);
  else if(range==='month')previousEnd.setDate(Math.min(now.getDate(),new Date(start.getFullYear(),start.getMonth(),0).getDate())+1);
  else previousEnd.setMonth(now.getMonth()+1);
  return {
    reportingPeriod:{start:start.toISOString(),end:now.toISOString()},
    comparisonPeriod:{start:previousStart.toISOString(),end:previousEnd.toISOString()},
    chartComparisonPeriod:{start:previousStart.toISOString(),end:start.toISOString()},
    sampleData:true,lastSyncedAt:null
  };
}

function dashboardMoney(value) {
  return 'THB ' + Number(value || 0).toLocaleString('en-US', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function metricChange(value) {
  if (value == null || !Number.isFinite(Number(value))) {
    return '<span class="metric-no-comparison">—</span>';
  }
  const change = Number(value);
  const direction = change > 0 ? 'increase' : change < 0 ? 'decrease' : 'unchanged';
  const arrow = change > 0 ? '↑ ' : change < 0 ? '↓ ' : '';
  const label = change > 0 ? 'เพิ่มขึ้น' : change < 0 ? 'ลดลง' : 'ไม่เปลี่ยนแปลง';
  return `<span class="metric-pill ${direction}" aria-label="${label} ${Math.abs(change)}%">${arrow}${Math.abs(change).toLocaleString('en-US', {maximumFractionDigits: 1})}%</span>`;
}

function metricDifference(value,isPrice){
  if(value==null||!Number.isFinite(Number(value)))return '';
  const amount=Number(value);
  const sign=amount<0?'-':'+';
  const formatted=isPrice?dashboardMoney(Math.abs(amount)):`${Math.abs(amount).toLocaleString('en-US',{maximumFractionDigits:2})} ชิ้น`;
  const comparison={today:'เมื่อวาน',week:'สัปดาห์ที่แล้ว',month:'เดือนที่แล้ว',year:'ปีที่แล้ว'}[OV_RANGE];
  return `<span class="metric-difference" title="เทียบกับ${comparison}">(${sign}${formatted})</span>`;
}

    ${showReport ? `<button class="sales-report-link" data-act="sales-report-from-home" data-tab="reports">รายงานยอดขาย</button>` : ''}
  </section>`;
}

function storeSalesChart(data,available){
  let rows=data.storeSales?.rows;
  if(Array.isArray(data.mockOrders)){
    const totals=new Map();
    for(const order of data.mockOrders){
      if(order.cancelledAt||order.status==='cancelled')continue;
      const name=order.branch||'ไม่ระบุร้านค้า';
      const cents=Math.round(Number(order.total||0)*100)*(order.kind==='return'?-1:1);
      totals.set(name,(totals.get(name)||0)+cents);
    }
    rows=[...totals].map(([name,cents])=>({name,total:cents/100}));
  }
  rows=(rows||[]).slice().sort((a,b)=>b.total-a.total);
  const maximum=Math.max(2500,Math.ceil(Math.max(0,...rows.map(row=>Math.abs(row.total)))/2500)*2500);

function parseCatalogCSV(data){
  const rows=[];
  let row=[],value='',quoted=false;
  const source=data.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
  for(let i=0;i<source.length;i++){
    const char=source[i];
    if(char==='"'){
      if(quoted&&source[i+1]==='"'){value+='"';i++;}
      else if(quoted||value==='')quoted=!quoted;
      else throw new Error('รูปแบบเครื่องหมายคำพูดใน CSV ไม่ถูกต้อง');
    }else if(!quoted&&(char===','||char==='\n')){
      row.push(value);value='';
      if(char==='\n'){if(row.some(Boolean))rows.push(row);row=[];}
    }else value+=char;
  }
  if(quoted)throw new Error('เครื่องหมายคำพูดใน CSV ไม่ครบ');
  row.push(value);
  if(row.some(Boolean))rows.push(row);
  return rows;
}

function readCatalogImport(data,products){
  const [headers,...rows]=parseCatalogCSV(data);
  if(!headers||!rows.length)throw new Error('ไฟล์ CSV ไม่มีรายการสินค้า');
  const fields=headers.map(header=>header.trim().toLowerCase());
  const lookup=(...names)=>names.map(name=>fields.indexOf(name)).find(index=>index>=0)??-1;
  const nameIndex=lookup('ชื่อ','name','product name'),skuIndex=lookup('sku');
  const idIndex=lookup('product id');
  const missing=[nameIndex<0?'ชื่อ (Product Name)':'',skuIndex<0?'SKU':''].filter(Boolean);
  if(missing.length)throw new Error(`CSV ขาดคอลัมน์ ${missing.join(' และ ')}`);
  const columns=[
    ['barcode',lookup('บาร์โค้ด','barcode')],['category',lookup('หมวดหมู่','category')],['tags',lookup('แท็ก','tags','product tags')],
    ['catalogCost',lookup('ต้นทุน (thb)','cost')],['priceExTax',lookup('ราคาไม่รวมภาษี (thb)','priceextax')],
    ['stock',lookup('จำนวน','stock','dank pattanakarn_quantity')],['unit',lookup('unit')]
  ];
  const bySku=new Map();
  for(const product of products){
    const sku=String(product.sku||'').trim().toLowerCase();
    if(sku)bySku.set(sku,bySku.has(sku)?null:product);
  }
  const imported=new Map();
  const seen=new Set();
  for(const [index,row] of rows.entries()){
    const name=row[nameIndex]?.trim(),sku=row[skuIndex]?.trim()??'',id=row[idIndex]?.trim();
    if(index===0&&idIndex>=0&&sku==='#Required(Must be unique)'&&name==='Required'&&id?.startsWith('Please DO NOT TOUCH this column'))continue;
    const skuKey=sku.toLowerCase();
    if(row.length!==fields.length)throw new Error(`จำนวนคอลัมน์ไม่ตรงกับหัวตารางในรายการที่ ${index+1}`);
    if(!name||(!skuKey&&!id))throw new Error(`รายการที่ ${index+1} ต้องมีชื่อและ SKU หรือ Product ID`);
    if(skuKey&&(seen.has(skuKey)||bySku.get(skuKey)===null))throw new Error(`SKU ซ้ำในรายการที่ ${index+1}`);
    if(skuKey)seen.add(skuKey);
    const existing=bySku.get(skuKey);
    const key=String(existing?.id||existing?.sku||(id?`csv:product-id:${id}`:`csv:${skuKey}`));
    if(imported.has(key))throw new Error(`Product ID ซ้ำในรายการที่ ${index+1}`);
    const product={name,sku};
    for(const [property,column] of columns){
      const value=row[column]?.trim();
      if(!value)continue;
      if(property==='stock'){
        const quantity=value.match(/^(-?\d+(?:\.\d+)?)(?:\s+(.+))?$/);
        if(!quantity)throw new Error(`จำนวนไม่ถูกต้องที่บรรทัด ${index+2}`);
        product.stock=Number(quantity[1]);
        if(quantity[2])product.unit=quantity[2];
      }else if(property==='catalogCost'||property==='priceExTax'){
        const amount=Number(value.replace(/,/g,''));
        if(!Number.isFinite(amount)||amount<0)throw new Error(`ราคาไม่ถูกต้องที่บรรทัด ${index+2}`);
        product[property]=amount;
      }else product[property]=value;
    }
    imported.set(key,product);
  }
  if(!imported.size)throw new Error('ไฟล์ CSV ไม่มีรายการสินค้า');
  return imported;
}

          if(elapsed<1)progressFrame=requestAnimationFrame(step);
          else resolve();
        }
        progressFrame=requestAnimationFrame(step);
      });
    }
    const closeImport=$('button',importDialog);
    let importSaved=false;
    importDialog.addEventListener('cancel',event=>{if(closeImport.disabled)event.preventDefault();});
    importDialog.addEventListener('close',()=>{
      if(importSaved&&section.isConnected)viewProducts();
      else importButton.focus();
    });
    fileInput.addEventListener('change',async()=>{
      const file=fileInput.files[0];
      if(!file)return;
      importSaved=false;
      closeImport.disabled=true;
      closeImport.classList.remove('danger');
      closeImport.textContent='ปิด';
      importDialog.classList.remove('is-success');
      importDialog.setAttribute('aria-labelledby',importTitle.id);
      importTitle.hidden=false;
      importSuccess.hidden=true;
      successCheck.dataset.state='out';
      gauge.hidden=false;
      drawProgress(0);
      progressText.textContent='กำลังอ่านไฟล์ CSV…';
      importDialog.showModal();
      const nextPaint=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
      try{
        await nextPaint();
        if(file.size>2*1024*1024)throw new Error('ไฟล์ CSV ต้องมีขนาดไม่เกิน 2 MB');
        const csv=await new Promise((resolve,reject)=>{
          const reader=new FileReader();
          reader.onprogress=event=>{
            if(event.lengthComputable&&event.total){
              animateProgress(Math.round(75*event.loaded/event.total));
            }
          };
          reader.onload=()=>resolve(reader.result);
          reader.onerror=()=>reject(new Error('ไม่สามารถอ่านไฟล์ CSV ได้'));
          reader.readAsText(file);
        });
        animateProgress(80);
        progressText.textContent='กำลังตรวจสอบรายการสินค้า…';
        await nextPaint();
        const imported=readCatalogImport(csv,products);
        animateProgress(95);
        progressText.textContent='กำลังบันทึกรายการสินค้า…';
        await nextPaint();
        if(!section.isConnected)return;
        const changes=Object.assign(Object.create(null),readCatalogChanges());
        for(const [key,product] of imported)changes[key]={...changes[key],...product,hidden:false,archived:false};
        localStorage.setItem(CATALOG_LOCAL_KEY,JSON.stringify(changes));
        catalogState.page=1;
        catalogState.query='';
        importSaved=true;
        await animateProgress(100);
        const before=importDialog.getBoundingClientRect();
        gauge.hidden=true;
        importTitle.hidden=true;
        importSuccess.hidden=false;
        successCheck.dataset.state='in';
        progressText.textContent='Upload successfully';
        importDialog.setAttribute('aria-labelledby',progressText.id);
        closeImport.classList.add('danger');
        closeImport.textContent='Done';
        importDialog.classList.add('is-success');
        if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
          const after=importDialog.getBoundingClientRect();
          importDialog.animate([
            {width:`${before.width}px`,height:`${before.height}px`},
            {width:`${after.width}px`,height:`${after.height}px`}
          ],{duration:320,easing:'cubic-bezier(.22,1,.36,1)'});
        }
      }catch(error){
        cancelAnimationFrame(progressFrame);
        gauge.hidden=true;
        progressText.textContent=`นำเข้าไม่สำเร็จ · ${error.message}`;
      }finally{
        fileInput.value='';
        closeImport.disabled=false;
        if(importDialog.open)closeImport.focus();
      }
    });
    const exactIndex=target?rows.findIndex(({key,product})=>key===target.key||product.sku===target.key):-1;
    const sameName=target?.name?rows.filter(row=>row.product.name===target.name):[];
    const index=exactIndex>=0?exactIndex:sameName.length===1?rows.indexOf(sameName[0]):-1;
    if(index>=0)catalogState.page=Math.floor(index/catalogState.size)+1;
    render();
    if(index>=0){
      const row=[...results.querySelectorAll('[data-product-key]')].find(element=>element.dataset.productKey===rows[index].key);
      row?.classList.add('notification-target');
      row?.scrollIntoView({block:'center'});
      row?.querySelector('input')?.focus({preventScroll:true});
    }else if(target){
      toast('ไม่พบสินค้านี้ในรายการสินค้า',true);
    }
  }catch(error){results.textContent=error.message;}
}

let _ledgerRows=[], _ledgerSort={key:'created_at',dir:'desc'};
async function refreshLedger(){
  const box=$('#ledgerBox');
  if(!box)return;
  const load=beginDataLoad(box);
  try{
    const limit=$('#invLimit')?.value||50;
    const q=CURRENT_STORE!=='all'?`&store=${encodeURIComponent(CURRENT_STORE)}`:'';
    const j=await boGet(`/api/backoffice/inventory?limit=${limit}${q}`);
    if(!load.current())return;
    _ledgerRows=j.rows||[];
    load.reveal(()=>{ renderLedgerBox(); });
  }catch(e){ load.reveal(()=>{ box.innerHTML=`<p class="muted">Couldn't load: ${esc(e.message)}</p>`; }); }
}
function renderLedgerBox(){
  const box=$('#ledgerBox'); if(!box) return;
  if(!_ledgerRows.length){ box.innerHTML='<p class="muted">No movements yet.</p>'; return; }
  const {key,dir}=_ledgerSort;
  const rows=[..._ledgerRows].sort((a,b)=>{
    const va=key==='qty_delta'||key==='balance_after'?Number(a[key]):String(a[key]??'');
    const vb=key==='qty_delta'||key==='balance_after'?Number(b[key]):String(b[key]??'');
    return (va<vb?-1:va>vb?1:0)*(dir==='asc'?1:-1);
  });
  const arrow=(k)=>k===key?(dir==='asc'?' ▲':' ▼'):'';
  box.innerHTML=`<table><tr>
    <th data-act="inv-sort" data-key="created_at">When${arrow('created_at')}</th>
    <th data-act="inv-sort" data-key="item_key">Item${arrow('item_key')}</th>
    <th data-act="inv-sort" data-key="store_id">Store${arrow('store_id')}</th>
    <th data-act="inv-sort" data-key="qty_delta">Δ${arrow('qty_delta')}</th>
    <th data-act="inv-sort" data-key="balance_after">Balance${arrow('balance_after')}</th>
    <th data-act="inv-sort" data-key="reason">Reason${arrow('reason')}</th></tr>
    ${rows.map(r=>`<tr><td>${BOI18n.formatDate(r.created_at,'toLocaleString')}</td><td>${esc(r.item_type)}:${esc(r.item_key)}</td><td>${esc(r.store_id)}</td>

}

async function receivePO(id){
  const j=await boGet('/api/backoffice/purchase-orders');
  const po=(j.rows||[]).find(p=>p.id===id);
  if(!po) return toast('PO not found',true);
  const lines=[];
  for(const l of po.lines||[]){
    const remaining=Number(l.qty_ordered)-Number(l.qty_received);
    if(remaining<=0) continue;
    const v=prompt(`Receive how much of ${l.item_key}? (ordered ${l.qty_ordered}, received so far ${l.qty_received})`,remaining);
    if(v==null) continue;
    const qty=Number(v); if(qty>0) lines.push({line_id:l.id,qty_received:qty});
  }
  if(!lines.length) return;
  try{ await boSend('/api/backoffice/purchase-orders','POST',{id,action:'receive',lines}); toast('Received'); notifyRestock(`ใบสั่งซื้อ ${po.po_number||id}`); refreshNotifications(); refreshPOs(); }
  catch(e){ toast(e.message,true); }
}

/* Minimal CSV parser for the import box — handles quoted fields with commas,
   not a general RFC4180 parser, but enough for a bank/accounting export
   with date,amount,description columns in any order. */
function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return [];
  const splitRow=row=>{
    const out=[]; let cur='', inQuotes=false;
    for(let i=0;i<row.length;i++){
      const c=row[i];
      if(inQuotes){ if(c==='"'){ if(row[i+1]==='"'){cur+='"';i++;} else inQuotes=false; } else cur+=c; }
      else if(c==='"') inQuotes=true;
      else if(c===','){ out.push(cur); cur=''; }
      else cur+=c;
    }
    out.push(cur); return out.map(s=>s.trim());
  };
  const header=splitRow(lines[0]).map(h=>h.toLowerCase());
  const dateCol=header.findIndex(h=>h.includes('date'));
  const amountCol=header.findIndex(h=>h.includes('amount')||h.includes('total')||h.includes('value'));
  const descCol=header.findIndex(h=>h.includes('desc')||h.includes('note')||h.includes('memo')||h.includes('vendor'));
  return lines.slice(1).map(line=>{
    const cells=splitRow(line);
    return { date: cells[dateCol>=0?dateCol:0], amount: cells[amountCol>=0?amountCol:1], description: descCol>=0?cells[descCol]:'' };
  });
}

  const file=$('#importFile')?.files?.[0];

  if(!file) return toast('Choose a CSV file first',true);

function exportCSV(){
  if(!_lastReportRows.length) return toast('Nothing to export — load a report first',true);
  const cols=Object.keys(_lastReportRows[0]);
  /* Report rows can carry a customer-chosen order item name verbatim
     (api/order.js never overwrites it) — a cell starting with =/+/-/@ or a
     tab is the classic CSV/DDE formula-injection vector (Excel/Sheets treat
     a leading = as a formula on open). A leading apostrophe forces the cell
     to plain text in every spreadsheet app without changing the visible
     value, so this is the standard mitigation, not a cosmetic quoting fix. */
  const esc2=v=>{
    let s=String(v??'');
    if(/^[=+\-@\t]/.test(s)) s="'"+s;
    return '"'+s.replace(/"/g,'""')+'"';
  };
  const csv=[cols.join(','),..._lastReportRows.map(r=>cols.map(c=>esc2(r[c])).join(','))].join('\r\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`dank-backoffice-${$('#repType').value}-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

function confirmStoreDeletion(store,entity='ร้านค้า'){
  return new Promise(resolve=>{
    const previousFocus=document.activeElement;
    const dialog=document.createElement('dialog');
    dialog.className='delete-confirm-dialog';
    dialog.setAttribute('aria-labelledby','storeDeleteTitle');
    dialog.setAttribute('aria-describedby','storeDeleteDescription');
    dialog.innerHTML=`<h3 id="storeDeleteTitle">ยืนยันการลบ${entity}</h3><p id="storeDeleteDescription">คุณต้องการลบ${entity} “${esc(store.name)}” ใช่หรือไม่?</p><div class="delete-confirm-actions"><button type="button" data-delete-choice="cancel" autofocus>ยกเลิก</button><button type="button" class="confirm-delete" data-delete-choice="confirm">ยืนยันการลบ</button></div>`;
    const finish=confirmed=>{
      dialog.close();dialog.remove();
      if(!confirmed&&previousFocus?.isConnected)previousFocus.focus();
      resolve(confirmed);
    };
    dialog.addEventListener('click',event=>{
      const button=event.target.closest('[data-delete-choice]');
      if(button)finish(button.dataset.deleteChoice==='confirm');
    });
    dialog.addEventListener('cancel',event=>{event.preventDefault();finish(false);});
    document.body.append(dialog);
    dialog.showModal();
  });
}

async function renderAuditLog(){

  const actor=$('#auditActor')?.value.trim()||'', from=$('#auditFrom')?.value||'', to=$('#auditTo')?.value||'';

    dataLoads.delete(box);
    box.removeAttribute('aria-busy');
    box.classList.remove('is-revealed');
    box.innerHTML='<p class="muted">The start date must be before the end date.</p>';
    return;
  }
  const params=new URLSearchParams({limit:'100'});
  if(type) params.set('entity_type',type);
  if(actor) params.set('actor',actor);
  if(from) params.set('from',new Date(from+'T00:00:00').toISOString());
  if(to){ const end=new Date(to+'T00:00:00'); end.setDate(end.getDate()+1); params.set('to',end.toISOString()); }
  const load=beginDataLoad(box);

function orderDateKey(date){
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}
function orderDateInput(date){
  return `${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}/${date.getFullYear()}`;
}
function parseOrderDate(value){
  const match=String(value).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!match)return null;
  const day=Number(match[1]),month=Number(match[2])-1,year=Number(match[3]);
  const date=new Date(year,month,day);
  return date.getFullYear()===year&&date.getMonth()===month&&date.getDate()===day?date:null;
}
function orderPresetRange(preset,now=new Date(),months=3){
  const end=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const start=new Date(end);
  switch(preset){
    case 'yesterday': start.setDate(start.getDate()-1);end.setDate(end.getDate()-1);break;
    case 'thisWeek': start.setDate(start.getDate()-(start.getDay()+6)%7);break;
    case 'lastWeek': start.setDate(start.getDate()-(start.getDay()+6)%7-7);end.setTime(start.getTime());end.setDate(end.getDate()+6);break;
    case 'last7': start.setDate(start.getDate()-6);break;
    case 'thisMonth': start.setDate(1);break;
    case 'lastMonth': start.setDate(1);end.setDate(0);start.setMonth(start.getMonth()-1);break;
    case 'lastMonths':
      if(!Number.isInteger(months)||months<1)return null;
      start.setDate(1);start.setMonth(start.getMonth()-months);
      start.setDate(Math.min(end.getDate(),new Date(start.getFullYear(),start.getMonth()+1,0).getDate()));
      break;
    case 'thisYear': start.setMonth(0,1);break;
    case 'lastYear': start.setFullYear(start.getFullYear()-1,0,1);end.setFullYear(start.getFullYear(),11,31);break;
  }
  return Number.isFinite(start.getTime())?{start,end,preset}:null;
}
function ensureOrdersData(){

  ORDERS_SOURCE_DATA=OV_DEMO?currentDemoSalesData():{mockOrders:[],sampleData:false};
  ORDERS_SOURCE_PERIOD=OV_RANGE;
  const preset={today:'today',week:'thisWeek',month:'thisMonth',year:'thisYear'}[OV_RANGE];
  ORDERS_DATE_RANGE=orderPresetRange(preset);
  ORDERS_SEARCH='';ORDERS_PAGE=1;ORDERS_DATE_DRAFT=null;

}

    (!search||String(order.id).toLowerCase().includes(search))

  const days=Array.from({length:42},(_,index)=>{
    const date=new Date(first);date.setDate(date.getDate()+index);
    const inside=date>=draft.start&&date<=draft.end;
    const endpoint=date.getTime()===draft.start.getTime()||date.getTime()===draft.end.getTime();
    const label=BOI18n.formatDate(date,'toLocaleDateString',{day:'numeric',month:'long',year:'numeric'});

function applyOrdersDateRange(){
  if(ORDERS_DATE_DRAFT.preset==='lastMonths'&&(!Number.isInteger(ORDERS_DATE_DRAFT.months)||ORDERS_DATE_DRAFT.months<1)){
    $('#ordersDateError').textContent='กรุณาระบุจำนวนเดือนเป็นจำนวนเต็มมากกว่า 0';return;

  if(onSalesReport()){applySalesReportDates(start,end,ORDERS_DATE_DRAFT.preset,ORDERS_DATE_DRAFT.months);return;}

function buildCSV(headings,rows){
  const cell=value=>{
    let text=typeof value==='number'?value.toFixed(2):String(value??'');
    if(typeof value==='string'&&/^[\s]*[=+@\-\t\r]/.test(text))text="'"+text;
    return '"'+text.replace(/"/g,'""')+'"';
  };
  return '\uFEFF'+[headings.map(label=>BOI18n.t(label)),...rows].map(row=>row.map(cell).join(',')).join('\r\n');
}
function orderWithCalculatedProfit(order){
  const cost=order.cost??null;
  const net=order.net??(order.tax==null?null:Math.round((order.total-order.tax-(order.charges||0))*100)/100);
  return {...order,cost,profit:cost===null||net===null?null:Math.round((net-cost)*100)/100};
}
function buildOrdersCSV(orders){
  const headings=['เลขที่รายการ','วันที่ / เวลา','สาขา','พนักงาน','ประเภทคำสั่งซื้อ','ราคาก่อนส่วนลด','ส่วนลด','ภาษี','ยอดรวม','ต้นทุน','กำไร'];
  const rows=orders.map(orderWithCalculatedProfit).map(order=>[
    order.id,BOI18n.formatDate(order.at,'toLocaleString',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}),
    order.branch,order.employee,order.orderType,order.subtotal,order.discount,order.tax,order.total,order.cost,order.profit
  ]);
  return buildCSV(headings,rows);
}
function downloadCSV(csv,filename){
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const link=document.createElement('a');
  link.href=url;link.download=filename;
  document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportOrdersCSV(){
  const csv=buildOrdersCSV(filteredOrders().filter(order=>ORDERS_SELECTED.size?ORDERS_SELECTED.has(order.id):!order.cancelledAt));
  downloadCSV(csv,`dank-orders-${orderDateKey(ORDERS_DATE_RANGE.start)}-${orderDateKey(ORDERS_DATE_RANGE.end)}.csv`);
}

function cancelOrder(receiptId){
  if(!OV_DEMO)return;
  const order=ORDERS_SOURCE_DATA?.mockOrders.find(candidate=>candidate.id===receiptId);
  if(!order||order.cancelledAt)return;
  if(!confirm(`ยืนยันยกเลิกรายการตัวอย่าง ${order.id}?`))return;
  const cancellations=readOrderCancellations();
  const key=`${ORDERS_SOURCE_PERIOD}:${order.id}`;
  const cancelledAt=cancellations[key]||Date.now();
  cancellations[key]=cancelledAt;
  try{localStorage.setItem('dankBOOrderCancellations',JSON.stringify(cancellations));}
  catch(_){toast('ไม่สามารถบันทึกการยกเลิกได้',true);return;}
  order.cancelledAt=cancelledAt;
  OV_LAST_DATA=null;
  openOrderDetail(order.id);
  toast('ยกเลิกรายการแล้ว');
}

function readEmployees(){
  const employees=JSON.parse(localStorage.getItem('dankBOEmployees')||'[]');
  if(!Array.isArray(employees)||employees.some(employee=>!employee||typeof employee.id!=='string'||typeof employee.name!=='string'||typeof employee.employeeId!=='string'||typeof employee.storeId!=='string'))throw new Error('ไม่สามารถอ่านข้อมูลพนักงานที่บันทึกไว้');
  for(const [index,name] of ['คุณต้น','คุณเมย์','คุณอาร์ม'].entries()){
    const id=`sample-employee-${index+1}`;
    if(employees.some(employee=>employee.id===id))continue;
    const store=STORE_DIRECTORY[index]||STORE_DIRECTORY[0];
    if(store)employees.push({id,name,storeId:store.id,employeeId:nextEmployeeId(store.id,employees)});
  }
  return employees;
}
function employeeStorePrefix(storeId){
  const ids=['pattanakarn','sathorn',...STORE_DIRECTORY.map(store=>store.id).filter(id=>!['pattanakarn','sathorn'].includes(id))];
  const index=ids.indexOf(storeId);
  if(index<0)throw new Error('ไม่พบร้านค้าที่กำหนด');
  return String(index+1).padStart(2,'0');
}
function nextEmployeeId(storeId,employees){
  const prefix=employeeStorePrefix(storeId);
  const sequences=employees.flatMap(employee=>[employee.employeeId,...(employee.previousIds||[])])
    .filter(id=>id.startsWith(prefix)&&/^\d+$/.test(id.slice(2))).map(id=>Number(id.slice(2)));
  return prefix+String(Math.max(0,...sequences)+1).padStart(2,'0');
}

const STAFF_SALES_COLUMNS=[
  ['name','ชื่อพนักงาน'],['gross','ยอดขายทั้งหมด (THB)'],['count','ธุรกรรมทั้งหมด'],
  ['discount','ส่วนลดทั้งหมด (THB)'],['discountRate','ส่วนลด (%)'],
  ['manualDiscount','ส่วนลดที่ทำด้วยตนเอง (THB)'],['manualRate','ส่วนลดที่ทำด้วยตนเอง (%)'],
  ['tax','ภาษี (THB)'],['rounding','ปัดเศษทั้งหมด (THB)'],['delivery','ค่าจัดส่ง (THB)'],
  ['service','ค่าบริการ (THB)'],['profit','กำไรขั้นต้น (THB)'],['margin','เปอร์เซ็นกำไรขั้นต้น (%)'],
  ['refund','ยอดคืนทั้งหมด (THB)'],['net','ยอดขายสุทธิ (THB)'],
  ['average','ยอดขายสุทธิโดยเฉลี่ย (THB)'],['newCustomers','ลูกค้าใหม่']
];
let STAFF_SALES_FILTER=null;
let STAFF_SALES_SORT={key:'name',direction:1};
let STAFF_SALES_NOTICE=true;

function staffSalesRows(orders,group){
  const employees=new Map();
  const total={name:'ยอดรวม',gross:0,count:0,discount:0,tax:0,profit:0};
  for(const order of orders){
    const key=JSON.stringify([order.employee,group?order.branch:null]);
    if(!employees.has(key)){
      employees.set(key,{...total,name:order.employee,branch:order.branch});
    }
    for(const row of [employees.get(key),total]){
      row.count++;
      row.gross+=Math.round(order.total*100);
      row.discount+=Math.round(order.discount*100);
      row.tax+=Math.round(order.tax*100);
      row.profit+=Math.round(order.profit*100);
    }
  }
  const finish=row=>{
    const net=row.gross-row.tax;
    return {...row,gross:row.gross/100,discount:row.discount/100,tax:row.tax/100,profit:row.profit/100,
      net:net/100,average:row.count?net/row.count/100:null,
      discountRate:net+row.discount?100*row.discount/(net+row.discount):null,
      margin:net?100*row.profit/net:null};
  };
  const {key,direction}=STAFF_SALES_SORT;
  const rows=[...employees.values()].map(finish).sort((a,b)=>{
    if(key==='name')return direction*a.name.localeCompare(b.name,'th');
    if(a[key]==null)return b[key]==null?0:1;
    if(b[key]==null)return -1;
    return direction*(a[key]-b[key]);
  });
  return {rows,total:finish(total)};
}

function customerDate(value){
  return BOI18n.formatDate(value,'toLocaleDateString',{
    day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Bangkok'
  });
}

const MEMBER_TIERS=['Silver','Bronze','Gold','Diamond'];
const MEMBER_UPGRADES={
  Silver:{start:0,target:10000,next:'Bronze'},
  Bronze:{start:10001,target:30000,next:'Gold'},
  Gold:{start:30001,target:100000,next:'Diamond'}
};

function memberCompletedSpendCents(history){
  return history.reduce((sum,order)=>order.status==='สำเร็จ'&&!order.cancelledAt
    ?sum+Math.round(order.total*100):sum,0);
}
const ADDED_MEMBERS_KEY='dankBOAddedMembers';

function readAddedMembers(){
  const members=JSON.parse(localStorage.getItem(ADDED_MEMBERS_KEY)||'[]');
  if(!Array.isArray(members))throw new Error('Invalid member list');
  return members.map(member=>{
    if(member.tier==='Platinum')return {...member,tier:'Gold'};
    return member;
  });
}

function viewDirectory(){
  ensureOrdersData();
  const orders=ORDERS_SOURCE_DATA.mockOrders;
  const samplePoints=[120,450,820,1650,75,320,940,2100,180,580,1100,2700];
  const samplePurchaseDays=[0,3,7,8,15,30,31,45,60,null,2,21];
  const styles=['ชอบลองสินค้าใหม่','เน้นความคุ้มค่า','ซื้อประจำ'];
  const dayMs=86400000;
  const bangkokDay=value=>Math.floor((value+7*3600000)/dayMs);
  const now=Date.now();
  const today=bangkokDay(now);
  const members=[...new Set(orders.map(order=>order.customer))].map((name,index)=>{
    const daysAgo=samplePurchaseDays[index%samplePurchaseDays.length];
    const history=daysAgo===null?[]:orders.filter(order=>order.customer===name&&!order.cancelledAt)
      .sort((a,b)=>b.at-a.at);
    // Shift sample history as a group so the pill and its history show the same date.
    if(history.length){
      const offset=now-daysAgo*dayMs-history[0].at;
      for(let i=0;i<history.length;i++)history[i]={...history[i],at:history[i].at+offset};
    }
    return {
      name,email:`member${index+1}@example.com`,points:samplePoints[index%samplePoints.length],
      style:styles[index%styles.length],tier:MEMBER_TIERS[index%MEMBER_TIERS.length],
      joined:(history.at(-1)?.at??now)-(45+index*10)*dayMs,
      history
    };
  });
  let addedCount=0;
  let memberStorageError=false;
  try{
    const added=readAddedMembers();
    addedCount=added.length;
    members.push(...added.map(member=>({...member,history:[]})));
  }catch(_){memberStorageError=true;}
  for(const member of members){
    const spend=memberCompletedSpendCents(member.history);
    let upgrade=MEMBER_UPGRADES[member.tier];
    while(upgrade&&spend>=upgrade.target*100){
      member.tier=upgrade.next;
      upgrade=MEMBER_UPGRADES[member.tier];
    }
  }
  const main=$('#main');
  main.innerHTML=`
    ${workspaceBreadcrumb('สมาชิก',[['relationships','บริหารความสัมพันธ์']])}
    <div class="workspace-heading"><div><h2>สมาชิก</h2><p class="muted">ข้อมูลตัวอย่าง ${members.length-addedCount} สมาชิก · บันทึกในเบราว์เซอร์นี้ ${addedCount} สมาชิก</p></div></div>
    ${memberStorageError?'<p role="alert">ไม่สามารถโหลดสมาชิกที่บันทึกในเบราว์เซอร์นี้ได้</p>':''}
    <div class="orders-toolbar" style="justify-content:flex-end">
      <button type="button" class="orders-tool-button" id="memberTierTerms" aria-haspopup="dialog">เงื่อนไขระดับสมาชิก</button>
      <button type="button" class="orders-tool-button" id="memberAdd" aria-haspopup="dialog"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>เพิ่มสมาชิก</button>
    </div>
    <div class="card"><div class="orders-table-scroll"><table class="customer-table">
      <thead><tr><th scope="col">ชื่อสมาชิก</th><th scope="col">ข้อมูลติดต่อ</th><th scope="col">ระดับสมาชิก</th><th scope="col">แต้มสะสม</th><th scope="col">สไตล์สินค้า</th><th scope="col">ซื้อครั้งล่าสุด</th></tr></thead>
      <tbody>${members.map((member,index)=>{
        const latest=member.history[0];
        const days=latest?Math.max(0,today-bangkokDay(latest.at)):null;
        return `<tr data-card-row><td><button type="button" class="order-receipt-link" data-member-index="${index}" aria-haspopup="dialog" aria-label="เปิดการ์ดของ ${esc(member.name)}">${esc(member.name)}</button></td>
          <td>${esc(member.email)}</td><td><span class="member-tier-pill ${esc(member.tier.toLowerCase())}">${esc(member.tier)}</span></td><td>${member.points.toLocaleString('th-TH')}</td><td>${esc(member.style)}</td>
          <td><button type="button" class="customer-recency" data-history-index="${index}" aria-haspopup="dialog">${latest?(days===0?'วันนี้':`${days} วันที่แล้ว`):'ยังไม่เคยซื้อ'}</button></td></tr>`;
      }).join('')||'<tr><td colspan="6" class="empty-table">ไม่พบสมาชิก</td></tr>'}</tbody>
    </table></div></div>
    <dialog class="member-dialog" id="memberCardDialog" aria-labelledby="memberCardTitle"></dialog>
    <dialog class="member-dialog tier-dialog" id="memberTierTermsDialog" aria-labelledby="memberTierTermsTitle"></dialog>
    <dialog class="member-dialog" id="memberAddDialog" aria-labelledby="memberAddTitle"></dialog>`;
  const dialog=$('#memberCardDialog',main);
  $('#memberAdd',main).addEventListener('click',()=>openMemberForm($('#memberAddDialog',main)));
  $('#memberTierTerms',main).addEventListener('click',()=>openTierComparison($('#memberTierTermsDialog',main)));
  main.querySelectorAll('[data-member-index]').forEach(button=>{
    button.closest('tr').addEventListener('click',event=>{
      if(event.target.closest('[data-history-index]'))return;
      openMemberCard(dialog,members[Number(button.dataset.memberIndex)]);
    });
  });
  main.querySelectorAll('[data-history-index]').forEach(button=>{
    button.addEventListener('click',()=>{
      const member=members[Number(button.dataset.historyIndex)];
      dialog.innerHTML=`
        <header><h2 id="memberCardTitle">ประวัติการซื้อ</h2><form method="dialog"><button class="btn ghost" autofocus>ปิด</button></form></header>
        <p>${esc(member.name)}</p>
        ${memberPurchaseHistory(member)}`;
      dialog.showModal();
    });
  });
}

function openMemberForm(dialog){
  dialog.innerHTML=`
    <header><h2 id="memberAddTitle">เพิ่มสมาชิก</h2></header>
    <form>
      <p class="muted">ข้อมูลสมาชิกจะบันทึกในเบราว์เซอร์นี้</p>
      <div class="member-add-fields">
        <label>ชื่อสมาชิก <input name="name" required maxlength="100" autofocus></label>
        <label>ข้อมูลติดต่อ <input name="contact" maxlength="160"></label>
        <label>สไตล์สินค้า <input name="style" maxlength="100"></label>
        <label>ระดับสมาชิก <select name="tier">${MEMBER_TIERS.map(tier=>`<option>${tier}</option>`).join('')}</select></label>
        <label>วันหมดอายุ <input type="month" name="expiry"></label>
      </div>
      <p role="alert" class="orders-date-error"></p>
      <div class="member-add-actions"><button type="submit" class="btn ghost" formmethod="dialog" formnovalidate>ยกเลิก</button><button type="submit" class="btn">บันทึก</button></div>
    </form>`;
  const form=dialog.querySelector('form');
  const error=dialog.querySelector('[role="alert"]');
  form.addEventListener('submit',event=>{
    if(event.submitter?.formMethod==='dialog'&&event.submitter.hasAttribute('formmethod'))return;
    event.preventDefault();
    const data=new FormData(form);
    const name=data.get('name').trim();
    if(!name){error.textContent='กรุณาระบุชื่อสมาชิก';form.elements.name.focus();return;}
    const member={
      name,email:data.get('contact').trim(),style:data.get('style').trim(),points:0,
      tier:data.get('tier'),tierVersion:1,joined:Date.now(),expiry:data.get('expiry')
    };
    try{
      const members=readAddedMembers();
      members.push(member);
      localStorage.setItem(ADDED_MEMBERS_KEY,JSON.stringify(members));
    }catch(_){error.textContent='ไม่สามารถบันทึกสมาชิกได้';return;}
    dialog.close();
    viewDirectory();
    $('#memberAdd').focus();
    toast('เพิ่มสมาชิกแล้ว');
  });
  dialog.showModal();
}
