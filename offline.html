<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#060a07">
  <meta name="robots" content="noindex,nofollow">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DANK BKK">
  <title>Offline · DANK BKK</title>
  <style>
    :root{color-scheme:dark;--bg:#060a07;--panel:#101a12;--line:#294634;--txt:#e8f5ec;--muted:#8fae9a;--green:#7be389}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 10%,#13261a,var(--bg) 58%);color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    body{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
    main{width:min(100%,520px);padding:30px;border:1px solid var(--line);border-radius:24px;background:rgba(16,26,18,.94);box-shadow:0 24px 70px rgba(0,0,0,.45);text-align:center}
    .mark{width:76px;height:76px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;background:#152b1d;border:1px solid var(--line);font-size:38px}
    h1{margin:0 0 10px;font-size:clamp(28px,8vw,42px);line-height:1.05}
    p{margin:0 auto 22px;max-width:38ch;color:var(--muted);line-height:1.6}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    button,a{min-height:48px;border-radius:13px;padding:12px 16px;font:800 14px inherit;text-decoration:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
    button{border:0;background:var(--green);color:#082012}
    a{border:1px solid var(--line);background:#16241a;color:var(--txt)}
    small{display:block;margin-top:18px;color:#6d8a78;line-height:1.5}
    @media(max-width:430px){main{padding:24px 18px}.actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🌿</div>
    <h1>You’re offline</h1>
    <p>Your saved cart and previously opened DANK pages are still available. Reconnect before placing an order or making a payment.</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">Try again</button>
      <a href="/">Open cached shop</a>
    </div>
    <small>Orders and payment requests are never submitted from cached data.</small>
  </main>
  <script src="/pwa-client.js" defer></script>
</body>
</html>
