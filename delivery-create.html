<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Create delivery link · DANK BKK</title>
<style>
:root{--green:#008f4b;--ink:#14251c;--muted:#64756c;--line:#dfebe3;--soft:#f2f8f4;--warn:#b42318}
*{box-sizing:border-box}html,body{margin:0}body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f9f7;color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line)}
header b{letter-spacing:.06em}header small{display:block;color:var(--muted);font-size:12px;letter-spacing:0}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}h2 .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;font-size:13px}
.muted{color:var(--muted);font-size:13px;margin:6px 0 0}.warn{color:var(--warn);font-size:14px;min-height:1.2em;margin:10px 0 0}
input,select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:inherit}input:focus,select:focus{outline:2px solid var(--green);outline-offset:1px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 18px;font:inherit;font-weight:750;background:var(--green);color:#fff;cursor:pointer;text-align:center}
.btn.secondary{background:var(--soft);color:var(--green)}.btn:disabled{opacity:.5}.btn+.btn{margin-top:10px}
.ghost{border:0;background:none;color:var(--green);font:inherit;font-weight:650;padding:6px 0;cursor:pointer}
.orders{display:grid;gap:10px}.order{border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;background:#fff;font:inherit;color:inherit;cursor:pointer;width:100%}
.order b{display:block}.order span{display:block;color:var(--muted);font-size:13px}.order em{font-style:normal;font-size:12px;color:var(--green);font-weight:700}
.picked{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.picked b{display:block}.picked .muted{display:block;margin-top:2px}.picked ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:13px}
.ac{position:relative}.opts{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:4;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px #0002;max-height:260px;overflow:auto}
.opts div{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}.opts div:last-child{border-bottom:0}.opts div[aria-selected=true]{background:var(--soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.done{text-align:center}.tick{width:70px;height:70px;border-radius:50%;background:#e7f5eb;color:var(--green);display:grid;place-items:center;margin:4px auto 12px;font-size:34px}
.done h1{font-size:22px;margin:0 0 4px}.link{display:flex;gap:8px;margin:8px 0 4px}.link input{font-size:13px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{border:0;border-radius:9px;padding:10px 8px;font:inherit;font-size:14px;font-weight:650;background:none;color:var(--muted);cursor:pointer}.tabs button[aria-selected=true]{background:#fff;color:var(--green);box-shadow:0 1px 4px #0001}
.line{display:grid;grid-template-columns:1fr 1fr 36px;gap:6px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}.line .pname{grid-column:1/-1}.line input{padding:11px 10px}
.line label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}.line label input{color:var(--ink);font-size:16px}.line .x{border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer}
.total{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-weight:750}.total input{max-width:140px;text-align:right;font-weight:750}
.check{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}.check input{width:auto}
.ghost.danger{color:var(--warn)}
.hidden{display:none!important}.center{text-align:center;padding:40px 16px;color:var(--muted)}
</style></head><body>
<header><div><b>DANK BKK</b><small>Create delivery link</small></div><button class="ghost" id="closeBtn" type="button">Close</button></header>
<main>
  <div id="loading" class="center" role="status">Signing in with LINE…</div>
  <div id="fatal" class="card hidden" role="alert"></div>

  <form id="form" class="hidden" autocomplete="off" novalidate>
    <section class="card">
      <h2><span class="n">1</span>Order</h2>
      <div class="tabs" role="tablist" aria-label="Order type"><button type="button" role="tab" id="tabNew" aria-selected="true" aria-controls="newOrder">✍️ New order</button><button type="button" role="tab" id="tabWeb" aria-selected="false" aria-controls="webOrder">🌐 Website order</button></div>
      <div id="newOrder" role="tabpanel" aria-labelledby="tabNew">
        <div class="grid2" style="margin-top:0"><input id="custName" type="text" maxlength="80" placeholder="Customer name" aria-label="Customer name"><input id="custPhone" type="tel" inputmode="tel" maxlength="20" placeholder="Customer phone" aria-label="Customer phone"></div>
        <div id="lines"></div>
        <datalist id="productNames"></datalist>
        <button class="ghost" type="button" id="addLine">＋ Add item</button>
        <label class="total" for="total">Total ฿<input id="total" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>
        <p id="totalNote" class="muted">Adds up the prices. Type over it to change it.</p>
      </div>
      <div id="webOrder" class="hidden" role="tabpanel" aria-labelledby="tabWeb">
        <div id="orderPicked" class="hidden"></div>
        <div id="orderList" class="orders"></div>
      </div>
    </section>
    <section class="card">
      <h2><span class="n">2</span>Destination</h2>
      <div class="ac"><input id="place" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="placeOpts" aria-label="Destination" placeholder="Search condo, hotel or address" maxlength="200"><div id="placeOpts" class="opts hidden" role="listbox"></div></div>
      <p id="placeStatus" class="muted" role="status">Type the place, then pick a suggestion to set the map pin.</p>
      <div id="manual" class="grid2 hidden"><input id="lat" type="number" step="any" inputmode="decimal" placeholder="Latitude" aria-label="Latitude"><input id="lng" type="number" step="any" inputmode="decimal" placeholder="Longitude" aria-label="Longitude"></div>
    </section>
    <section class="card">
      <h2><span class="n">3</span>Rider</h2>
      <select id="rider" aria-label="Rider"><option value="">Loading riders…</option></select>
      <div id="riderFields" class="hidden">
        <div class="grid2"><input id="riderName" type="text" maxlength="80" placeholder="Rider name" aria-label="Rider name"><input id="riderPhone" type="tel" inputmode="tel" maxlength="20" placeholder="Rider phone" aria-label="Rider phone"></div>
        <label class="check" id="saveRow"><input id="saveRider" type="checkbox" checked> Save this rider for next time</label>
        <button class="ghost danger" type="button" id="removeRider">Remove from saved riders</button>
      </div>
      <p id="riderNote" class="muted"></p>
      <label for="note" style="display:block;margin-top:14px;font-weight:650;font-size:15px">Note for rider <span class="muted" style="font-weight:400">(optional)</span></label>
      <textarea id="note" rows="3" maxlength="300" placeholder="Gate code, floor, call on arrival, what to collect…" style="width:100%;margin-top:8px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;resize:vertical"></textarea>
    </section>
    <p id="msg" class="warn" role="alert"></p>
    <button id="submit" class="btn" type="submit">Create link &amp; assign rider</button>
  </form>

  <section id="done" class="card done hidden" aria-live="polite">
    <div class="tick" aria-hidden="true">✓</div>
    <h1>Delivery link created</h1>
    <p id="doneInfo" class="muted"></p>
    <p id="doneLine" style="margin:12px 0"></p>
    <div style="text-align:left">
      <label class="muted" for="custLink">Customer tracking link</label>
      <div class="link"><input id="custLink" readonly></div>
      <button class="btn" type="button" id="shareCust">Send customer link</button>
      <button class="btn secondary" type="button" id="copyCust">Copy customer link</button>
      <label class="muted" for="riderLink" style="display:block;margin-top:16px">Rider link (private)</label>
      <div class="link"><input id="riderLink" readonly></div>
      <button class="btn secondary" type="button" id="copyRider">Copy rider link</button>
      <p id="copied" class="muted" role="status"></p>
      <button class="btn secondary" type="button" id="another">Create another</button>
    </div>
  </section>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<script>
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let idToken='',orders=[],riders=[],saved=[],picked=null,dest=null,mode='new',totalEdited=false;
const prices=new Map();
function fatal(t){el('loading').classList.add('hidden');el('form').classList.add('hidden');el('fatal').textContent=t;el('fatal').classList.remove('hidden')}
async function api(method,params){
  const url='/api/delivery'+(method==='GET'?'?'+new URLSearchParams(params):'');
  const r=await fetch(url,{method,cache:'no-store',headers:{'X-Line-Id-Token':idToken,...(method==='POST'?{'Content-Type':'application/json'}:{})},body:method==='POST'?JSON.stringify(params):undefined});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed ('+r.status+')');return j;
}
el('closeBtn').addEventListener('click',()=>{try{if(window.liff?.isInClient?.())return liff.closeWindow()}catch{}history.length>1?history.back():window.close()});

// Order: typed in here (customer ordered by LINE, WhatsApp or phone) or a website order.
function setMode(m){
  mode=m;el('tabNew').setAttribute('aria-selected',String(m==='new'));el('tabWeb').setAttribute('aria-selected',String(m==='web'));
  el('newOrder').classList.toggle('hidden',m!=='new');el('webOrder').classList.toggle('hidden',m!=='web');
}
el('tabNew').addEventListener('click',()=>setMode('new'));
el('tabWeb').addEventListener('click',()=>{setMode('web');renderOrders()});
function addLine(){
  const row=document.createElement('div');row.className='line';
  row.innerHTML='<input class="pname" type="text" list="productNames" maxlength="120" placeholder="Product" aria-label="Product"><label>Qty<input class="pqty" type="number" inputmode="numeric" min="1" max="999" step="1" value="1"></label><label>฿<input class="pprice" type="number" inputmode="decimal" min="0" step="any" placeholder="Price each"></label><button class="x" type="button" aria-label="Remove item">×</button>';
  el('lines').appendChild(row);return row;
}
function lineItems(){return [...el('lines').children].map(r=>({name:r.querySelector('.pname').value.trim(),qty:Number(r.querySelector('.pqty').value),price:r.querySelector('.pprice').value})).filter(i=>i.name)}
function sumLines(){return Math.round(lineItems().reduce((s,i)=>s+(Number(i.price)||0)*(Number(i.qty)||0),0)*100)/100}
function renderTotal(){if(!totalEdited)el('total').value=sumLines()||'';el('totalNote').textContent=totalEdited?'Typed by hand. Clear it to add up the prices again.':'Adds up the prices. Type over it to change it.'}
el('addLine').addEventListener('click',()=>addLine().querySelector('.pname').focus());
el('lines').addEventListener('click',e=>{const x=e.target.closest('.x');if(!x)return;x.parentElement.remove();if(!el('lines').children.length)addLine();renderTotal()});
el('lines').addEventListener('input',e=>{
  // Picking a POS product fills in its price, unless one was typed already.
  const row=e.target.closest('.line');if(e.target.classList.contains('pname')&&prices.has(e.target.value)&&!row.querySelector('.pprice').value)row.querySelector('.pprice').value=prices.get(e.target.value);
  renderTotal();
});
el('total').addEventListener('input',()=>{totalEdited=el('total').value!=='';renderTotal()});
// Suggestions only: any product name can be typed.
async function loadMenu(){
  try{const list=await (await fetch('/api/products',{cache:'no-store'})).json();if(!Array.isArray(list))return;
    for(const p of list){if(!p||p._hidden||!p.name)continue;const tiers=p.priceTiers?.length>1?p.priceTiers:[{label:'',price:p.price}];
      for(const t of tiers){const n=t.label?`${p.name} (${t.label})`:String(p.name);if(!prices.has(n))prices.set(n,Number.isFinite(Number(t.price))?Number(t.price):'')}}
    el('productNames').replaceChildren(...[...prices.keys()].slice(0,800).map(n=>{const o=document.createElement('option');o.value=n;return o}));
  }catch{}
}
function resetNewOrder(){el('custName').value='';el('custPhone').value='';el('lines').replaceChildren();addLine();totalEdited=false;renderTotal()}

function renderOrders(){
  const list=el('orderList'),box=el('orderPicked');
  if(picked){
    list.classList.add('hidden');box.classList.remove('hidden');
    box.innerHTML=`<div class="picked"><div><b>${esc(picked.orderId)}</b><span class="muted">${esc(picked.customer||'Customer')}${picked.address?' · '+esc(picked.address):''}</span><ul>${picked.items.map(i=>`<li>${esc(i.name)} × ${esc(i.qty)}</li>`).join('')}</ul>${picked.tracking?`<p class="muted">Tracking already exists${picked.rider?' · rider '+esc(picked.rider):''}. Continuing will ${picked.rider?'replace the rider':'assign a rider'}.</p>`:''}</div><button class="ghost" type="button" id="changeOrder">Change</button></div>`;
    el('changeOrder').addEventListener('click',()=>{picked=null;renderOrders()});
    return;
  }
  box.classList.add('hidden');list.classList.remove('hidden');
  list.innerHTML=orders.length?orders.map((o,i)=>`<button type="button" class="order" data-i="${i}"><b>${esc(o.orderId)}</b><span>${esc(o.customer||'Customer')}${o.address?' · '+esc(o.address):''}</span>${o.tracking?`<em>${o.rider?'Rider: '+esc(o.rider):'Tracking ready · no rider'}</em>`:''}</button>`).join(''):'<p class="muted">No open delivery orders right now.</p>';
}
el('orderList').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;pickOrder(orders[Number(b.dataset.i)])});
function pickOrder(o){
  picked=o;renderOrders();
  el('place').value=o.address||'';dest=o.coordinates||null;
  el('placeStatus').textContent=dest?'📍 Using the pin the customer chose at checkout. Search to change it.':'Type the place, then pick a suggestion to set the map pin.';
  if(!el('manual').classList.contains('hidden')){el('lat').value=dest?.lat??'';el('lng').value=dest?.lng??''}
}

function manualPin(){el('placeStatus').textContent='Location search unavailable. Enter the pin coordinates.';el('manual').classList.remove('hidden');if(dest){el('lat').value=dest.lat;el('lng').value=dest.lng}}
async function initPlaces(){
  try{
    const r=await fetch('/api/maps-config'),{key}=await r.json();if(!key)return manualPin();
    if(!window.google?.maps?.importLibrary)await new Promise((ok,fail)=>{window.__placesReady=ok;const s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(key)+'&loading=async&libraries=places&callback=__placesReady';s.async=true;s.onerror=fail;document.head.appendChild(s)});
    const {AutocompleteSuggestion,AutocompleteSessionToken}=await google.maps.importLibrary('places');
    const input=el('place'),opts=el('placeOpts');let token=null,preds=[],rev=0,timer,active=-1;
    const close=()=>{opts.classList.add('hidden');input.setAttribute('aria-expanded','false');active=-1};
    async function pick(i){const p=preds[i];if(!p)return;close();const my=++rev;el('placeStatus').textContent='Finding location…';
      try{const place=p.toPlace();await place.fetchFields({fields:['displayName','formattedAddress','location']});if(my!==rev)return;
        dest={lat:place.location.lat(),lng:place.location.lng()};token=null;
        const n=place.displayName||'',a=place.formattedAddress||'';input.value=n&&a&&!a.startsWith(n)?n+', '+a:(a||n||p.text.toString());
        el('placeStatus').textContent='📍 Pin set: '+dest.lat.toFixed(5)+', '+dest.lng.toFixed(5)}catch{manualPin()}}
    input.addEventListener('input',()=>{clearTimeout(timer);const my=++rev;dest=null;el('placeStatus').textContent='Pick a suggestion to set the map pin.';const q=input.value.trim();if(q.length<2)return close();
      timer=setTimeout(async()=>{try{token||=new AutocompleteSessionToken();const {suggestions}=await AutocompleteSuggestion.fetchAutocompleteSuggestions({input:q,includedRegionCodes:['th'],sessionToken:token});if(my!==rev)return;
        preds=suggestions.map(s=>s.placePrediction).filter(Boolean);
        opts.replaceChildren(...preds.map((p,i)=>{const o=document.createElement('div');o.id='po'+i;o.setAttribute('role','option');o.setAttribute('aria-selected','false');o.textContent=p.text.toString();o.addEventListener('mousedown',e=>e.preventDefault());o.addEventListener('click',()=>pick(i));return o}));
        opts.classList.toggle('hidden',!preds.length);input.setAttribute('aria-expanded',String(preds.length>0));if(!preds.length)el('placeStatus').textContent='No match. Try the building or street name.'}catch{manualPin()}},300)});
    input.addEventListener('keydown',e=>{if(opts.classList.contains('hidden'))return;if(e.key==='Escape')return close();
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();active=(active+(e.key==='ArrowDown'?1:preds.length-1)+preds.length)%preds.length;[...opts.children].forEach((c,i)=>c.setAttribute('aria-selected',String(i===active)));input.setAttribute('aria-activedescendant','po'+active)}
      else if(e.key==='Enter'&&active>=0){e.preventDefault();pick(active)}});
    input.addEventListener('blur',()=>setTimeout(close,150));
  }catch{manualPin()}
}

// Rider: a saved rider, a staff account, or a new person typed in (saved for next time when ticked).
// Option values: s:<saved id>, a:<staff account id>, new.
function renderRiders(keep){
  const opt=(v,t)=>`<option value="${esc(v)}">${esc(t)}</option>`;
  el('rider').innerHTML='<option value="">Choose a rider</option>'+
    (saved.length?'<optgroup label="Saved riders">'+saved.map(r=>opt('s:'+r.id,r.name+' · '+r.phone)).join('')+'</optgroup>':'')+
    (riders.length?'<optgroup label="Staff">'+riders.map(r=>opt('a:'+r.id,r.name+' · '+r.phone+(r.onShift?' · on shift':''))).join('')+'</optgroup>':'')+
    opt('new','＋ New rider');
  el('rider').value=[...el('rider').options].some(o=>o.value===keep)?keep:'';riderChanged();
}
async function loadRiders(keep){
  try{const j=await api('GET',{action:'rider-options'});riders=j.riders||[];saved=j.saved||[]}catch(e){el('rider').innerHTML='<option value="">Rider list unavailable</option><option value="new">＋ New rider</option>';el('riderNote').textContent=e.message;return}
  renderRiders(keep);
}
function riderChanged(){
  const v=el('rider').value,s=v.startsWith('s:')&&saved.find(r=>'s:'+r.id===v);
  el('riderFields').classList.toggle('hidden',!(v==='new'||s));el('saveRow').classList.toggle('hidden',v!=='new');el('removeRider').classList.toggle('hidden',!s);
  if(v==='new'){el('riderName').value='';el('riderPhone').value='';el('saveRider').checked=true}
  if(s){el('riderName').value=s.name;el('riderPhone').value=s.phone}
  el('riderNote').textContent=s?'Changes to the name or phone are saved for next time.':v==='new'?'':v?'Staff rider. Their link is posted in the staff LINE group.':'';
}
el('rider').addEventListener('change',()=>{riderChanged();if(el('rider').value==='new')el('riderName').focus()});
el('removeRider').addEventListener('click',async()=>{
  const v=el('rider').value,s=saved.find(r=>'s:'+r.id===v);if(!s||!confirm('Remove '+s.name+' from saved riders?'))return;
  try{saved=(await api('POST',{action:'saved-rider-remove',riderId:s.id})).saved||[];renderRiders('');el('riderNote').textContent=s.name+' removed.'}catch(e){el('riderNote').textContent=e.message}
});

el('form').addEventListener('submit',async e=>{
  e.preventDefault();el('msg').textContent='';
  const items=lineItems();
  if(mode==='web'&&!picked)return el('msg').textContent='Choose the order first.';
  if(mode==='new'){
    if(!items.length){el('msg').textContent='Add at least one product.';return el('lines').querySelector('.pname')?.focus()}
    const bad=items.find(i=>!Number.isInteger(i.qty)||i.qty<1);if(bad)return el('msg').textContent='Check the quantity for '+bad.name+'.';
  }
  if(!el('manual').classList.contains('hidden')){const lat=Number(el('lat').value),lng=Number(el('lng').value);dest=el('lat').value&&el('lng').value&&Math.abs(lat)<=90&&Math.abs(lng)<=180?{lat,lng}:null}
  if(!dest){el('msg').textContent='Choose the destination from the suggestions so the map pin is right.';return el('place').focus()}
  const rv=el('rider').value;if(!rv){el('msg').textContent='Choose a rider.';return el('rider').focus()}
  const typed=rv==='new'||rv.startsWith('s:');
  if(typed&&(!el('riderName').value.trim()||!/^\+?\d{7,15}$/.test(el('riderPhone').value.replace(/[\s()-]/g,'')))){el('msg').textContent='Add the rider name and a valid phone number.';return el(el('riderName').value.trim()?'riderPhone':'riderName').focus()}
  const rider=rv.startsWith('a:')?{riderId:rv.slice(2)}:{rider:{...(rv.startsWith('s:')?{id:rv.slice(2)}:{}),name:el('riderName').value.trim(),phone:el('riderPhone').value.trim(),save:rv!=='new'||el('saveRider').checked}};
  const btn=el('submit');btn.disabled=true;btn.textContent='Creating…';
  try{
    const order=mode==='new'?{manual:{customer:{name:el('custName').value.trim(),phone:el('custPhone').value.trim()},items,total:el('total').value}}:{id:picked.orderId};
    const j=await api('POST',{role:'staff',action:'create',...order,destination:dest,place:el('place').value.trim(),...rider,note:el('note').value.trim()});
    showDone(j);loadRiders(j.rider?.savedId?'s:'+j.rider.savedId:'');
  }catch(err){el('msg').textContent=err.message}finally{btn.disabled=false;btn.textContent='Create link & assign rider'}
});
let lastDone=null;
function showDone(j){
  lastDone=j;const full=u=>location.origin+u,oid=j.orderId||picked?.orderId||'';
  el('form').classList.add('hidden');el('done').classList.remove('hidden');window.scrollTo(0,0);
  el('doneInfo').textContent=oid+' · '+el('place').value.trim()+' · Rider '+j.rider.name;
  el('doneLine').textContent=j.groupPosted?'✅ Rider and customer links posted in the staff LINE group.':'⚠️ Could not post to the staff LINE group. Copy the links below.';
  el('custLink').value=full(j.customerUrl);el('riderLink').value=full(j.driverUrl);
  const canShare=(()=>{try{return liff.isApiAvailable('shareTargetPicker')}catch{return false}})();
  el('shareCust').classList.toggle('hidden',!canShare);
  // Let the staff group see what happened, when the form was opened from a chat.
  try{if(liff.isInClient()&&['group','room','utou'].includes(liff.getContext()?.type))liff.sendMessages([{type:'text',text:`🛵 ${oid} → ${j.rider.name}\n📍 ${el('place').value.trim()}\nTracking link ready.`}]).catch(()=>{})}catch{}
}
async function copy(id){const v=el(id).value;try{await navigator.clipboard.writeText(v);el('copied').textContent='Copied.'}catch{el(id).select();el('copied').textContent='Long-press the link to copy.'}}
el('copyCust').addEventListener('click',()=>copy('custLink'));el('copyRider').addEventListener('click',()=>copy('riderLink'));
el('shareCust').addEventListener('click',async()=>{try{await liff.shareTargetPicker([{type:'text',text:`Your DANK BKK delivery is on its way soon 🛵\nTrack your rider here:\n${el('custLink').value}`}])}catch{copy('custLink')}});
el('another').addEventListener('click',async()=>{picked=null;dest=null;el('place').value='';el('rider').value='';riderChanged();el('note').value='';resetNewOrder();el('done').classList.add('hidden');el('form').classList.remove('hidden');await loadOrders();renderOrders()});

async function loadOrders(want){orders=(await api('GET',{action:'pending',...(want?{id:want}:{})})).orders||[]}
(async()=>{
  try{
    const {liffId}=await (await fetch('/api/delivery?action=liff-config',{cache:'no-store'})).json();
    if(!liffId||!window.liff)return fatal('The LINE form is not set up yet. Ask the manager to add LINE_LIFF_ID, or use the staff portal.');
    await liff.init({liffId});
    if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}
    idToken=liff.getIDToken()||'';if(!idToken)return fatal('LINE did not share your sign-in. Close and reopen the form.');
    const want=new URLSearchParams(location.search).get('order')||'';
    await loadOrders(want);
    el('loading').classList.add('hidden');el('form').classList.remove('hidden');
    resetNewOrder();
    const pre=orders.find(o=>o.orderId===want);if(pre){setMode('web');pickOrder(pre)}else{setMode('new');renderOrders()}
    loadRiders();initPlaces();loadMenu();
  }catch(e){fatal(e.message||'Could not open the form. Close and try again.')}
})();
</script>
</body></html>
